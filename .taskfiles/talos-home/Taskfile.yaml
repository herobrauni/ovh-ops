---
version: '3'

env:
  KUBECONFIG: '{{.ROOT_DIR}}/kubeconfig-home'
  TALOSCONFIG: '{{.ROOT_DIR}}/talos-home/clusterconfig/talosconfig'

vars:
  TALOS_HOME_DIR: '{{.ROOT_DIR}}/talos-home'
  HOME_CONTROLLER:
    sh: TALOSCONFIG='{{.ROOT_DIR}}/talos-home/clusterconfig/talosconfig' talosctl config info -o yaml | yq -e '.endpoints[0]'

tasks:

  generate-config:
    desc: Generate home-cluster Talos configuration
    dir: '{{.TALOS_HOME_DIR}}'
    cmd: talhelper genconfig
    preconditions:
      - test -f {{.TALOS_HOME_DIR}}/talconfig.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talhelper

  bootstrap:full:
    desc: Bootstrap the home cluster (assumes Talos configs were applied insecurely)
    cmds:
      - task: bootstrap:kube
      - task: bootstrap:kubeconfig
      - task: bootstrap:wait
      - task: bootstrap:apps
    preconditions:
      - which talosctl yq kubectl helmfile

  bootstrap:kube:
    desc: Bootstrap Kubernetes on the home cluster
    dir: '{{.TALOS_HOME_DIR}}'
    cmd: talhelper gencommand bootstrap | bash

  bootstrap:kubeconfig:
    desc: Fetch home-cluster kubeconfig into ./kubeconfig-home
    cmd: |
      talosctl -n {{.HOME_CONTROLLER}} kubeconfig --force '{{.ROOT_DIR}}/kubeconfig-home'
      yq -i '.current-context = "home"' '{{.ROOT_DIR}}/kubeconfig-home'

  bootstrap:wait:
    desc: Wait for home-cluster nodes to be Ready
    cmd: kubectl wait --for=condition=Ready node --all --timeout=10m

  bootstrap:apps:
    desc: Helmfile bootstrap (cilium, flux-operator, flux-instance)
    dir: '{{.ROOT_DIR}}/kubernetes-home/bootstrap'
    cmd: helmfile apply -f helmfile.d
    preconditions:
      - test -f {{.KUBECONFIG}}
      - which helmfile

  apply-node:
    desc: Apply Talos config to a home node [IP=required]
    dir: '{{.TALOS_HOME_DIR}}'
    cmd: talhelper gencommand apply --node {{.IP}} --extra-flags '--mode={{.MODE}}' | bash
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq

  upgrade-node:
    desc: Upgrade Talos on a home node [IP=required]
    dir: '{{.TALOS_HOME_DIR}}'
    cmd: talhelper gencommand upgrade --node {{.IP}} --extra-flags "--image='{{.TALOS_IMAGE}}:{{.TALOS_VERSION}}' --timeout=10m" | bash
    vars:
      TALOS_IMAGE:
        sh: yq '.nodes[] | select(.ipAddress == "{{.IP}}") | .talosImageURL // "ghcr.io/siderolabs/installer"' {{.TALOS_HOME_DIR}}/talconfig.yaml
      TALOS_VERSION:
        sh: yq '.talosVersion' {{.TALOS_HOME_DIR}}/talenv.yaml
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which kubectl talhelper talosctl yq

  reset:
    desc: Resets home-cluster nodes back to maintenance mode
    dir: '{{.TALOS_HOME_DIR}}'
    prompt: This will destroy the home cluster and reset the nodes... continue?
    cmd: talhelper gencommand reset --extra-flags="--reboot --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL --graceful=false --wait=false" | bash
    preconditions:
      - which talhelper
