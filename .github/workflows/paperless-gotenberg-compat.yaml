---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Paperless Gotenberg Compatibility

# Renovate bumps the paperless and gotenberg images independently, but the
# gotenberg-client pinned inside the paperless image has a hardcoded view of
# gotenberg's HTTP API. A gotenberg major that the client does not speak breaks
# every conversion (gotenberg 9 moved /forms/pdfengines/* and renamed the pdfa
# fields).
#
# An incompatible pair is an expected, self-explaining outcome rather than a
# broken build, so this job does not go red: it closes the PR with the evidence
# attached. Red would block nothing here (main has no branch protection) and
# only produce a failure mail per gotenberg release. Closing keeps the invariant
# without the noise, and renovate does not recreate a closed non-immortal PR.
on:
  pull_request:
    paths:
      - .github/workflows/paperless-gotenberg-compat.yaml
      - kubernetes/apps/selfhosted/paperless/app/helmrelease.yaml
      - util/check_paperless_gotenberg_compat.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/paperless-gotenberg-compat.yaml
      - kubernetes/apps/selfhosted/paperless/app/helmrelease.yaml
      - util/check_paperless_gotenberg_compat.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: v2026.11.0
          sha256: 71eb4f1b66b8bd69eb44cedcf0b22205859ea1ae2b2f557e48b35656079a94a9
          install_args: aqua:mikefarah/yq

      - name: Check gotenberg compatibility
        id: compat
        continue-on-error: true
        run: |
          set -o pipefail
          bash util/check_paperless_gotenberg_compat.sh 2>&1 | tee "$RUNNER_TEMP/compat.log"

      - name: Close incompatible pair PR
        if: >-
          steps.compat.outcome == 'failure'
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          LOG: ${{ runner.temp }}/compat.log
        run: |
          if gh pr view "$PR_NUMBER" --repo "$REPO" --json comments -q '.comments[].body' \
            | grep -qF 'Closing this PR automatically'; then
            echo "already commented, nothing to do"
            exit 0
          fi

          {
            echo "Closing this PR automatically: the gotenberg image proposed here removes HTTP API that the \`gotenberg-client\` inside the paperless image we deploy still calls, so paperless would get 404/400 on every conversion."
            echo
            echo '```'
            # skip the mise install noise, drop ANSI, keep the verdict
            awk '/ERROR:/{p=1} p' "$LOG" | sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' | head -40
            echo '```'
            echo
            echo 'The guard (`util/check_paperless_gotenberg_compat.sh`) resolves the client version from the lockfile of the paperless release we deploy, so it clears itself as soon as paperless ships a gotenberg-9-capable client — no pin, no renovate exception. Until then, closing is the mechanism.'
          } > "$RUNNER_TEMP/comment.md"

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh pr close "$PR_NUMBER" --repo "$REPO"
          echo "::notice::Closed #$PR_NUMBER as an incompatible paperless/gotenberg pair"
