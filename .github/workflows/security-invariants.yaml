---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Invariants

on:
  pull_request:
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_drift_detection.sh
      - util/check_security_invariants.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_drift_detection.sh
      - util/check_security_invariants.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: v2026.11.3
          sha256: c2f7e814cb39f60b7f67a0ff36cb805e94128bf2dff09d175309d0f095b8cc3b
          install_args: aqua:mikefarah/yq

      - name: Check security invariants
        run: bash util/check_security_invariants.sh

      - name: Check drift detection coverage
        run: bash util/check_drift_detection.sh

      - name: Check vendored operator sync
        run: bash util/check_vendored_operator_sync.sh
