---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Invariants

on:
  pull_request:
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_drift_detection.sh
      - util/check_security_invariants.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_drift_detection.sh
      - util/check_security_invariants.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: v2026.10.15
          sha256: e3b186d4c70627f27037be615becaf4acfb30e41fb6a1819486717dc94e4e2a9
          install_args: aqua:mikefarah/yq

      - name: Check security invariants
        run: bash util/check_security_invariants.sh

      - name: Check drift detection coverage
        run: bash util/check_drift_detection.sh

      - name: Check vendored operator sync
        run: bash util/check_vendored_operator_sync.sh
