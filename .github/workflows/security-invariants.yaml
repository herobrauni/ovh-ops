---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Invariants

on:
  pull_request:
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_security_invariants.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_security_invariants.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: v2026.8.10
          sha256: 1f5e8795d24073904ef20ba70c1250ad6389d8c5672226d152e0ed24909ba72f
          install_args: aqua:mikefarah/yq

      - name: Check security invariants
        run: bash util/check_security_invariants.sh
