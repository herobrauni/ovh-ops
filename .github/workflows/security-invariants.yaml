---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Invariants

on:
  pull_request:
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_security_invariants.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_security_invariants.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: v2026.8.12
          sha256: f2092b1e67f0abc8803d3be120dd2bc5b656dd99680ba3159f710e149da10d05
          install_args: aqua:mikefarah/yq

      - name: Check security invariants
        run: bash util/check_security_invariants.sh
