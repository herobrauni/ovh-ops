---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Invariants

on:
  pull_request:
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_security_invariants.sh
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-invariants.yaml
      - .mise.toml
      - kubernetes/**
      - util/check_security_invariants.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: v2026.8.5
          sha256: ee362b6d96c648e27325a8bc7ee866bde4fffc20c88c777c5eb5c3b5c6f3e226
          install_args: aqua:mikefarah/yq

      - name: Check security invariants
        run: bash util/check_security_invariants.sh
