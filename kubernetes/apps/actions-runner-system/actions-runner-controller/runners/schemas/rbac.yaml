---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schemas-runner
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: schemas-runner-crd-reader
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: schemas-runner-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: schemas-runner-crd-reader
subjects:
  - kind: ServiceAccount
    name: schemas-runner
    namespace: actions-runner-system
