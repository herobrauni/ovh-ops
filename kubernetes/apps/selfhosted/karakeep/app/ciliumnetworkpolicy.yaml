        - matchLabels:
            app.kubernetes.io/name: karakeep
            app.kubernetes.io/instance: karakeep
            app.kubernetes.io/component: application
      toPorts:
        - ports:
            - port: "9222"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchPattern: "*"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
  egressDeny:
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: karakeep-meilisearch
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: karakeep
      app.kubernetes.io/instance: karakeep
      app.kubernetes.io/component: meilisearch
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: karakeep
            app.kubernetes.io/instance: karakeep
            app.kubernetes.io/component: application
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
  egress: []
