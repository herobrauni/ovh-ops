---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  annotations:
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 200"]
      url: https://vaultwarden.brauni.dev
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Selfhosted
    gethomepage.dev/name: Vaultwarden
    gethomepage.dev/pod-selector: app.kubernetes.io/name=vaultwarden
    gethomepage.dev/icon: si-bitwarden-#175DDC
spec:
  hostnames:
    - vaultwarden.brauni.dev
  parentRefs:
    - name: envoy-brauni-dev-public
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden-admin
  annotations:
    # /admin is behind authentik's ext-auth, so an unauthenticated probe is a 302 to
    # sso.brauni.dev instead of a 200. Without `ignore-redirect` gatus would follow
    # that redirect and end up asserting the login form, so assert the 302 itself.
    gatus.home-operations.com/endpoint: |-
      client:
        ignore-redirect: true
      conditions: ["[STATUS] == 302"]
spec:
  hostnames:
    - vaultwarden.brauni.dev
  parentRefs:
    - name: envoy-brauni-dev-public
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      backendRefs:
        - name: vaultwarden
          port: 80
