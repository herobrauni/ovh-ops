---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vaultwarden
spec:
  targetNamespace: selfhosted
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/cnpg
    - ../../../../components/dnsendpoint
    - ../../../../components/kopiur
    - ../../../../components/kopiur-verify-deep
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: dbms
    - name: infisical
      namespace: external-secrets
    - name: kopiur-repository
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/selfhosted/vaultwarden/app
  postBuild:
    substitute:
      APP: *app
      DOMAIN: brauni.dev
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_ON_MISSING_SNAPSHOT: Fail
      KOPIUR_VERIFY_DEEP_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
