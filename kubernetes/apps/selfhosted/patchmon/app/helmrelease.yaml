---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app patchmon
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      app:
        # Without a second controller in this release app-template drops the
        # identifier from the Deployment name, which would recreate patchmon-app
        # as "patchmon". Pin the existing name so this change only rolls the pod.
        forceRename: patchmon-app
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: patchmon-secret,patchmon-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: patchmon-initdb-secret
        containers:
          app:
            image:
              repository: ghcr.io/patchmon/patchmon-server
              tag: 2.1.8@sha256:e1dff331c629db567ffc221be4817fcd75f35ee6f60d17619b26445bc7a27dd5
            env:
              APP_ENV: production
              PORT: "3000"
              SERVER_PROTOCOL: https
              SERVER_HOST: patchmon.riki.boo
              SERVER_PORT: "443"
              CORS_ORIGIN: https://patchmon.riki.boo
              LOG_LEVEL: info
              ENABLE_LOGGING: "true"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: patchmon-pguser-secret
                    key: uri
              REDIS_HOST: patchmon-dragonfly
              REDIS_PORT: "6379"
              REDIS_DB: "0"
              TRUST_PROXY: "true"
              ENABLE_HSTS: "true"
              DEFAULT_USER_ROLE: user
            envFrom:
              - secretRef:
                  name: patchmon-secret
            probes:
              # /health blocks while redis (patchmon-dragonfly) is unreachable, and
              # app-template's 1s default timeout + threshold 3 liveness-killed the
              # app on every dragonfly blip (STS recreation, evictions). Give
              # liveness enough headroom (~60s) to ride out a redis outage.
              liveness:
                enabled: true
                custom: true
                spec:
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 6
                  httpGet:
                    path: /health
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: patchmon.riki.boo
              readiness:
                enabled: true
                custom: true
                spec:
                  timeoutSeconds: 5
                  httpGet:
                    path: /health
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: patchmon.riki.boo
              startup:
                enabled: true
                custom: true
                spec:
                  timeoutSeconds: 5
                  failureThreshold: 30
                  periodSeconds: 10
                  httpGet:
                    path: /health
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: patchmon.riki.boo
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        primary: true
        controller: app
        forceRename: patchmon
        ports:
          http:
            port: &httpPort 3000

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            url: https://patchmon.riki.boo
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/name: PatchMon
          gethomepage.dev/pod-selector: app.kubernetes.io/name=patchmon,app.kubernetes.io/controller=app
          gethomepage.dev/icon: mdi-package-up
        hostnames:
          - patchmon.riki.boo
        parentRefs:
          - name: envoy-riki-boo-public
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *httpPort

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
