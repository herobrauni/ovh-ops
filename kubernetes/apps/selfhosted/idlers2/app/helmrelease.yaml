---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: idlers2
spec:
  chartRef:
    kind: OCIRepository
    name: idlers2
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      idlers2:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          mariadb:
            image:
              repository: docker.io/library/mariadb
              tag: 12.3.2@sha256:a02fe89cb597d4375812b2eac90cf9d0775d4686daa7f7cc750ebbcad7525bbc
            args:
              - --character-set-server=utf8mb4
              - --collation-server=utf8mb4_unicode_ci
            envFrom:
              - secretRef:
                  name: idlers2-db-secret
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          wait-for-mariadb:
            image:
              repository: docker.io/library/mariadb
              tag: 12.3.2@sha256:a02fe89cb597d4375812b2eac90cf9d0775d4686daa7f7cc750ebbcad7525bbc
            command:
              - /bin/sh
              - -c
              - |
                until mariadb-admin ping -h 127.0.0.1 -u"$${DB_USERNAME}" -p"$${DB_PASSWORD}"; do sleep 2; done
            # Gates on the unprivileged application credentials rather than the
            # root ones, so this also proves the grant the app actually needs.
            envFrom: &appEnvFrom
              - secretRef:
                  name: idlers2-app-secret
        containers:
          app:
            image:
              repository: ghcr.io/alteredparadox/my-idlers
              tag: 4.1.0-ap.13@sha256:62289fe9dd7242f82224884f9adf76f0fe62da41a11d158c79499a038dab59d6
            env:
              DB_HOST: 127.0.0.1
              DB_PORT: "3306"
              APP_URL: https://idlers2.brauni.dev
              # Applies the fork's newer migrations on boot. The image otherwise
              # refuses to start against a database with pending migrations.
              AUTO_MIGRATE: "true"
              # TLS terminates at Envoy; without trusting the proxy the app sees
              # scheme http and the signed YABS ingest URLs fail validation.
              TRUSTED_PROXIES: "*"
              SESSION_SECURE_COOKIE: "true"
            envFrom: *appEnvFrom
            probes:
              # The entrypoint caches config/routes/views and runs migrations
              # before supervisord ever starts, so first boot is slow; a startup
              # probe absorbs that instead of letting liveness kill the pod
              # mid-migration.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /login
                    port: &port 8000
                    # TrustHosts rejects any host other than APP_URL's, so a
                    # bare-IP probe would 400 against a perfectly healthy app.
                    httpHeaders:
                      - name: Host
                        value: idlers2.brauni.dev
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              # This image cannot run unprivileged: the entrypoint writes
              # .env.production into the root-owned /app, so a www-data UID
              # fails before the app starts. Root plus the narrowest working
              # cap set is the same trade-off the s6-overlay images here make.
              #   SETUID/SETGID - nginx and php-fpm drop their workers to the
              #                   nginx/www-data users.
              #   DAC_OVERRIDE  - `artisan config:cache`/`view:cache` run as
              #                   root but write into www-data-owned
              #                   bootstrap/cache and storage/framework.
              #   CHOWN         - the entrypoint re-chowns /app/database.
              # FOWNER was dropped: nothing here chmods a file it does not own.
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: idlers2
        ports:
          http:
            port: *port
    route:
      brauni-dev:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            url: https://idlers2.brauni.dev
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/name: Idlers 2
          gethomepage.dev/pod-selector: app.kubernetes.io/name=idlers2
          gethomepage.dev/icon: mdi-application-cog
        hostnames:
          - idlers2.brauni.dev
        parentRefs:
          - name: envoy-brauni-dev-public
            namespace: network
            sectionName: https
    persistence:
      db:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          idlers2:
            mariadb:
              - path: /var/lib/mysql
                subPath: mariadb
      mysqld-run:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          idlers2:
            mariadb:
              - path: /run/mysqld
      tmp:
        type: emptyDir
        advancedMounts:
          idlers2:
            app:
              - path: /tmp
            mariadb:
              - path: /tmp
