---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/external-secrets.io/externalsecret_v1.json
# Split deliberately: the internet-facing PHP container is the most likely
# thing to be compromised here, and it has no use for the MariaDB root
# password. Keeping MYSQL_* out of its environment means a foothold in the app
# is limited to the unprivileged application database user.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idlers2-app
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: idlers2-app-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # TEMPORARY: /idlers/APP_KEY does not exist in Infisical yet, and a
        # missing remoteRef fails the whole ExternalSecret — which, with the
        # Recreate strategy, would take the app down rather than stall it.
        # Until that secret is created this stays derived from an existing
        # value; MYSQL_ROOT_PASSWORD is fetched for the derivation only and is
        # deliberately not templated into the Secret, so it never reaches the
        # app container. Swap both this line and the remoteRef below once the
        # real key exists.
        APP_KEY: "base64:{{ .MYSQL_ROOT_PASSWORD | sha256sum | trunc 32 | b64enc }}"
        DB_DATABASE: "{{ .DB_DATABASE }}"
        DB_USERNAME: "{{ .DB_USERNAME }}"
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
  # The DB_* values are intentionally the same /idlers/* ones the original
  # instance uses. Each instance runs its own MariaDB sidecar on pod-local
  # 127.0.0.1 with its own PVC, and neither is published through a Service, so
  # shared credentials cannot let one instance reach the other's data.
  data:
    # TEMPORARY: replace with `key: /idlers/APP_KEY` (secretKey: APP_KEY) once
    # that secret exists. See the template note above.
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: /idlers/MYSQL_ROOT_PASSWORD
    - secretKey: DB_DATABASE
      remoteRef:
        key: /idlers/DB_DATABASE
    - secretKey: DB_USERNAME
      remoteRef:
        key: /idlers/DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /idlers/DB_PASSWORD
---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idlers2-db
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: idlers2-db-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MYSQL_ROOT_PASSWORD: "{{ .MYSQL_ROOT_PASSWORD }}"
        MYSQL_USER: "{{ .MYSQL_USER }}"
        MYSQL_PASSWORD: "{{ .MYSQL_PASSWORD }}"
        MYSQL_DATABASE: "{{ .MYSQL_DATABASE }}"
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: /idlers/MYSQL_ROOT_PASSWORD
    - secretKey: MYSQL_USER
      remoteRef:
        key: /idlers/MYSQL_USER
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: /idlers/MYSQL_PASSWORD
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: /idlers/MYSQL_DATABASE
