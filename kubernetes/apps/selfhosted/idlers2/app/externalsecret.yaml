---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idlers2
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: idlers2-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_DATABASE: "{{ .DB_DATABASE }}"
        DB_USERNAME: "{{ .DB_USERNAME }}"
        DB_PASSWORD: "{{ .DB_PASSWORD }}"
        MYSQL_ROOT_PASSWORD: "{{ .MYSQL_ROOT_PASSWORD }}"
        MYSQL_USER: "{{ .MYSQL_USER }}"
        MYSQL_PASSWORD: "{{ .MYSQL_PASSWORD }}"
        MYSQL_DATABASE: "{{ .MYSQL_DATABASE }}"
        # The AlteredParadox image refuses to boot without an APP_KEY and must
        # get the *same* one on every restart (it signs session cookies and
        # signed URLs). Deriving it from an existing /idlers value keeps that
        # stability without adding a second Infisical folder for what is
        # deliberately a clone of the original instance's credentials.
        # Laravel's AES-256-CBC needs exactly 32 bytes: 32 hex chars of the
        # digest, base64-encoded, is what `php artisan key:generate` produces.
        APP_KEY: "base64:{{ .MYSQL_ROOT_PASSWORD | sha256sum | trunc 32 | b64enc }}"
  # Intentionally the same /idlers/* values as the original instance. The two
  # deployments each run their own MariaDB sidecar on pod-local 127.0.0.1 with
  # their own PVC, and neither MariaDB is reachable through a Service, so
  # sharing credentials cannot make them reach each other's data.
  data:
    - secretKey: DB_DATABASE
      remoteRef:
        key: /idlers/DB_DATABASE
    - secretKey: DB_USERNAME
      remoteRef:
        key: /idlers/DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /idlers/DB_PASSWORD
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: /idlers/MYSQL_ROOT_PASSWORD
    - secretKey: MYSQL_USER
      remoteRef:
        key: /idlers/MYSQL_USER
    - secretKey: MYSQL_PASSWORD
      remoteRef:
        key: /idlers/MYSQL_PASSWORD
    - secretKey: MYSQL_DATABASE
      remoteRef:
        key: /idlers/MYSQL_DATABASE
