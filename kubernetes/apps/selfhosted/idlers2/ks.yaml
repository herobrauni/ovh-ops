---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app idlers2
spec:
  targetNamespace: &namespace selfhosted
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/kopiur
  dependsOn:
    - name: infisical
      namespace: external-secrets
    - name: kopiur-repository
      namespace: kopiur-system
    - name: envoy-gateway-brauni-dev
      namespace: network
    - name: rook-ceph-cluster
      namespace: rook-ceph
  path: ./kubernetes/apps/selfhosted/idlers2/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 1h
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_ON_MISSING_SNAPSHOT: Fail
