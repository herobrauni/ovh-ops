---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: scanopy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      scanopy:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Creates the scanopy database and role in the shared postgres18 cluster
          # from the components/cnpg secret. Idempotent, runs on every pod start.
          postgres-init:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
            envFrom:
              - secretRef:
                  name: scanopy-initdb-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/scanopy/scanopy/server
              # Community Edition server. Pinned by index digest: this process holds
              # the DB URI and (later) the daemon's API surface, and `latest` is what
              # the upstream compose file ships by default.
              tag: v0.19.6@sha256:5a8eea1fb72759deeedcf0e7c3a25f9193c2e3a53f59a6ecf5353e0bfa2def65
            env:
              # components/cnpg builds this: postgresql://scanopy:<pw>@postgres18-rw.dbms.svc.cluster.local:5432/scanopy
              SCANOPY_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: scanopy-pguser-secret
                    key: uri
              # Only used to build invite and password-reset links; the whole app is
              # reachable solely over the tailnet, so no public DNS record exists.
              SCANOPY_PUBLIC_URL: https://scanopy.brill-bebop.ts.net
              SCANOPY_LOG_LEVEL: info
              # The published server image ships the SPA build at /app/static but does
              # not embed it, so without this the process starts API-only and every UI
              # route 404s ("web UI is disabled (API-only)" in the startup banner).
              SCANOPY_WEB_EXTERNAL_PATH: /app/static
              # TLS terminates at the tailscale ingress proxy; without this the
              # session cookie is issued as non-Secure and browsers drop it.
              SCANOPY_USE_SECURE_SESSION_COOKIES: "true"
            probes:
              # The server exposes no documented health route we could confirm against
              # this build, so probe the listener rather than guess a path.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 60072
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 60072
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 60072
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              # The image sets no USER, so it starts as root and writes /app and
              # /data as root. Same trade-off as the s6/entrypoint images here: root
              # with every capability dropped, not a guessed uid that fails on boot.
              # Tightening to a fixed nonroot uid is a follow-up, not a first guess.
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: scanopy
        ports:
          http:
            port: 60072
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          scanopy:
            app:
              - path: /data
