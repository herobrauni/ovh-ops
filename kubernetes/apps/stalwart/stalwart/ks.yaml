---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app stalwart
spec:
  targetNamespace: &namespace stalwart
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Shared postgres18 cluster: ${APP}-initdb-secret bootstraps DB+role and
    # ${APP}-pguser-secret carries the credentials the server needs.
    # NOTE: the component's pgdump/VolSync objects (components/cnpg/pgdump.yaml)
    # are referenced by no app today, so this PR ships no database backup for
    # Stalwart. Wire one before real mail lands - see docs/agents/stalwart.md.
    - ../../../../components/cnpg
    # In-memory store + coordinator: a Redis-protocol instance from the operator
    # the cluster already runs (${APP}-dragonfly, its snapshot PVC, PodMonitor
    # and CiliumNetworkPolicy). docs/agents/stalwart.md covers why this is
    # Dragonfly instead of Keep/Valkey, and what to watch for.
    - ../../../../components/dragonfly
  dependsOn:
    - name: infisical
      namespace: external-secrets
    - name: cloudnative-pg-cluster
      namespace: dbms
    - name: dragonfly
      namespace: dbms
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/stalwart/stalwart/app
  postBuild:
    substitute:
      APP: *app
      # 2 gives the operator a master/replica pair with automatic promotion and a
      # Service that selects whichever pod currently carries `role: master`. Not
      # a quorum: during promotion the store is briefly unavailable, and Stalwart
      # responds to a gap in the event stream by discarding caches and
      # re-checking its queues, so the failure mode is delay rather than loss.
      DRAGONFLY_REPLICAS: "2"
      DRAGONFLY_SNAPSHOT_CAPACITY: 256Mi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
