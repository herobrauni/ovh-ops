---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app stalwart
spec:
  targetNamespace: &namespace stalwart
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Shared postgres18 cluster: ${APP}-initdb-secret bootstraps DB+role and
    # ${APP}-pguser-secret carries the credentials the server needs. The
    # component also wires the nightly pg_dumpall -> kopia backup, which for
    # mail is not optional: the data store holds accounts, config and metadata.
    - ../../../../components/cnpg
  dependsOn:
    - name: infisical
      namespace: external-secrets
    - name: cloudnative-pg-cluster
      namespace: dbms
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: keep
      namespace: stalwart
  interval: 1h
  path: ./kubernetes/apps/stalwart/stalwart/app
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
