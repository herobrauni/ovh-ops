---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart-480p-com
  annotations:
    gatus.home-operations.com/endpoint: |-
      url: https://stalwart.480p.com/healthz/ready
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Selfhosted
    gethomepage.dev/name: Stalwart
    gethomepage.dev/description: Mail & Collaboration Server
    gethomepage.dev/pod-selector: app.kubernetes.io/name=stalwart
    gethomepage.dev/icon: mdi-email
spec:
  hostnames:
    - stalwart.480p.com
  parentRefs:
    - name: envoy-480p-com-public
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: CORS
          cors:
            allowOrigins:
              - https://webmail.480p.com
            allowMethods:
              - POST
              - GET
              - PATCH
              - PUT
              - DELETE
              - HEAD
              - OPTIONS
            allowHeaders:
              - Authorization
              - Content-Type
              - Accept
              - X-Requested-With
            maxAge: 3600
      backendRefs:
        - name: stalwart-mgmt
          port: 8080
