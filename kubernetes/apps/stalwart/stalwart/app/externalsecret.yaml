---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stalwart-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Bootstrap credential only. Remove the KEEP_RECOVERY_ADMIN reference once
        # a permanent administrator exists and delete the secret from Infisical:
        # an always-present recovery admin is a standing backdoor (upstream
        # discourages leaving STALWART_RECOVERY_ADMIN set in production).
        STALWART_RECOVERY_ADMIN: "{{ .STALWART_RECOVERY_ADMIN_USER }}:{{ .STALWART_RECOVERY_ADMIN_PASSWORD }}"
  data:
    - secretKey: STALWART_RECOVERY_ADMIN_USER
      remoteRef:
        key: /stalwart/STALWART_RECOVERY_ADMIN_USER
    - secretKey: STALWART_RECOVERY_ADMIN_PASSWORD
      remoteRef:
        key: /stalwart/STALWART_RECOVERY_ADMIN_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keep-client
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: keep-client
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Keep speaks mutual TLS 1.3 with raw public keys by default. All three
        # Stalwart nodes share one client identity: per-node keys would need a
        # per-pod secret source, and the coordinator holds no long-lived data.
        client.key: "{{ .STALWART_CLIENT_KEY_B64 | b64dec }}"
        servers.pem: "{{ .KEEP_SERVERS_PEM_B64 | b64dec }}"
  data:
    - secretKey: STALWART_CLIENT_KEY_B64
      remoteRef:
        key: /stalwart/STALWART_CLIENT_KEY_B64
    - secretKey: KEEP_SERVERS_PEM_B64
      remoteRef:
        key: /stalwart/KEEP_SERVERS_PEM_B64
