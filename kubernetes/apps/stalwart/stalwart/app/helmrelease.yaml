---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stalwart
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      stalwart:
        type: statefulset
        replicas: 3
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
        initContainers:
          # components/cnpg only ships the credential ExternalSecrets; creating
          # the database and role is the consuming app's job. Without this the
          # readiness probe fails against a database that does not exist yet.
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: stalwart-initdb-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
        containers:
          app:
            image:
              repository: docker.io/stalwartlabs/stalwart
              tag: v1.2.0@sha256:79ea09d25baad7e074d8df53db474571c5dc62621298e35e09e9cfd764333ed8
            args:
              - --config
              - /etc/stalwart/config.json
            env:
              STALWART_PUBLIC_URL: https://mail.480p.com
              STALWART_DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: stalwart-pguser-secret
                    key: password
              # In-memory store + coordinator (Dragonfly, master-selected
              # Service in this namespace).
              STALWART_REDIS_URL: redis://stalwart-dragonfly.stalwart.svc.cluster.local:6379
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthz/live
                port: 8080
              readiness:
                # 503 until a data store is open, which is what we want here.
                enabled: true
                type: HTTP
                path: /healthz/ready
                port: 8080
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              # Not for binding: every listener is high-numbered by design. The
              # image ships `setcap cap_net_bind_service=+ep` on the binary, and
              # exec of a file-capability binary requires that capability to
              # remain in the bounding set even when nothing privileged is
              # bound. Dropping it yields
              # `exec /usr/local/bin/stalwart: operation not permitted`.
              capabilities:
                drop: [ALL]
                add: [NET_BIND_SERVICE]
            resources:
              requests:
                cpu: 100m
                memory: 768Mi
              limits:
                memory: 3Gi

    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    service:
      # DNATed 1:1 from the three Proxmox hosts (docs/agents/stalwart.md).
      # localOnly so Cilium never forwards a connection to another node: the
      # public IP that accepted it must own the return path.
      mail:
        controller: stalwart
        type: NodePort
        externalTrafficPolicy: Local
        ports:
          smtp:
            port: 25
            nodePort: 30025
          submission:
            port: 587
            nodePort: 30587
          smtps:
            port: 465
            nodePort: 30465
          imaps:
            port: 993
            nodePort: 30993
          sieve:
            port: 4190
            nodePort: 30419
          https:
            port: 8443
            targetPort: 443
            nodePort: 30443
      mgmt:
        controller: stalwart
        type: ClusterIP
        primary: true
        ports:
          http:
            port: 8080

    persistence:
      config:
        type: configMap
        name: stalwart-config
        globalMounts:
          - path: /etc/stalwart
            readOnly: true
      tls:
        type: secret
        name: stalwart-tls
        globalMounts:
          - path: /etc/stalwart/tls
            readOnly: true
      # No PVC anywhere: mail bodies, state and search index live in Postgres.
      data:
        type: emptyDir
        globalMounts:
          - path: /var/lib/stalwart
      logs:
        # the default file tracer writes here; readOnlyRootFilesystem needs a mount
        type: emptyDir
        globalMounts:
          - path: /var/log/stalwart
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
