---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app stalwart-alias-bridge
spec:
  targetNamespace: stalwart
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: stalwart
      namespace: stalwart
  interval: 1h
  path: ./kubernetes/apps/stalwart/alias-bridge/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
