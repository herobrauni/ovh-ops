---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app stalwart-alias-bridge
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      stalwart-alias-bridge:
        containers:
          app:
            image:
              repository: ghcr.io/herobrauni/stalwart-alias-bridge
              tag: latest@sha256:c8589892975474ec15dd6c0d122b9acffde355f582193cea3287b634c4e2c07d
            env:
              LISTEN_ADDR: ":8080"
              STALWART_URL: http://stalwart-mgmt.stalwart.svc.cluster.local:8080
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthz
                port: &port 8080
              readiness:
                enabled: true
                type: HTTP
                path: /healthz
                port: *port
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi

    service:
      app:
        controller: stalwart-alias-bridge
        primary: true
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://alias.480p.com/healthz
        hostnames:
          - alias.480p.com
        parentRefs:
          - name: envoy-480p-com-public
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
