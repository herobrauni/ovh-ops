---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/namespace_v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: _
  labels:
    # `privileged` is not a preference here, it is the only level that permits a
    # hostNetwork pod, and Stalwart Keep needs hostNetwork: its member list holds
    # IP literals (scratch/ docs: cluster/keep/kubernetes). Keep is the only
    # hostNetwork workload in the namespace and is allowlisted in
    # util/check_security_invariants.sh; the Stalwart pods themselves carry a
    # restricted-compatible securityContext in their HelmRelease.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
