---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/apps/statefulset_v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keep
spec:
  serviceName: keep
  replicas: 3
  # Mandatory: a member starts fenced and only settles once a majority of the
  # list runs, so OrderedReady would deadlock on the first pod.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  minReadySeconds: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keep
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keep
    spec:
      # IP literals in `members` -> the pod must own the node's address.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      automountServiceAccountToken: false
      # 1s shard freeze + up to 11s key handoff; upstream minimum is 16.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: keep
              topologyKey: kubernetes.io/hostname
      containers:
        - name: keep
          image: docker.io/stalwartlabs/keep:v1.0.1@sha256:380c3c548635d1c18fb0107d969e2e40c25a23112764b08493fc14b1471f29c6
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KEEP_CONFIG
              value: /etc/keep/keep.toml
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec keep
              --node $(( ${POD_NAME##*-} + 1 ))
              --tls-key /secrets/keep-${POD_NAME##*-}.key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # Guaranteed QoS: Keep sizes one shard per CPU in its budget and
            # spins for it, so requests must equal limits and the shard count in
            # keep.toml must match the limit (2).
            requests:
              cpu: 2
              memory: 1536Mi
            limits:
              cpu: 2
              memory: 1536Mi
          readinessProbe:
            exec:
              command: ["test", "-e", "/run/keep/settled"]
            periodSeconds: 1
          volumeMounts:
            - name: config
              mountPath: /etc/keep
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: run
              mountPath: /run/keep
            - name: tmp
              mountPath: /tmp
            - name: pin
              mountPath: /var/lib/keep-pin
      volumes:
        - name: config
          configMap:
            name: keep-config-1
        - name: secrets
          secret:
            secretName: keep-secrets
        - name: run
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: pin
      spec:
        storageClassName: keep-pin
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Mi
