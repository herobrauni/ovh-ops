---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keep
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: keep-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cluster: "{{ .KEEP_CLUSTER_SECRET }}"
        peer: "{{ .KEEP_PEER_SECRET }}"
        # PEM material is stored base64-encoded in Infisical so that newlines
        # survive, and decoded here.
        servers.pem: "{{ .KEEP_SERVERS_PEM_B64 | b64dec }}"
        clients.pem: "{{ .KEEP_CLIENTS_PEM_B64 | b64dec }}"
        keep-0.key: "{{ .KEEP_MEMBER0_KEY_B64 | b64dec }}"
        keep-1.key: "{{ .KEEP_MEMBER1_KEY_B64 | b64dec }}"
        keep-2.key: "{{ .KEEP_MEMBER2_KEY_B64 | b64dec }}"
  data:
    - secretKey: KEEP_CLUSTER_SECRET
      remoteRef:
        key: /stalwart/KEEP_CLUSTER_SECRET
    - secretKey: KEEP_PEER_SECRET
      remoteRef:
        key: /stalwart/KEEP_PEER_SECRET
    - secretKey: KEEP_SERVERS_PEM_B64
      remoteRef:
        key: /stalwart/KEEP_SERVERS_PEM_B64
    - secretKey: KEEP_CLIENTS_PEM_B64
      remoteRef:
        key: /stalwart/KEEP_CLIENTS_PEM_B64
    - secretKey: KEEP_MEMBER0_KEY_B64
      remoteRef:
        key: /stalwart/KEEP_MEMBER0_KEY_B64
    - secretKey: KEEP_MEMBER1_KEY_B64
      remoteRef:
        key: /stalwart/KEEP_MEMBER1_KEY_B64
    - secretKey: KEEP_MEMBER2_KEY_B64
      remoteRef:
        key: /stalwart/KEEP_MEMBER2_KEY_B64
