---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: keep-config-1
# Immutable and versioned on purpose: Keep reads this file only at start, so an
# edit would otherwise reach each member at whichever restart happened next.
# Change the member list by creating keep-config-2 and pointing the StatefulSet
# at it (that is a normal rolling update), and see docs/agents/stalwart.md for
# the probe change that a member-list edit also requires.
immutable: true
data:
  keep.toml: |
    # member ids are pinned to workers by the `pin` volume in persistentvolumes.yaml:
    #   keep-0 -> w-ovhsbg1 10.10.8.182
    #   keep-1 -> w-ovhsbg2 10.10.8.184
    #   keep-2 -> w-ovhsbg3 10.10.8.186
    # entry format: id@client_address/peer_port/shards, where shards must equal
    # the container's CPU limit (2 -> "2" below).
    members = [
      "1@10.10.8.182:7000/7100/2",
      "2@10.10.8.184:7000/7100/2",
      "3@10.10.8.186:7000/7100/2",
    ]
    secret-file = "/secrets/cluster"
    peer-secret-file = "/secrets/peer"
    tls-clients = "/secrets/clients.pem"
    tls-servers = "/secrets/servers.pem"
    stats-interval = 1
    ready-file = "/run/keep/settled"
    # must stay below the container memory limit, which is 1536Mi
    memory = 1073741824
