---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app keep
spec:
  targetNamespace: &namespace stalwart
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: infisical
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/stalwart/keep/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Keep is raw manifests (no chart upstream) and members come up fenced until a
  # majority runs, so a health gate here would block the whole reconcile.
  wait: false
