---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authentik-outpost-backendrefs
spec:
  from:
    # SecurityPolicy.extAuth.http.backendRefs pointing at Service authentik-server.
    # One entry per consumer namespace — widened as apps migrate off TinyAuth.
    # Outpost HTTPRoutes live in ns authentik and reference the Service locally,
    # so HTTPRoute backendRefs do not require ReferenceGrants.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: flux-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: media
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: selfhosted
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: volsync-system
  to:
    - group: ""
      kind: Service
      name: authentik-server
