---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
      version: 2026.8.5
  interval: 30m
  values:
    postgresql:
      enabled: false

    serviceAccount:
      create: false

    authentik:
      existingSecret:
        secretName: authentik-secret
      web:
        path: /

    global:
      env:
        # Disable Gunicorn request-count worker recycling: by default Gunicorn
        # recycles workers after 1000 requests. When worker 1 recycles, its
        # post_worker_init triggers root_app.call_startup() -> proxy_set_defaults(),
        # which acquires SELECT ... FOR UPDATE across all ProxyProviders and wipes/rebuilds
        # outpost guardian permissions in a loop (~3 times/hour under Gatus probe traffic).
        # Setting to 0 disables request-count recycling to eliminate steady-state deadlocks.
        - name: AUTHENTIK_WEB__MAX_REQUESTS
          value: "0"
        - name: AUTHENTIK_WEB__MAX_REQUESTS_JITTER
          value: "0"
        - name: AUTHENTIK_POSTGRESQL__HOST
          valueFrom:
            secretKeyRef:
              name: &pguser authentik-pguser-secret
              key: host
        - name: AUTHENTIK_POSTGRESQL__PORT
          valueFrom:
            secretKeyRef:
              name: *pguser
              key: port
        - name: AUTHENTIK_POSTGRESQL__NAME
          valueFrom:
            secretKeyRef:
              name: *pguser
              key: db
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: *pguser
              key: user
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: *pguser
              key: password
      image:
        repository: ghcr.io/goauthentik/server
        tag: 2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
      podAnnotations:
        reloader.stakater.com/auto: "true"
        secret.reloader.stakater.com/reload: authentik-secret,authentik-initdb-secret,authentik-pguser-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: authentik
        - name: blueprints
          configMap:
            name: authentik-blueprints
      volumeMounts:
        - name: media
          mountPath: /media
        - name: blueprints
          mountPath: /blueprints/custom

    server:
      serviceAccountName: authentik
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
          envFrom:
            - secretRef:
                name: authentik-initdb-secret
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 768Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 1m
          scrapeTimeout: 10s
      route:
        main:
          enabled: true
          annotations:
            gatus.home-operations.com/endpoint: |-
              conditions: ["[STATUS] == 200"]
              url: https://sso.brauni.dev/-/health/live/
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Platform
            gethomepage.dev/name: Authentik
            gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik,app.kubernetes.io/component=server
            gethomepage.dev/icon: mdi-shield-account
          hostnames:
            - sso.brauni.dev
          parentRefs:
            - name: envoy-brauni-dev-public
              namespace: network
              sectionName: https

    worker:
      serviceAccountName: authentik
      automountServiceAccountToken: false
      # Serialize task execution: the chart default is 2 Dramatiq threads per
      # worker process, so two tasks run at once. A blueprint apply re-saves every
      # proxy provider, which enqueues one `outpost_send_update` per outpost —
      # with two threads those run concurrently with the apply that spawned them
      # and both rebuild guardian permissions, so Postgres aborts one with 40P01
      # (`deadlock detected ... guardian_roleobjectpermission`). The aborted
      # transaction silently rolls the apply back to a half-applied state while
      # the blueprint instance still reports `successful`. One thread removes the
      # intra-process race; task throughput is not a constraint here (no LDAP or
      # enterprise source syncs).
      env:
        - name: AUTHENTIK_WORKER__THREADS
          value: "1"
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
          envFrom:
            - secretRef:
                name: authentik-initdb-secret
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 1m
          scrapeTimeout: 10s

    prometheus:
      rules:
        enabled: true
