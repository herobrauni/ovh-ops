---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-outpost-480p-com
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-480p-com-public
      namespace: network
      sectionName: https
  hostnames:
    - altmount.480p.com
    - bazarr.480p.com
    - bazarr4k.480p.com
    - clonarr.480p.com
    - echo.480p.com
    - infinidysk.480p.com
    - prowlarr.480p.com
    - radarr.480p.com
    - radarr4k.480p.com
    - sonarr.480p.com
    - sonarr4k.480p.com
    - umlautadaptarrex.480p.com
    - zurg.480p.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          port: 80
