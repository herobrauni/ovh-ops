---
# yayamlls-disable-file (embedded blueprint ConfigMap; the goauthentik.io schema now mismatches the ConfigMap wrapper)
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# OIDC sign-in for `stalwart/bulwark` webmail (backed by Stalwart OIDC directory).
#
# `client_id` is pinned to `bulwark`; `client_secret` is generated by authentik
# and stored in Infisical at /bulwark/OIDC_CLIENT_SECRET.
version: 1
metadata:
  name: ovh-ops - Bulwark OIDC
  labels:
    blueprints.goauthentik.io/description: OIDC provider and application for Bulwark webmail.
entries:
  - id: mapping-bulwark-email
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "Bulwark Email Mapping"
    attrs:
      scope_name: email
      description: "Map Authentik username to @480p.com mail address for Bulwark/Stalwart"
      expression: |
        return {
            "email": f"{request.user.username}@480p.com",
            "email_verified": True,
        }

  - id: provider-bulwark-oidc
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Bulwark OIDC
    attrs:
      client_id: bulwark
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'openid'"],
          ]
        - !KeyOf mapping-bulwark-email
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'profile'"],
          ]
      # Bulwark uses localized callback URLs: /<locale>/auth/callback (e.g. /en/auth/callback).
      redirect_uris:
        - matching_mode: regex
          url: https://webmail\.480p\.com/([a-z]{2}/)?auth/callback

  - id: app-bulwark
    model: authentik_core.application
    identifiers:
      slug: bulwark
    attrs:
      name: Bulwark
      provider: !KeyOf provider-bulwark-oidc
      meta_launch_url: https://webmail.480p.com
      meta_description: JMAP Webmail

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-bulwark
      group: !Find [authentik_core.group, [name, Mail]]
      order: 0
