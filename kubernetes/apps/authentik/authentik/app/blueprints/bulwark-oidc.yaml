---
# yayamlls-disable-file (embedded blueprint ConfigMap; the goauthentik.io schema now mismatches the ConfigMap wrapper)
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# OIDC sign-in for `stalwart/bulwark` webmail (backed by Stalwart OIDC directory).
#
# `client_id` is pinned to `bulwark`; the client is **public** (PKCE, no secret). Stalwart's OIDC
# directory trusts exactly ONE issuer (Community has a single default directory), and authentik derives
# the issuer from the application slug — so the Stalwart **WebUI** has to reuse this client too
# (`oauthClientId: bulwark` in Stalwart). That is why the WebUI's callback URIs live here.
version: 1
metadata:
  name: ovh-ops - Bulwark OIDC
  labels:
    blueprints.goauthentik.io/description: OIDC provider and application for Bulwark webmail.
entries:
  - id: mapping-bulwark-email
    model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: "Bulwark Email Mapping"
    attrs:
      scope_name: email
      description: "Map Authentik username to @480p.com mail address for Bulwark/Stalwart"
      expression: |
        return {
            "email": f"{request.user.username}@480p.com",
            "email_verified": True,
        }

  - id: provider-bulwark-oidc
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Bulwark OIDC
    attrs:
      client_id: bulwark
      # Public + PKCE: the WebUI can only do `token_endpoint_auth_method: none`, and Bulwark treats an
      # empty `OAUTH_CLIENT_SECRET` as "no secret, use PKCE" (`g && f.set("client_secret", g)`).
      client_type: public
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'openid'"],
          ]
        - !KeyOf mapping-bulwark-email
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'profile'"],
          ]
        # REQUIRED: authentik only mints a refresh token when the *granted* scopes
        # include `offline_access` (providers/oauth2/views/token.py). Without this
        # mapping the requested `offline_access` is silently dropped, the code is
        # exchanged for an access token *without* a refresh_token, and Bulwark's
        # forced refresh (`PUT /api/auth/token?force=true` -> "No refresh token",
        # 401) deletes the session and bounces back to /login right after the
        # OAuth callback succeeds.
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [name, "authentik default OAuth Mapping: OpenID 'offline_access'"],
          ]
      # Bulwark uses localized callback URLs: /<locale>/auth/callback (e.g. /en/auth/callback).
      redirect_uris:
        - matching_mode: regex
          url: https://webmail\.480p\.com/([a-z]{2}/)?auth/callback
        # Stalwart WebUI: exact values from /admin/oauth-client.json and /account/oauth-client.json.
        - matching_mode: strict
          url: https://stalwart.480p.com/admin/oauth/callback
        - matching_mode: strict
          url: https://stalwart.480p.com/account/oauth/callback
        - matching_mode: strict
          url: https://mail.480p.com/admin/oauth/callback
        - matching_mode: strict
          url: https://mail.480p.com/account/oauth/callback

  - id: app-bulwark
    model: authentik_core.application
    identifiers:
      slug: bulwark
    attrs:
      name: Bulwark
      provider: !KeyOf provider-bulwark-oidc
      meta_launch_url: https://webmail.480p.com
      meta_description: JMAP Webmail

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-bulwark
      group: !Find [authentik_core.group, [name, Mail]]
      order: 0
