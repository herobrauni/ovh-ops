---
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Source of truth for every forward-auth object in this cluster: the Envoy Gateway
# `SecurityPolicy` resources in the app namespaces point their extAuth backend at the
# embedded outpost, and this blueprint defines the proxy providers/applications those
# requests are matched against.
#
# Managed here: users, groups, proxy providers, applications, application access
# bindings and the embedded outpost's provider list.
# Deliberately NOT managed here:
#   - passwords (set once per user in the UI or with `ak changepassword <username>`;
#     re-applying this blueprint never touches them)
#   - `client_id` / `client_secret` (auto-derived by `ProxyProvider.set_oauth_defaults()`
#     and not settable through the blueprint serializer)
#   - `property_mappings` (the same `set_oauth_defaults()` call adds the five managed
#     proxy/oauth2 scope mappings whenever a provider is created or updated)
#   - everything else on the embedded outpost (its config/name are left untouched)
#
# The impersonation cookie is host-only (`cookie_domain: ""`) on purpose: no cookie can
# span brauni.dev, riki.boo and 480p.com, so each hostname needs its own provider and
# users log in per app. Access is granted through a group + a policy binding per
# application - authentik's group bindings have no superuser bypass, so a group member
# is required even for `akadmin`.
version: 1
metadata:
  name: ovh-ops - Forward Auth
  labels:
    blueprints.goauthentik.io/description: Forward-auth providers, applications and access bindings for every host behind the embedded outpost.
entries:
  # ---------------------------------------------------------------------------
  # Reference-only: the two built-in flows every proxy provider is wired to.
  # These carry no attrs, so the blueprint never modifies the system flows.
  # ---------------------------------------------------------------------------
  - id: flow-authorization-implicit-consent
    model: authentik_flows.flow
    identifiers:
      slug: default-provider-authorization-implicit-consent
  - id: flow-invalidation
    model: authentik_flows.flow
    identifiers:
      slug: default-provider-invalidation-flow

  # ---------------------------------------------------------------------------
  # Groups. Membership is declared on the user entries below.
  # ---------------------------------------------------------------------------
  - id: group-media
    model: authentik_core.group
    identifiers:
      name: Media
  - id: group-platform
    model: authentik_core.group
    identifiers:
      name: Platform

  # ---------------------------------------------------------------------------
  # Users. No passwords here - see the header.
  # `authentik_testuser1` authenticates successfully but belongs to no group, so it
  # must be denied by every application and is used for negative tests.
  # ---------------------------------------------------------------------------
  - id: user-brauni
    model: authentik_core.user
    identifiers:
      username: brauni
    attrs:
      name: brauni
      email: brauni@brauni.dev
      is_active: true
      type: internal
      path: users
      groups:
        - !KeyOf group-media
        - !KeyOf group-platform
  - id: user-authentik-testuser1
    model: authentik_core.user
    identifiers:
      username: authentik_testuser1
    attrs:
      name: authentik_testuser1
      email: authentik_testuser1@brauni.dev
      is_active: true
      type: internal
      path: users
      groups: []

  # ---------------------------------------------------------------------------
  # Media (group: Media)
  # Liveness paths are skipped by the outpost so the in-cluster Gatus probes can
  # reach each app unauthenticated - see docs/authentik-forward-auth.md.
  # ---------------------------------------------------------------------------
  - id: provider-sonarr
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: Sonarr
    attrs:
      mode: forward_single
      cookie_domain: ""
      external_host: https://sonarr.480p.com
      skip_path_regex: ^/ping$
      authorization_flow: !KeyOf flow-authorization-implicit-consent
      invalidation_flow: !KeyOf flow-invalidation
  - id: app-sonarr
    model: authentik_core.application
    identifiers:
      slug: sonarr
    attrs:
      name: Sonarr
      provider: !KeyOf provider-sonarr
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-sonarr
      group: !KeyOf group-media
      order: 0

  - id: provider-radarr
    model: authentik_providers_proxy.proxyprovider
