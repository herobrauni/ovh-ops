---
# yayamlls-disable-file (embedded blueprint ConfigMap; the goauthentik.io schema now mismatches the ConfigMap wrapper)
# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Retires the separate Stalwart WebUI OAuth2 client.
#
# Stalwart's OIDC directory (v1.2, Community) trusts exactly ONE issuer, and authentik's issuer is derived
# from the application slug — so a second client for the WebUI can never be accepted by the same directory
# (symptom: the WebUI completes the OAuth flow, authentik mints tokens, Stalwart answers 401 and the SPA
# reports "Your session has expired"). The WebUI therefore reuses the `bulwark` client
# (`x:Application.oauthClientId: bulwark`), and this client is retired.
#
# Blueprints never delete objects whose entry they stop managing, hence the explicit `state: absent`.
# The Application is removed before the provider, and the provider after that, so nothing is left
# referencing a deleted provider (authentik cascades the application's policy binding).
version: 1
metadata:
  name: ovh-ops - Stalwart WebUI OIDC (retired)
  labels:
    blueprints.goauthentik.io/description: Retires the standalone Stalwart WebUI OAuth2 client.
entries:
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: stalwart

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: Stalwart WebUI OIDC
