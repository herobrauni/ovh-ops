---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrepository.yaml
  - ./serviceaccount.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./dnsendpoints.yaml
  - ./referencegrant.yaml
  - ./outpost-routes.yaml
configMapGenerator:
  - name: authentik-blueprints
    files:
      - forward-auth.yaml=./blueprints/forward-auth.yaml
      - infinidysk-oidc.yaml=./blueprints/infinidysk-oidc.yaml
      - infinidysk-v2-oidc.yaml=./blueprints/infinidysk-v2-oidc.yaml
      - silo-oidc.yaml=./blueprints/silo-oidc.yaml
      - mail-sso-retired.yaml=./blueprints/mail-sso-retired.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
