---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opendesk
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: opendesk-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Cluster-wide superuser password comes from components/cnpg; every
        # openDesk database gets its own role credential so one leaked app
        # password does not imply the others.
        postgres_super_password: "{{ .POSTGRES_SUPER_PASSWORD }}"
        redis_password: "{{ .REDIS_PASSWORD }}"
        keycloak_user_password: "{{ .KEYCLOAK_USER_PASSWORD }}"
        keycloak_extensions_user_password: "{{ .KEYCLOAK_EXTENSIONS_USER_PASSWORD }}"
        matrix_authentication_user_password: "{{ .MATRIX_AUTHENTICATION_USER_PASSWORD }}"
        nextcloud_user_password: "{{ .NEXTCLOUD_USER_PASSWORD }}"
        notes_user_password: "{{ .NOTES_USER_PASSWORD }}"
        openproject_user_password: "{{ .OPENPROJECT_USER_PASSWORD }}"
        oxconnector_user_password: "{{ .OXCONNECTOR_USER_PASSWORD }}"
        matrix_user_password: "{{ .MATRIX_USER_PASSWORD }}"
        authsession_user_password: "{{ .AUTHSESSION_USER_PASSWORD }}"
        guardianmanagementapi_user_password: "{{ .GUARDIANMANAGEMENTAPI_USER_PASSWORD }}"
        selfservice_user_password: "{{ .SELFSERVICE_USER_PASSWORD }}"
        xwiki_user_password: "{{ .XWIKI_USER_PASSWORD }}"
  data:
    - secretKey: POSTGRES_SUPER_PASSWORD
      remoteRef:
        key: /cloudnative-pg/password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: /opendesk/REDIS_PASSWORD
    - secretKey: KEYCLOAK_USER_PASSWORD
      remoteRef:
        key: /opendesk/keycloak_user_password
    - secretKey: KEYCLOAK_EXTENSIONS_USER_PASSWORD
      remoteRef:
        key: /opendesk/keycloak_extensions_user_password
    - secretKey: MATRIX_AUTHENTICATION_USER_PASSWORD
      remoteRef:
        key: /opendesk/matrix_authentication_user_password
    - secretKey: NEXTCLOUD_USER_PASSWORD
      remoteRef:
        key: /opendesk/nextcloud_user_password
    - secretKey: NOTES_USER_PASSWORD
      remoteRef:
        key: /opendesk/notes_user_password
    - secretKey: OPENPROJECT_USER_PASSWORD
      remoteRef:
        key: /opendesk/openproject_user_password
    - secretKey: OXCONNECTOR_USER_PASSWORD
      remoteRef:
        key: /opendesk/oxconnector_user_password
    - secretKey: MATRIX_USER_PASSWORD
      remoteRef:
        key: /opendesk/matrix_user_password
    - secretKey: AUTHSESSION_USER_PASSWORD
      remoteRef:
        key: /opendesk/authsession_user_password
    - secretKey: GUARDIANMANAGEMENTAPI_USER_PASSWORD
      remoteRef:
        key: /opendesk/guardianmanagementapi_user_password
    - secretKey: SELFSERVICE_USER_PASSWORD
      remoteRef:
        key: /opendesk/selfservice_user_password
    - secretKey: XWIKI_USER_PASSWORD
      remoteRef:
        key: /opendesk/xwiki_user_password
