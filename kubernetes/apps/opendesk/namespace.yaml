---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/namespace_v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: _
  labels:
    # Same posture as `selfhosted`: openDesk's 35 charts ship their own security
    # contexts and we do not own them, so enforce baseline and surface
    # `restricted` violations through audit/warn instead of blocking mail-day-one
    # app upgrades on them.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
