---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/namespace_v1.json
apiVersion: v1
kind: Namespace
metadata:
  name: _
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.35
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # The pgdumpall stacks back up volumes written by a root CronJob (0:0), and a
    # kopiur mover silently SKIPS paths it cannot read, so the mover must run at
    # that privilege. Kopiur refuses privileged movers unless the namespace opts
    # in (mirrors volsync's privileged-movers annotation).
    kopiur.home-operations.com/privileged-movers: "true"
