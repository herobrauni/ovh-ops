---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres18-pgdumpall
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 35Gi
  storageClassName: ceph-block
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres18-pgdumpall-dump
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 9000
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: pgdumpall
              image: ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command:
                - /bin/bash
                - -ec
                - |
                  set -euo pipefail

                  find /data -maxdepth 1 -type f -name 'postgres18-*.sql.gz.tmp' -delete
                  find /data -maxdepth 1 -type f -name 'postgres18-*.sql.gz' -delete

                  ts="$(date -u +%Y%m%dT%H%M%SZ)"
                  tmpfile="/data/postgres18-${ts}.sql.gz.tmp"
                  outfile="/data/postgres18-${ts}.sql.gz"

                  cleanup() {
                    rm -f "${tmpfile}"
                  }
                  trap cleanup EXIT

                  export PGPASSWORD="${PGPASSWORD}"
                  pg_dumpall --host="postgres18-rw.dbms.svc.cluster.local" --port="5432" --username="${PGUSER}" | gzip -9 > "${tmpfile}"

                  mv "${tmpfile}" "${outfile}"
                  trap - EXIT
              env:
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-secret
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-secret
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          restartPolicy: OnFailure
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: postgres18-pgdumpall
            - name: tmp
              emptyDir: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: postgres18-pgdumpall
spec:
  compression:
    compressor: zstd-fastest
  copyMethod: Snapshot
  credentialProjection:
    enabled: true
  mover:
    # The dump CronJob writes as 0:0/fsGroup 1000 (postgres image), keep the same
    # context so the mover can read the dumps.
    podSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 1000
  repository:
    kind: ClusterRepository
    name: sftp
  # Explicit GFS, translated field-for-field from the volsync ReplicationSource
  # (`retain: {latest: 10, weekly: 6, monthly: 6, yearly: 2}`). Kopiur buckets are
  # a union and an absent bucket keeps nothing, so these must stay explicit.
  retention:
    keepLatest: 10
    keepWeekly: 6
    keepMonthly: 6
    keepAnnual: 2
  sources:
    - pvc:
        name: postgres18-pgdumpall
      # MUST stay /data: the volsync fork recorded every snapshot under
      # <app>@<ns>:/data and the history must stay addressable.
      sourcePathOverride: /data
  upload:
    maxParallelFileReads: 2
  volumeSnapshotClassName: csi-ceph-blockpool
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: postgres18-pgdumpall
spec:
  policyRef:
    name: postgres18-pgdumpall
  # 03:30 Europe/Paris (k8tz on the operator) = 01:30 UTC, exactly the fork's
  # `trigger.schedule: 30 3 * * *`, three hours after the 00:30 UTC dump.
  schedule:
    cron: "30 3 * * *"
# No Restore CR here, unlike the app component: a passive-populator Restore sits
# at Ready=False/AwaitingPvcDataSourceRef until a claim references it, and this
# Kustomization runs with `wait: true`. Restores are created on demand instead.
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/persistentvolumeclaim_v1.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-pgdumpall
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  storageClassName: ceph-block
---
