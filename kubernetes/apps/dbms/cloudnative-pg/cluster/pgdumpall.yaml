metadata:
  name: immich-pgdumpall
spec:
  compression:
    compressor: zstd-fastest
  copyMethod: Snapshot
  credentialProjection:
    enabled: true
  mover:
    # The dump CronJob writes as 0:0/fsGroup 1000 (postgres image), keep the same
