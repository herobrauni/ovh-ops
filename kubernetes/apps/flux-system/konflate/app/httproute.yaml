---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/name: Konflate
    gethomepage.dev/description: Rendered Flux PR review
    gethomepage.dev/icon: https://github.com/home-operations.png
    gethomepage.dev/pod-selector: app.kubernetes.io/name=konflate
spec:
  hostnames:
    - konflate.brauni.dev
  parentRefs:
    - name: envoy-brauni-dev-public
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: konflate
          namespace: flux-system
          port: 8080
---
# Unauthenticated by design: konflate verifies the GitHub webhook HMAC itself
# (KONFLATE_WEBHOOK_SECRET), so this path must NOT sit behind TinyAuth. The more
# specific path match takes precedence over the konflate route above.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: konflate-webhook
spec:
  hostnames:
    - konflate.brauni.dev
  parentRefs:
    - name: envoy-brauni-dev-public
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hooks
      backendRefs:
        - name: konflate
          namespace: flux-system
          port: 8080
