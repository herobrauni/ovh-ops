---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: konflate-secret
    template:
      data:
        KONFLATE_APP_PRIVATE_KEY: "{{ .KONFLATE_APP_PRIVATE_KEY }}"
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
  data:
    # GitHub App PEM — same CI bot App as /actions-runner/* (installation
    # auto-detected from the repo; authenticates reads AND write-back)
    - secretKey: KONFLATE_APP_PRIVATE_KEY
      remoteRef:
        key: /konflate/KONFLATE_APP_PRIVATE_KEY
    # Shared secret for the verified inbound GitHub webhook on /hooks
    - secretKey: KONFLATE_WEBHOOK_SECRET
      remoteRef:
        key: /konflate/KONFLATE_WEBHOOK_SECRET
