---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: konflate-secret
    template:
      data:
        KONFLATE_TOKEN: "{{ .KONFLATE_TOKEN }}"
        KONFLATE_WRITE_TOKEN: "{{ .KONFLATE_WRITE_TOKEN }}"
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
  data:
    # GitHub PAT with repo read access (private repo + PR list)
    - secretKey: KONFLATE_TOKEN
      remoteRef:
        key: /konflate/KONFLATE_TOKEN
    # GitHub PAT with repo write access (statusChecks + prComments write-back)
    - secretKey: KONFLATE_WRITE_TOKEN
      remoteRef:
        key: /konflate/KONFLATE_WRITE_TOKEN
    # Shared secret for the verified inbound GitHub webhook on /hooks
    - secretKey: KONFLATE_WEBHOOK_SECRET
      remoteRef:
        key: /konflate/KONFLATE_WEBHOOK_SECRET
