---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kopia
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/name: Kopia
    gethomepage.dev/pod-selector: app.kubernetes.io/name=kopia
    gethomepage.dev/icon: mdi-folder-sync
    # Kopia has no anonymous health endpoint and its UI answers 200 on / (it is the
    # HTML shell; the API behind it is what authenticates). /healthz is skipped by the
    # outpost so ext-auth does not redirect the probe, and kopia's own 404 proves the
    # pod answered — same idiom as the konflate/github webhook routes.
    gatus.home-operations.com/endpoint: |-
      url: https://kopia.riki.boo/healthz
      conditions: ["[STATUS] == 404"]
spec:
  hostnames:
    - kopia.riki.boo
  parentRefs:
    - name: envoy-riki-boo-public
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kopia
          port: 80
