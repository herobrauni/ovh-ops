---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.riki.boo
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    defaultRules:
      # etcdMemberCommunicationSlow (p99 peer RTT > 0.15s for 10m) false-positives
      # on this cluster: etcd probes each peer only every ~64s, so the p99 over a
      # 5m window is effectively "the single worst probe", and with WAN-backed
      # external Ceph (media IO over the same uplink) single-probe 200-400ms
      # bubbles are routine — the alert fired in blocks of several hours per day.
      # Replaced by a relaxed custom rule in prometheusrule-etcd.yaml.
      disabled:
        etcdMemberCommunicationSlow: true
    kubeProxy:
      enabled: false
    prometheus:
      prometheusSpec:
        externalUrl: https://prometheus.riki.boo
        serviceDiscoveryRole: EndpointSlice
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          - job_name: proxmox-node-exporter
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets:
                  - 54.38.92.92:9100
                labels:
                  node: ovhsbg1
                  role: proxmox
                  site: riki
              - targets:
                  - 54.38.94.158:9100
                labels:
                  node: ovhsbg2
                  role: proxmox
                  site: riki
              - targets:
                  - 54.38.94.150:9100
                labels:
                  node: ovhsbg3
                  role: proxmox
                  site: riki
            relabel_configs:
              - source_labels:
                  - node
                target_label: instance
        retention: 14d
        retentionSize: 50GB
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      # Feeds the filesystem-readonly-probe DaemonSet (filesystem-probe.yaml),
      # which writes fs-readonly.prom into the hostPath dir below.
      extraArgs:
        - --collector.textfile.directory=/var/lib/node_exporter/textfile
      extraHostVolumeMounts:
        - name: textfile-dir
          hostPath: /var/lib/node_exporter/textfile
          mountPath: /var/lib/node_exporter/textfile
          readOnly: true
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # KubeVirt's NoAvailableNodes alert selects on
      # kube_node_labels{label_kubevirt_io_schedulable='true'}, which KSM v2
      # only serves for allowlisted label keys. Expose just this one key.
      metricLabelsAllowlist:
        - nodes=[kubevirt.io/schedulable]
      prometheus:
        monitor:
          honorLabels: false
          metricRelabelings:
            # kube_pod_tolerations is known to be high-cardinality and has shown
            # intermittent duplicate-sample ingestion issues in this cluster.
            - sourceLabels: [__name__]
              regex: kube_pod_tolerations
              action: drop
            # Rook currently recreates rook-ceph-mgr-external with a duplicated
            # address, so drop only that broken EndpointSlice metric series.
            - sourceLabels: [__name__, namespace, endpointslice]
              separator: ;
              regex: kube_endpointslice_endpoints;rook-ceph;rook-ceph-mgr-external
              action: drop
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                labels:
                  severity: critical
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      filesystem-rules:
        groups:
          - name: filesystem-readonly
            rules:
              # Metrics written by the filesystem-readonly-probe DaemonSet into the
              # node-exporter textfile directory. ext4 on 6.18+ kernels goes
              # "emergency_ro" after RBD I/O errors WITHOUT flipping the VFS mount to
              # ro, so node_filesystem_readonly never sees it - the probe greps
              # /proc/1/mounts instead. First victim: altmount's config PVC, 2026-09-27.
              - alert: NodeFilesystemEmergencyReadonly
                expr: node_filesystem_emergency_readonly == 1
                for: 2m
                annotations:
                  summary: >-
                    Filesystem {{ $labels.device }} at {{ $labels.mountpoint }} on node {{ $labels.node }} was emergency-remounted read-only by the kernel after I/O errors - writes are failing, restart the consuming workload
                labels:
                  severity: critical

              - alert: NodeKubeletVolumeMountedReadonly
                expr: node_filesystem_mounted_readonly{mountpoint=~"/var/lib/kubelet/.*"} == 1
                for: 5m
                annotations:
                  summary: >-
                    Kubelet-mounted filesystem {{ $labels.device }} at {{ $labels.mountpoint }} on node {{ $labels.node }} is mounted read-only - workload writes are failing
                labels:
                  severity: critical

              - alert: NodeFilesystemReadonlyProbeStale
                expr: time() - node_filesystem_emergency_ro_last_check > 300
                for: 10m
                annotations:
                  summary: >-
                    Filesystem readonly probe on node {{ $labels.node }} has not reported for {{ $value | humanizeDuration }}
                labels:
                  severity: warning

              - alert: NodeFilesystemReadonlyProbeMissing
                expr: kube_node_info unless on(node) node_filesystem_emergency_ro_last_check
                for: 15m
                annotations:
                  summary: >-
                    Filesystem readonly probe has never reported for node {{ $labels.node }}
                labels:
                  severity: warning
