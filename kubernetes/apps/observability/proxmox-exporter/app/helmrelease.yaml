---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: proxmox-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      proxmox-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/prompve/prometheus-pve-exporter
              tag: 3.12.0@sha256:e49466559449074596e762dd09c9a76c9be9b6a1ffacf7bc8ceb827169cb180e
            env:
              # The exporter authenticates with the token from the secret and
              # takes the API host from the scrape URL (/pve?target=<pve-ip>),
              # NOT from an env var - see docs/agents/proxmox-hosts.md.
              PVE_VERIFY_SSL: "true"
              # PVE node certs are signed by the cluster CA, which is not in the
              # image trust store. REQUESTS_CA_BUNDLE is honoured by the
              # `requests` calls proxmoxer makes when verify=True.
              REQUESTS_CA_BUNDLE: /etc/pve-ca/pve-root-ca.pem
            envFrom:
              - secretRef:
                  name: proxmox-exporter-secret
            probes:
              liveness: &httpProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /metrics
                    port: &port 9221
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *httpProbe
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      pve-ca:
        type: configMap
        name: proxmox-exporter-ca
        globalMounts:
          - path: /etc/pve-ca/pve-root-ca.pem
            subPath: pve-root-ca.pem
            readOnly: true
    service:
      app:
        ports:
          metrics:
            port: *port
