---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: proxmox-exporter-rules
spec:
  groups:
    - name: proxmox-exporter.rules
      rules:
        # One alert for all four PVE-source scrape jobs: node-exporter, zfs and
        # smartctl exporters on the hosts (ports 9100/9134/9633) plus the
        # in-cluster pve-exporter (/pve). A non-2xx /pve response - bad token,
        # failed TLS verification, PVE API down - also lands here as up=0.
        - alert: ProxmoxExporterDown
          expr: |-
            up{job=~"proxmox-(node-exporter|zfs|smartctl|pve)"} == 0
          for: 15m
          annotations:
            summary: >-
              Prometheus cannot scrape {{ $labels.job }} (PVE source {{ $labels.instance }})
          labels:
            severity: warning

        - alert: ProxmoxClusterNotQuorate
          expr: |-
            pve_cluster_info{quorate="0"} == 1
          for: 5m
          annotations:
            summary: >-
              PVE cluster {{ $labels.id }} has lost quorum
          labels:
            severity: critical

        - alert: ProxmoxHostUnreachable
          expr: |-
            pve_up{id=~"node/.+"} == 0
          for: 5m
          annotations:
            summary: >-
              Proxmox node {{ $labels.id }} is reported offline by the PVE API
          labels:
            severity: critical

        - alert: ProxmoxHostCpuHigh
          expr: |-
            pve_cpu_usage_ratio{id=~"node/.+"} > 0.9
          for: 15m
          annotations:
            summary: >-
              Proxmox node {{ $labels.id }} has sustained high CPU usage ({{ $value | humanizePercentage }})
          labels:
            severity: warning

        # PVE reports node memory including the (reclaimable) ZFS ARC, so these
        # hosts sit at ~0.85 by design; 14d of node_memory_MemAvailable never
        # crossed 0.90 on any host, hence the deliberately loose threshold.
        - alert: ProxmoxHostMemoryPressure
          expr: |-
            (pve_memory_usage_bytes{id=~"node/.+"} / pve_memory_size_bytes{id=~"node/.+"}) > 0.95
          for: 30m
          annotations:
            summary: >-
              Proxmox node {{ $labels.id }} has high memory pressure ({{ $value | humanizePercentage }})
          labels:
            severity: warning

        # The PVE API repeats cluster-wide (shared) storages - ceph_block,
        # ceph_fs, pbshostc - once per node, so collapse the node prefix out of
        # the id label and take the worst instance per storage name.
        - alert: ProxmoxStoragePoolLowFreeSpace
          expr: |-
            min by (storage) (
              label_replace(
                (1 - pve_disk_usage_bytes{id=~"storage/.+"} / pve_disk_size_bytes{id=~"storage/.+"}),
                "storage", "$1", "id", "storage/[^/]+/(.+)"
              )
            ) < 0.1
          for: 15m
          annotations:
            summary: >-
              Proxmox storage {{ $labels.storage }} is low on free space ({{ $value | humanizePercentage }} free)
          labels:
            severity: warning

        - alert: ProxmoxStoragePoolCriticalFreeSpace
          expr: |-
            min by (storage) (
              label_replace(
                (1 - pve_disk_usage_bytes{id=~"storage/.+"} / pve_disk_size_bytes{id=~"storage/.+"}),
                "storage", "$1", "id", "storage/[^/]+/(.+)"
              )
            ) < 0.05
          for: 10m
          annotations:
            summary: >-
              Proxmox storage {{ $labels.storage }} is critically low on free space ({{ $value | humanizePercentage }} free)
          labels:
            severity: critical

        # pdf/zfs_exporter zfs_pool_health codes: 0 ONLINE, 1 DEGRADED,
        # 2 FAULTED, 3 OFFLINE, 4 UNAVAIL, 5 REMOVED, 6 SUSPENDED.
        - alert: ProxmoxZfsPoolDegraded
          expr: |-
            zfs_pool_health == 1
          for: 5m
          annotations:
            summary: >-
              ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is DEGRADED (redundancy lost, scrub it)
          labels:
            severity: warning

        - alert: ProxmoxZfsPoolUnavailable
          expr: |-
            zfs_pool_health >= 2
          for: 2m
          annotations:
            summary: >-
              ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is not usable (health code {{ $value }}, see zpool status)
          labels:
            severity: critical

        - alert: ProxmoxZfsPoolReadOnly
          expr: |-
            zfs_pool_readonly == 1
          for: 5m
          annotations:
            summary: >-
              ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is mounted read-only
          labels:
            severity: critical

        - alert: ProxmoxZfsPoolLowFreeSpace
          expr: |-
            (zfs_pool_free_bytes / zfs_pool_size_bytes) < 0.1
          for: 15m
          annotations:
            summary: >-
              ZFS pool {{ $labels.pool }} on {{ $labels.instance }} is low on free space ({{ $value | humanizePercentage }} free)
          labels:
            severity: warning

        # smartctl_exporter reports 1 for a PASSED overall health assessment.
        # (Older revisions of this rule matched smartctl_device_smart_healthy,
        # a series the exporter never exposes, so it could never fire.)
        - alert: ProxmoxSmartCritical
          expr: |-
            smartctl_device_smart_status == 0 or smartctl_device_critical_warning > 0
          for: 10m
          annotations:
            summary: >-
              SMART reports critical health for device {{ $labels.device }} on {{ $labels.instance }}
          labels:
            severity: critical

        - alert: ProxmoxSmartMediaErrors
          expr: |-
            increase(smartctl_device_media_errors[1h]) > 0
          for: 10m
          annotations:
            summary: >-
              Device {{ $labels.device }} on {{ $labels.instance }} logged {{ $value | humanize }} new media errors in the last hour
          labels:
            severity: warning

        - alert: ProxmoxSmartWearHigh
          expr: |-
            smartctl_device_percentage_used >= 90
          for: 1h
          annotations:
            summary: >-
              Device {{ $labels.device }} on {{ $labels.instance }} has consumed {{ $value }}% of its rated write endurance
          labels:
            severity: warning
