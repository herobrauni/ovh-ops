---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs-server-outpost
  annotations:
    # The 2026.8 outpost is OIDC-based and serves its callback on the app host, so this
    # path must be routed to authentik *without* ext-auth (a SecurityPolicy on this route
    # would send the callback through ext-auth and loop). The sidecar would otherwise
    # emit a bogus endpoint for it.
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - victoria-logs.riki.boo
  parentRefs:
    - name: envoy-riki-boo-public
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
