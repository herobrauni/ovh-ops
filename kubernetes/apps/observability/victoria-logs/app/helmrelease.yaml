---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    fullnameOverride: victoria-logs
    server:
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 20Gi
      retentionPeriod: 60d
      route:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Observability
          gethomepage.dev/name: Victoria Logs
          gethomepage.dev/pod-selector: app.kubernetes.io/name=victoria-logs-single
          gethomepage.dev/icon: victoriametrics.png
          # Probe /health, not the route root: an Exact "/" rule 302-redirects to
          # /select/vmui/, and the root is what the sidecar would otherwise derive.
          gatus.home-operations.com/endpoint: |-
            url: https://victoria-logs.riki.boo/health
        hostnames:
          - victoria-logs.riki.boo
        parentRefs:
          - name: envoy-riki-boo-public
            namespace: network
            sectionName: https
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
      serviceMonitor:
        enabled: true
    dashboards:
      enabled: true
