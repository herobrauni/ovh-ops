---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./grafanadashboard.yaml
  - ./infinidysk-v2-grafanadashboard.yaml
  - ./prowlarr-grafanadashboard.yaml
  - ./proxmox-grafanadashboard.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: infinidysk-v2-dashboard
    files:
      - infinidysk-v2.json=./resources/infinidysk-v2.json
  - name: prowlarr-dashboard
    files:
      - prowlarr.json=./resources/prowlarr.json
  - name: proxmox-observability-dashboard
    files:
      - proxmox-observability.json=./resources/proxmox-observability.json
  - name: proxmox-logs-dashboard
    files:
      - proxmox-logs.json=./resources/proxmox-logs.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  # The operator only watches ConfigMaps carrying this label; without it an edit to
  # a dashboard's JSON waits for the scheduled resync (and in practice does not land
  # at all — the CR's own content hash does not change). With the label, rewriting a
  # panel here re-pushes the dashboard on the next reconcile.
  labels:
    app.kubernetes.io/managed-by: grafana-operator
