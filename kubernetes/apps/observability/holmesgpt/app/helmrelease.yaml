---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app holmesgpt
spec:
  chart:
    spec:
      chart: holmes
      sourceRef:
        kind: HelmRepository
        name: robusta
      version: 0.45.0
  interval: 30m
  values:
    # The chart renders its image as "<registry>/<image>", so the digest pin
    # lives in the image string rather than a separate tag field.
    registry: robustadev
    # renovate: datasource=docker depName=robustadev/holmes
    image: holmes@sha256:a6edc27204a8725d45419863474c41e2822333e938a8e79fafb99068131629c3
    logLevel: INFO

    # Default model + credentials, straight against OpenCode Go - no litellm hop.
    # Go serves from a different base URL than pay-as-you-go
    # (https://opencode.ai/inference vs .../inference/go) and refuses requests
    # without an x-opencode-session header (400 MissingSessionID), so Holmes sends
    # both the session id and a non-generic User-Agent via EXTRA_HEADERS - the
    # header contract from https://opencode.ai/docs/go/#where-can-i-use-it.
    #
    # deepseek-v4.1-flash is on Go's chat/completions surface; tool calling is
    # verified against this endpoint. Swappable for any other Go model that is too
    # (glm-5.3, kimi-k2.7-code, qwen3.8-max, minimax-m3).
    additionalEnvVars:
      - name: OPENAI_API_BASE
        value: https://opencode.ai/inference/go/openai/v1
      - name: MODEL
        value: deepseek-v4.1-flash
      - name: EXTRA_HEADERS
        value: '{"User-Agent": "holmesgpt/0.45.0", "x-opencode-session": "holmesgpt-observability"}'
      # Holmes propagates incoming HTTP headers into every shell-backed toolset and
      # rejects values containing shell metacharacters (ROB-1104). curl sends
      # "Accept: */*" and the tailscale ingress injects Tailscale-User-* headers
      # with URLs, so every kubectl call died with "request header ... contains
      # disallowed shell metacharacter(s)". We need no header passthrough at all, so
      # block the whole conventional set (default is only
      # authorization,cookie,set-cookie - it is a blocklist, there is no off switch).
      - name: HOLMES_PASSTHROUGH_BLOCKED_HEADERS
        value: authorization,cookie,set-cookie,accept,accept-encoding,accept-language,cache-control,connection,content-length,content-type,host,origin,priority,referer,te,trailer,transfer-encoding,upgrade,user-agent,sec-fetch-dest,sec-fetch-mode,sec-fetch-site,sec-ch-ua,sec-ch-ua-mobile,sec-ch-ua-platform,x-forwarded-for,x-forwarded-host,x-forwarded-proto,x-real-ip,tailscale-user-login,tailscale-user-name,tailscale-user-profile-pic,tailscale-user-tailnet,tailscale-user-tailnet-name,tailscale-user-node
    modelList:
      deepseek-v4.1-flash:
        model: openai/deepseek-v4.1-flash
        api_base: https://opencode.ai/inference/go/openai/v1
        api_key: "{{ env.OPENAI_API_KEY }}"
        temperature: 0
        # Peak DeepSeek V4.1 Flash pricing ($0.30/$1.20 per 1M, $0.006 cached read)
        # so Holmes can report usage cost instead of 0.
        input_cost_per_token: 0.0000003
        output_cost_per_token: 0.0000012
        cache_read_input_token_cost: 0.000000006
    extraEnvVarsSecrets:
      - holmesgpt-secret

    # Cluster-wide get/list/watch ClusterRole + ServiceAccount token from the
    # chart (k8sRBAC stays false: that mode swaps the in-pod readers for the
    # runner and drops the kubernetes/* toolsets).
    createServiceAccount: true
    toolsets:
      kubernetes/core:
        enabled: true
      kubernetes/logs:
        enabled: true
      internet:
        enabled: true
      connectivity_check:
        enabled: true
      prometheus/metrics:
        enabled: true
        subtype: prometheus
        config:
          prometheus_url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
      victorialogs:
        enabled: true
        config:
          api_url: http://victoria-logs-server.observability.svc.cluster.local:9428
      # Grafana dashboards: Viewer service-account token (minted once, stored in
      # Infisical at /holmesgpt/GRAFANA_API_KEY). No image renderer installed, so
      # the visual-rendering tools simply stay unregistered.
      grafana/dashboards:
        enabled: true
        config:
          api_key: "{{ env.GRAFANA_API_KEY }}"
          api_url: http://grafana-service.observability.svc.cluster.local:3000
      # Read-only Postgres via the CNPG role holmes_readonly (pg_read_all_data +
      # pg_read_all_stats, see dbms/cloudnative-pg/cluster/cluster18.yaml) over the
      # replica service. One block per database - add more by copying one and
      # only changing the trailing database name. Deliberately NOT connected:
      # authentik, vaultwarden, immich, firefly3 (credentials / personal data).
      postgres-litellm:
        type: database
        config:
          connection_url: postgresql://holmes_readonly:{{ env.POSTGRES_READONLY_PASSWORD }}@postgres18-ro.dbms.svc.cluster.local:5432/litellm
        llm_instructions: |-
          Read-only. LiteLLM proxy database: spend logs, virtual keys, model/credential
          tables. Useful for "who/what is burning tokens" and proxy errors.
      postgres-patchmon:
        type: database
        config:
          connection_url: postgresql://holmes_readonly:{{ env.POSTGRES_READONLY_PASSWORD }}@postgres18-ro.dbms.svc.cluster.local:5432/patchmon
        llm_instructions: |-
          Read-only. PatchMon database: hosts, packages, patching status.
      postgres-open-webui:
        type: database
        config:
          connection_url: postgresql://holmes_readonly:{{ env.POSTGRES_READONLY_PASSWORD }}@postgres18-ro.dbms.svc.cluster.local:5432/open-webui
        llm_instructions: |-
          Read-only. Open WebUI database: chats, models, users (treat user content as PII).
      # Robusta's SaaS toolset needs a ROBUSTA_UI_TOKEN we do not have.
      robusta:
        enabled: false
      # The bash toolset would let the model read OPENAI_API_KEY and the
      # ServiceAccount token out of the pod environment. Keep it off; the
      # kubernetes/* toolsets already cover investigation.
      bash:
        enabled: false

    # The holmes image runs as root (upstream Dockerfile has no USER); harden
    # what we can without breaking it. Chart forces readOnlyRootFilesystem.
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

    # Operator mode: HealthCheck / ScheduledHealthCheck / TriggeredHealthCheck
    # CRDs. Enabling it costs nothing until a check resource exists - each check
    # is one (or more) LLM call, so add ScheduledHealthChecks sparingly.
    operator:
      enabled: true
      registry: robustadev
      # renovate: datasource=docker depName=robustadev/holmes-operator
      image: holmes-operator@sha256:fb9ed8389b6b5b92daa504478dff5c507ce610d036e04d81beb9fe66b91f720f

    # Remediation MCP (the "act on the cluster" half): restart/scale, drain,
    # patch, read files inside containers, launch netshoot/busybox diagnostic
    # pods. Mutating calls are always gated behind human approval
    # (approval_required_tools: run_kubectl_command); the read-only allowlisted
    # ones run directly. The chart ships a scoped ClusterRole (no secrets, no
    # cluster-admin), an ingress-only NetworkPolicy, and a pre-install/pre-upgrade
    # hook Job that mints the MCP bearer token.
    mcpAddons:
      kubernetesRemediation:
        enabled: true
        # renovate: datasource=docker depName=us-central1-docker.pkg.dev/genuine-flight-317411/mcp/kubernetes-remediation-mcp
        image: kubernetes-remediation-mcp@sha256:874820be9f6ad0b76d8065e312f8f889ae423f1c35f0ad5a5c9d09da9ed001dc
