---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmesgpt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: holmesgpt-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # HolmesGPT expects its OpenAI-compatible key in OPENAI_API_KEY (see
        # extraEnvVarsSecrets / modelList in the HelmRelease).
        OPENAI_API_KEY: "{{ .LITELLM_API_KEY }}"
  data:
    # Deliberately NOT the litellm master key (/litellm/LITELLM_MASTER_KEY):
    # this is a virtual key scoped to the openrouter/* model group, so a
    # prompt-injection in an investigated log line cannot mint keys or reach
    # every model on the proxy.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: /holmesgpt/LITELLM_API_KEY
