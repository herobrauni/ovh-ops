---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: holmesgpt
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: holmesgpt-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # HolmesGPT expects its OpenAI-compatible key in OPENAI_API_KEY (see
        # additionalEnvVars / modelList in the HelmRelease); this is the OpenCode
        # Console/Zen API key from https://opencode.ai/console.
        OPENAI_API_KEY: "{{ .OPENCODE_API_KEY }}"
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: /holmesgpt/OPENCODE_API_KEY
