---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The SABnzbd endpoint is zurg's whole gate for /api — the same key the *arrs
# hold. It is pinned in the zurg config (Infisical /zurg/SABNZBD_API_KEY) so
# this helper and the *arrs share one value that survives a /config PVC loss.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zurg-sync-helper
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zurg-sync-helper-secret
    creationPolicy: Owner
  data:
    - secretKey: SAB_API_KEY
      remoteRef:
        key: /zurg/SABNZBD_API_KEY
