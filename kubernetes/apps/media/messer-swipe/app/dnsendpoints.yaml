---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: messer-swipe
  labels:
    dns.scope: all
  annotations:
    dns.scope: all
spec:
  endpoints:
    # Hostname is the product's own name (swiparr), not the repository/app
    # name — hence a hand-written record instead of `components/dnsendpoint`,
    # which derives `<APP>.<DOMAIN>`.
    - dnsName: swiparr.480p.com
      recordType: CNAME
      targets:
        - public.480p.com
