---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./servicemonitor.yaml
  - ./grafanadashboard.yaml
  - ./httproute.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  - name: -dashboard
    files:
      - .json=./resources/.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
