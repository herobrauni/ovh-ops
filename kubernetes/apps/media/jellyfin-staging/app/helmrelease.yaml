---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin-staging
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: jellyfin-staging-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: jellyfin-staging-initdb-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          02-pg-tools:
            image:
              repository: docker.io/library/postgres
              tag: 18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
            command:
              - sh
              - -c
              - |
                cp /usr/lib/postgresql/18/bin/pg_dump /pg-tools/
                cp /usr/lib/postgresql/18/bin/psql /pg-tools/
                cp -a /lib/x86_64-linux-gnu/libpq.so* /lib/x86_64-linux-gnu/libreadline.so* /pg-tools/
                chmod 755 /pg-tools/*
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image:
              repository: docker.io/jellyfin/jellyfin
              tag: 12.4@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
            env:
              PATH: /pg-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              LD_LIBRARY_PATH: /pg-tools
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: &pguser jellyfin-staging-pguser-secret
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: port
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: db
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: user
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: password
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  # Migration rehearsals legitimately take 20-100 min (prod needed
                  # 11 min for the v12 pass, 45 min in the worst case).
                  failureThreshold: 600
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: jellyfin-staging
      cache:
        type: emptyDir
        sizeLimit: 5Gi
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
      logs:
        type: emptyDir
      pg-tools:
        type: emptyDir
        advancedMounts:
          jellyfin:
            02-pg-tools:
              - path: /pg-tools
            app:
              - path: /pg-tools
      transcode:
        type: emptyDir
        sizeLimit: 10Gi
      tmp:
        type: emptyDir
