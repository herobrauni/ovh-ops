---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Same shape as components/cnpg, but with an underscored database name: the k8s
# app is `jellyfin-staging`, the database/role is `jellyfin_staging`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-pguser"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: "${APP}-pguser-secret"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        port: "5432"
        host: ${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local
        user: "{{ .postgres_username }}"
        password: "{{ .postgres_password }}"
        db: ${PG_DB}
        uri: "postgresql://{{ .postgres_username }}:{{ .postgres_password }}@${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local:5432/${PG_DB}"
        uri_no_ssl: "postgresql://{{ .postgres_username }}:{{ .postgres_password }}@${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local:5432/${PG_DB}?sslmode=disable"
  data:
    - secretKey: postgres_username
      remoteRef:
        key: /cloudnative-pg/${APP}_postgres_username
    - secretKey: postgres_password
      remoteRef:
        key: /cloudnative-pg/${APP}_postgres_password
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Superuser credentials for the `postgres-init` init container, which creates
# role `${PG_DB}` and database `${PG_DB}` on first start (idempotent).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-initdb"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: "${APP}-initdb-secret"
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: ${PG_DB}
        INIT_POSTGRES_HOST: ${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .postgres_username }}"
        INIT_POSTGRES_PASS: "{{ .postgres_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .password }}"
  data:
    - secretKey: postgres_username
      remoteRef:
        key: /cloudnative-pg/${APP}_postgres_username
    - secretKey: postgres_password
      remoteRef:
        key: /cloudnative-pg/${APP}_postgres_password
    - secretKey: password
      remoteRef:
        key: /cloudnative-pg/password
