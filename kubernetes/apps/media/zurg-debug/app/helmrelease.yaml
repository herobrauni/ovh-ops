---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zurg-debug
spec:
  chartRef:
    kind: OCIRepository
    name: zurg-debug
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
    controllers:
      zurg-debug:
        forceRename: zurg-debug
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
            command:
              - /bin/sh
              - -c
              - sleep infinity
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          rclone-zurg:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.75@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-zurg-debug 2>/dev/null || true
                mkdir -p /host-mount/rclone-zurg-debug
                # zurg-auth carries the plaintext basic-auth password; rclone
                # wants the obscured form for the webdav backend flag, so
                # obscure it here rather than store a second pre-obscured copy.
                exec rclone mount zurg:/ /host-mount/rclone-zurg-debug \
                  --webdav-pass="$(rclone obscure "$ZURG_WEBDAV_PASSWORD")" \
                  --dir-cache-time=20s \
                  --vfs-cache-mode=full \
                  --vfs-cache-max-age=24h \
                  --vfs-cache-max-size=20G \
                  --vfs-cache-poll-interval=30s \
                  --buffer-size=0M \
                  --vfs-read-ahead=512M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_ZURG_TYPE: webdav
              RCLONE_CONFIG_ZURG_URL: http://zurg.media.svc.cluster.local:9999/dav/
              RCLONE_CONFIG_ZURG_VENDOR: other
              # A remote without a config file does not get pacer_min_sleep;
              # without it one unservable file slows every other read down.
              RCLONE_CONFIG_ZURG_PACER_MIN_SLEEP: "0"
            envFrom:
              # zurg's global basic auth is on (it is what unlocks /mcp), so
              # every /dav consumer has to authenticate.
              - secretRef:
                  name: zurg-auth
            probes:
              liveness: &rclone-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-zurg-debug/version.txt
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *rclone-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-zurg-debug/version.txt
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          zurg-debug:
            rclone-zurg:
              - path: /dev/fuse
      rclone-cache-zurg:
        type: emptyDir
        advancedMounts:
          zurg-debug:
            rclone-zurg:
              - path: /cache
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          zurg-debug:
            rclone-zurg:
              - path: /host-mount
                mountPropagation: Bidirectional
      zurg:
        type: hostPath
        hostPath: /tmp/rclone-zurg-debug
        hostPathType: DirectoryOrCreate
        advancedMounts:
          zurg-debug:
            app:
              - path: /aio/remote/zurg
                mountPropagation: HostToContainer
