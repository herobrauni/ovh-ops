---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Test client for zurg: a busybox shell beside an rclone sidecar that mounts
# zurg's WebDAV, mirroring how the *arr apps mount altmount today. Nothing is
# wired to it — it exists so the mount can be browsed and compared.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zurg-debug
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: zurg
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/zurg-debug/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
