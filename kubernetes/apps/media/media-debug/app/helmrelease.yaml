---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media-debug
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
    controllers:
      media-debug:
        forceRename: media-debug
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
            command:
              - /bin/sh
              - -c
              - sleep infinity
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          rclone-zurg:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.75@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-media-debug-zurg 2>/dev/null || true
                mkdir -p /host-mount/rclone-media-debug-zurg
                exec rclone mount zurg:/ /host-mount/rclone-media-debug-zurg \
                  --dir-cache-time=20s \
                  --vfs-cache-mode=full \
                  --vfs-cache-max-age=24h \
                  --vfs-cache-max-size=20G \
                  --vfs-cache-poll-interval=30s \
                  --buffer-size=0M \
                  --vfs-read-ahead=512M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_ZURG_TYPE: webdav
              RCLONE_CONFIG_ZURG_URL: http://zurg.media.svc.cluster.local:9999/dav/
              RCLONE_CONFIG_ZURG_VENDOR: other
              RCLONE_CONFIG_ZURG_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-media-debug-zurg/version.txt
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *rclone-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-media-debug-zurg/version.txt
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          media-debug:
            rclone-zurg:
              - path: /dev/fuse
      symlinks:
        existingClaim: symlinks
        globalMounts:
          - path: /aio/symlinks
      rclone-cache-zurg:
        type: emptyDir
        advancedMounts:
          media-debug:
            rclone-zurg:
              - path: /cache
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          media-debug:
            rclone-zurg:
              - path: /host-mount
                mountPropagation: Bidirectional
      zurg:
        type: hostPath
        hostPath: /tmp/rclone-media-debug-zurg
        hostPathType: DirectoryOrCreate
        advancedMounts:
          media-debug:
            app:
              - path: /aio/remote/zurg
                mountPropagation: HostToContainer
