---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: media-debug
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
    controllers:
      media-debug:
        forceRename: media-debug
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
            command:
              - /bin/sh
              - -c
              - sleep infinity
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
          rclone-zurg:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.75@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-media-debug-zurg 2>/dev/null || true
                mkdir -p /host-mount/rclone-media-debug-zurg
                exec rclone mount zurg:/ /host-mount/rclone-media-debug-zurg \
                  --dir-cache-time=20s \
                  --vfs-cache-mode=full \
                  --vfs-cache-max-age=24h \
                  --vfs-cache-max-size=3G \
                  --vfs-cache-poll-interval=30s \
                  --buffer-size=0M \
                  --vfs-read-ahead=512M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_ZURG_TYPE: webdav
              RCLONE_CONFIG_ZURG_URL: http://zurg.media.svc.cluster.local:9999/dav/
              RCLONE_CONFIG_ZURG_VENDOR: other
              RCLONE_CONFIG_ZURG_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-media-debug-zurg/version.txt
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *rclone-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-media-debug-zurg/version.txt
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          rclone-infinidysk:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.75@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-media-debug-infinidysk 2>/dev/null || true
                mkdir -p /host-mount/rclone-media-debug-infinidysk
                export RCLONE_CONFIG_INFINIDYSK_PASS="$(rclone obscure "$RCLONE_CONFIG_INFINIDYSK_PASS_RAW")"
                unset RCLONE_CONFIG_INFINIDYSK_PASS_RAW
                exec rclone mount infinidysk:/ /host-mount/rclone-media-debug-infinidysk \
                  --links \
                  --poll-interval=0 \
                  --dir-cache-time=20s \
                  --allow-non-empty \
                  --vfs-cache-mode=full \
                  --vfs-cache-max-age=24h \
                  --vfs-cache-max-size=5G \
                  --vfs-cache-poll-interval=30s \
                  --buffer-size=0M \
                  --vfs-read-ahead=512M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --uid=1000 \
                  --gid=1000 \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_INFINIDYSK_TYPE: webdav
              # Backend (WebDAV) port, never the :3000 frontend proxy.
              RCLONE_CONFIG_INFINIDYSK_URL: http://infinidysk.media.svc.cluster.local:8080/
              RCLONE_CONFIG_INFINIDYSK_VENDOR: other
              RCLONE_CONFIG_INFINIDYSK_USER:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__USER
              # Raw value; rclone's obfuscation is not deterministic, so the
              # sidecar obscures it at start instead of storing a second copy.
              RCLONE_CONFIG_INFINIDYSK_PASS_RAW:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__PASS
              RCLONE_CONFIG_INFINIDYSK_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-infinidysk-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-media-debug-infinidysk && ls /host-mount/rclone-media-debug-infinidysk >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *rclone-infinidysk-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-media-debug-infinidysk && ls /host-mount/rclone-media-debug-infinidysk >/dev/null
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          media-debug:
            rclone-zurg:
              - path: /dev/fuse
            rclone-infinidysk:
              - path: /dev/fuse
      symlinks:
        existingClaim: symlinks
        globalMounts:
          - path: /aio/symlinks
      rclone-cache-zurg:
        type: emptyDir
        # Hard backstop for the rclone cap (3G); emptyDir has no natural limit.
        sizeLimit: 4Gi
        advancedMounts:
          media-debug:
            rclone-zurg:
              - path: /cache
      rclone-cache-infinidysk:
        type: emptyDir
        # Hard backstop for the rclone cap (5G).
        sizeLimit: 6Gi
        advancedMounts:
          media-debug:
            rclone-infinidysk:
              - path: /cache
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          media-debug:
            rclone-zurg:
              - path: /host-mount
                mountPropagation: Bidirectional
            rclone-infinidysk:
              - path: /host-mount
                mountPropagation: Bidirectional
      zurg:
        type: hostPath
        hostPath: /tmp/rclone-media-debug-zurg
        hostPathType: DirectoryOrCreate
        advancedMounts:
          media-debug:
            app:
              - path: /aio/remote/zurg
                mountPropagation: HostToContainer

      infinidysk:
        type: hostPath
        hostPath: /tmp/rclone-media-debug-infinidysk
        hostPathType: DirectoryOrCreate
        advancedMounts:
          media-debug:
            app:
              - path: /aio/remote/infinidysk
                mountPropagation: HostToContainer
