---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/persistentvolumeclaim_v1.json
# One-time CSI clones of the live 1.x backend's data. `dataSource` is immutable
# on a bound PVC, so both claims are applied IfNotPresent: re-applying the app
# must never re-clone (and never fail because the snapshot content is gone).
#
# Recreating this instance from scratch: bump the snapshot names in
# volumesnapshot.yaml, delete both claims, and reconcile — the fresh clone then
# re-runs the 1.x import on the next pod start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: infinidysk-v2
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ReadWriteOnce
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: infinidysk-config-v2
  resources:
    requests:
      storage: 30Gi
  storageClassName: ceph-block
---
# The farm the 2.x backend reads as its library dir. A copy, not the live
# `symlinks` claim: 2.x runs "remove dead library links" / "remove unlinked
# files" maintenance against this path, and a test instance must not prune the
# production farm. Consumers keep using the real farm — the *arr writes import
# targets into its own mount, the backend only reads this one for health.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: symlinks-v2
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ReadWriteMany
  dataSourceRef:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: infinidysk-symlinks-v2
  resources:
    requests:
      storage: 10Gi
  storageClassName: ceph-filesystem
