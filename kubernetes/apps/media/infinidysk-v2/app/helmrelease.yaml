---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# InfiniDysk 2.x test instance (Rust rewrite). Runbook: docs/infinidysk-v2-cutover.md.
#
# Two things differ from the 1.x app on purpose:
#
#   1. No built-in FUSE mount (`INFINIDYSK__MOUNT__FUSE=false`). A FUSE mount
#      lives in one pod's host namespace, so every consumer pod would have to
#      read a hostPath that only exists on this pod's node — node pinning for
#      ten pods plus a single mount provider as a shared failure domain. The
#      established pattern here (rclone sidecar per consumer over WebDAV) is
#      kept instead, which also means consumers only change their URL once the
#      cutover is decided.
#   2. WebDAV is on 3000 with the UI and the SABnzbd API (2.x has one port;
#      1.x's separate backend on 8080 is gone).
#
# The container runs as 1000:1000 (no entrypoint user/ownership fixing in the
# 2.x image, and PUID/PGID only label files on the FUSE mount we do not use).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infinidysk-v2
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  timeout: 30m
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      infinidysk:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: infinidysk-v2-secret
        containers:
          app:
            image:
              repository: ghcr.io/infinidysk/infinidysk-next
              tag: v2.0.0-beta.10@sha256:253ef9fa807f389f4058e2ec16342bc7be426d42570accf4afb68b2c01d9d059
            env:
              # --- Settings: the durable 2.x surface (`INFINIDYSK__*`) --------
              # 2.x settings live in the database with this env overlay on top
              # (env > database > defaults), so everything user-visible is forced
              # from Git here and marked "Set by environment" in the UI.
              # Credential-bearing settings live in infinidysk-v2-secret instead
              # (providers, arr instances, SAB key, WebDAV user/password, the
              # store URL) and arrive through `envFrom` below, where the Secret's
              # key names are the variable names. The WebDAV pair is forced that
              # way on purpose: beta.10 does not adopt the 1.x password on first
              # Basic auth (it stores `upgrade.webdav` as `$csharp$$<plaintext>`,
              # which `verify_legacy` always rejects), so every sidecar would 401.
              #
              # `NZBDAV_CONFIG__*` (the 1.x overlay) is NOT a config surface in
              # 2.x: the import read it once, and it is ignored afterwards. The
              # full 1.x-shaped block a re-import needs is in
              # docs/infinidysk-v2-cutover.md, "Re-import recipe".
              #
              # The mount dir must stay identical to 1.x: generated symlink
              # targets embed it, and imported `completed-symlinks` entries point
              # into <mount-dir>/.ids.
              INFINIDYSK__MOUNT__DIR: /aio/remote/infinidysk
              # Built-in FUSE mount off: consumers keep per-pod rclone sidecars
              # (see the header). Read at startup.
              INFINIDYSK__MOUNT__FUSE: "false"
              # Symlinks, one library folder: the *arrs write farm links into the
              # same path they see, so no `arr_path` mapping is needed.
              INFINIDYSK__IMPORTS__STRATEGY: symlinks
              INFINIDYSK__IMPORTS__LIBRARY_DIRS: '[{"path":"/aio/symlinks"}]'
              # The 1.x list, minus `other`: 2.x models the manual category
              # separately (`sab.manual_category`), and a `cat=other` submission
              # is still accepted (verified against the manual-NZB flow).
              INFINIDYSK__SAB__CATEGORIES: '["radarr","radarr4k","sonarr","sonarr4k","nonplex","books"]'
              INFINIDYSK__SAB__MANUAL_CATEGORY: other
              # Stuck-import clearing in the arrs (2.x's replacement for the 1.x
              # QueueRules, which are fixed policy now).
              INFINIDYSK__ARR__QUEUE_MANAGEMENT: "true"
              # Imports at once, from 1.x's queue.worker-count.
              INFINIDYSK__QUEUE__CONCURRENCY: "3"
              # 1.x kept the NZB corpus forever (`nzb_backup_retention_days: 0`
              # meant "never delete"). In 2.x `0` means "delete immediately", so
              # ~10 years is the equivalent: the NZBs are the only copy of every
              # release's identity and are what a mount is rebuilt from.
              INFINIDYSK__QUEUE__NZB_RETENTION_DAYS: "3650"
              # Health checks on, and let 2.x ask the Arr for a replacement. There
              # is no PAR2 gap repair in 2.x: `auto_repair` = recheck + Arr search,
              # which is why the re-grab rate is a Phase C metric.
              # `unowned_action: action_needed` instead of 2.x's `delete` default —
              # files no Arr owns (manual NZBs) must never be deleted silently.
              INFINIDYSK__HEALTH__ENABLED: "true"
              INFINIDYSK__HEALTH__AUTO_REPAIR: "true"
              INFINIDYSK__HEALTH__DEGRADED_TOLERANCE: "true"
              INFINIDYSK__HEALTH__UNOWNED_ACTION: action_needed
              # 1.x sampled each file's head and tail per category
              # (`article-existence-check-mode: sampled`); 2.x has one global
              # percentage, 5 % by default and applied to imports and checks.
              INFINIDYSK__HEALTH__CHECK_PERCENT: "5"
              INFINIDYSK__HEALTH__IMPORT_CHECK_PERCENT: "5"
              # Segment/disk cache off, as in 1.x: the rclone sidecars' VFS cache
              # is the read-ahead layer for playback.
              INFINIDYSK__PERFORMANCE__PRESET: balanced
              INFINIDYSK__PERFORMANCE__DISK_CACHE_ENABLED: "false"
              # Dead library links are pruned in the maintenance window; the
              # destructive sweeps must stay Git-owned.
              INFINIDYSK__MAINTENANCE__SCHEDULED: '["remove-dead-links"]'
              # An SSO-less test instance: local sign-in stays available as
              # break-glass (2.x dropped OIDC_ADMIN_CLAIM and makes every SSO user
              # an admin, so SSO waits for the role-model decision).
              INFINIDYSK__AUTH__LOCAL_LOGIN: "true"
              # Prometheus export on `/metrics`. 2.x serves it BEHIND the admin API
              # key (`X-Api-Key` or `Authorization: Bearer`), unlike 1.x's
              # unauthenticated backend port, so a ServiceMonitor needs
              # `authorization.credentials` from a Secret — that Secret has to come
              # from Infisical (`/infinidysk-v2/ADMIN_API_KEY`, `auth.api_key`),
              # which is why the value is still store-owned here.
              INFINIDYSK__METRICS__PROMETHEUS: "true"
              # CUTOVER IMPORT ONLY: the 1.x reader, pointing at the clone taken
              # from the frozen 1.x database. Remove both once the import reports
              # `upgrade.state = "done"` (docs/infinidysk-v2-cutover.md, Phase A).
              DATABASE_PROVIDER:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-v2-secret
                    key: DATABASE_PROVIDER
              DATABASE_CONNECTION_STRING:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-v2-secret
                    key: DATABASE_CONNECTION_STRING
            envFrom:
              - secretRef:
                  name: infinidysk-v2-secret
            probes:
              # /healthz answers 503 with an `import` check while the 1.x import
              # runs, so the startup budget has to cover that: 60 x 10s = 10 min
              # on SQLite, 360 x 10s = 60 min when the import writes into
              # PostgreSQL (2 GB of NZB blobs go over the wire + WAL).
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 180
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # 2.x idles near 70 MB; the headroom covers the one-time import
                # plus ffprobe/archive work during test grabs.
                memory: 4Gi
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # Loopback WebDAV mount at the exact path 1.x uses, so the library's
          # symlinks (absolute targets under <mount-dir>/.ids) resolve for the
          # app's own health/repair checks. 2.x needs this for the same reason
          # 1.x does: it inspects the library it wrote.
          rclone-infinidysk:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.76@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-infinidysk-v2-self 2>/dev/null || true
                mkdir -p /host-mount/rclone-infinidysk-v2-self
                export RCLONE_CONFIG_INFINIDYSK_PASS="$(rclone obscure "$RCLONE_CONFIG_INFINIDYSK_PASS_RAW")"
                unset RCLONE_CONFIG_INFINIDYSK_PASS_RAW
                exec rclone mount infinidysk:/ /host-mount/rclone-infinidysk-v2-self \
                  --links \
                  --read-only \
                  --poll-interval=0 \
                  --dir-cache-time=20s \
                  --allow-non-empty \
                  --vfs-cache-mode=full \
                  --vfs-cache-max-age=24h \
                  --vfs-cache-max-size=5G \
                  --vfs-cache-poll-interval=30s \
                  --buffer-size=0M \
                  --vfs-read-ahead=512M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --uid=1000 \
                  --gid=1000 \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_INFINIDYSK_TYPE: webdav
              # 2.x serves WebDAV on the same port as the UI and the SAB API.
              RCLONE_CONFIG_INFINIDYSK_URL: http://127.0.0.1:3000/
              RCLONE_CONFIG_INFINIDYSK_VENDOR: other
              RCLONE_CONFIG_INFINIDYSK_USER:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-v2-secret
                    key: INFINIDYSK__WEBDAV__USER
              RCLONE_CONFIG_INFINIDYSK_PASS_RAW:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-v2-secret
                    key: INFINIDYSK__WEBDAV__PASSWORD
              RCLONE_CONFIG_INFINIDYSK_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-infinidysk-v2-self && ls /host-mount/rclone-infinidysk-v2-self >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *rclone-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-infinidysk-v2-self && ls /host-mount/rclone-infinidysk-v2-self >/dev/null
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: infinidysk
        ports:
          # UI + SABnzbd API + WebDAV in one.
          http:
            port: 3000
    persistence:
      config:
        existingClaim: infinidysk-v2
        globalMounts:
          - path: /config
      # THE live farm now that 2.x is the serving backend. The clone
      # (`symlinks-v2`) is gone: 2.x runs maintenance against this path
      # ("remove dead library links"), so it must be the farm the *arrs write.
      symlinks:
        existingClaim: symlinks
        globalMounts:
          - path: /aio/symlinks
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      var-tmp:
        type: emptyDir
        globalMounts:
          - path: /var/tmp
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          infinidysk:
            rclone-infinidysk:
              - path: /dev/fuse
      rclone-cache:
        type: emptyDir
        sizeLimit: 6Gi
        advancedMounts:
          infinidysk:
            rclone-infinidysk:
              - path: /cache
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          infinidysk:
            rclone-infinidysk:
              - path: /host-mount
                mountPropagation: Bidirectional
      # Kept out of the 1.x path (/tmp/rclone-infinidysk-self) so both backends
      # can mount at the same in-pod path without sharing a FUSE mount.
      rclone-self:
        type: hostPath
        hostPath: /tmp/rclone-infinidysk-v2-self
        hostPathType: DirectoryOrCreate
        advancedMounts:
          infinidysk:
            app:
              - path: /aio/remote/infinidysk
                mountPropagation: HostToContainer
