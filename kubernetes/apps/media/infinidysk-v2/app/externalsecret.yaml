---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Secrets for the 2.x test instance. Two audiences:
#
#   * the **import** on the first start, which reads the 1.x `NZBDAV_CONFIG__*`
#     variables below (and the cloned 1.x database) exactly as the 1.x backend
#     does — that is how the providers, arr instances, categories and credentials
#     survive the upgrade. After the import 2.x ignores every `NZBDAV_CONFIG__*`
#     variable (docs/infinidysk-v2-cutover.md, Phase B/C).
#   * the running instance: `NZBDAV_CONFIG__API__KEY` / `WEBDAV__*` are also the
#     live 2.x values (`sab.api_key`, `webdav.user/password`) after the import,
#     which is why the *arrs can be repointed at the v2 Service without touching
#     their download-client credentials.
#
# Deliberately NOT here: the `OIDC_*` block. 2.x dropped `OIDC_ADMIN_CLAIM` and
# makes every SSO user an admin, so SSO is left off for the test instance (the
# imported local admin account is the way in); the role model has to be decided
# before a public route exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infinidysk-v2
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: infinidysk-v2-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NZBDAV_CONFIG__API__KEY: "{{ .API_KEY }}"
        NZBDAV_CONFIG__WEBDAV__USER: "{{ .WEBDAV_USER }}"
        NZBDAV_CONFIG__WEBDAV__PASS: "{{ .WEBDAV_PASSWORD }}"

        # --- Usenet providers -------------------------------------------------
        # Two shapes on purpose:
        #
        #   * `NZBDAV_CONFIG__USENET__PROVIDERS` below is the 1.x-shaped list the
        #     import reads on a first start (only relevant when this instance is
        #     re-cloned). It carries the SAME 20 % connection share as the 2.x
        #     setting, so even an un-migrated import cannot oversubscribe the
        #     accounts.
        #   * `INFINIDYSK__PROVIDERS` is the durable 2.x setting (snake_case,
        #     fixed `id`s so quota/usage stats survive restarts) and wins over
        #     the imported values.
        #
        # 20 % of every account allowance: the live 1.x backend holds the other
        # 80 % (40/60/20/40/80). The per-account sums must equal the plan limits
        # or the providers start refusing connections — every allowance divides
        # evenly by 5, so the split is exact (docs/infinidysk-v2-cutover.md,
        # "Provider connection split").
        NZBDAV_CONFIG__USENET__PROVIDERS: |
          {"Providers":[
            {"Type":1,"Host":"news.eweka.nl","Port":563,"UseSsl":true,"User":"{{ .EWEKA_USERNAME }}","Pass":"{{ .EWEKA_PASSWORD }}","MaxConnections":10,"Nickname":"eweka","StorageGroup":"omicron"},
            {"Type":1,"Host":"eunews.frugalusenet.com","Port":563,"UseSsl":true,"User":"{{ .FRUGAL_USERNAME }}","Pass":"{{ .FRUGAL_PASSWORD }}","MaxConnections":15,"Nickname":"frugal-eu","StorageGroup":"frugal"},
            {"Type":1,"Host":"news.frugalusenet.com","Port":563,"UseSsl":true,"User":"{{ .FRUGAL_USERNAME }}","Pass":"{{ .FRUGAL_PASSWORD }}","MaxConnections":5,"Nickname":"frugal-us","StorageGroup":"frugal"},
            {"Type":3,"Host":"bonus.frugalusenet.com","Port":563,"UseSsl":true,"User":"{{ .FRUGAL_USERNAME }}","Pass":"{{ .FRUGAL_PASSWORD }}","MaxConnections":10,"Nickname":"frugal-bonus"},
            {"Type":3,"Host":"eunews.blocknews.net","Port":563,"UseSsl":true,"User":"{{ .BLOCKNEWS_USERNAME }}","Pass":"{{ .BLOCKNEWS_PASSWORD }}","MaxConnections":20,"Nickname":"blocknews","StorageGroup":"netnews"}
          ]}

        # Durable 2.x provider list: the imported catalogue mapping (profile,
        # backbone, priority tiers: 0 = eweka, 1 = the frugal primaries,
        # 2 = the metered fill accounts) with the 20 % connection share and the
        # ids the import generated, so provider stats and quota usage keep
        # their history across restarts.
        INFINIDYSK__PROVIDERS: >-
          [{"id":"01a1f8dd-d354-7290-8bf8-e2ebacacc569","name":"eweka","profile":"eweka","hostname":"news.eweka.nl","port":563,"tls":true,"username":"{{ .EWEKA_USERNAME }}","password":"{{ .EWEKA_PASSWORD }}","max_connections":10,"pipeline_depth":4,"priority":0,"backbone":"eweka","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2ecfd4a9bff","name":"frugal-eu","profile":"frugal-usenet","hostname":"eunews.frugalusenet.com","port":563,"tls":true,"username":"{{ .FRUGAL_USERNAME }}","password":"{{ .FRUGAL_PASSWORD }}","max_connections":15,"pipeline_depth":4,"priority":1,"backbone":"netnews","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2edabfdbf19","name":"frugal-us","profile":"frugal-usenet","hostname":"news.frugalusenet.com","port":563,"tls":true,"username":"{{ .FRUGAL_USERNAME }}","password":"{{ .FRUGAL_PASSWORD }}","max_connections":5,"pipeline_depth":4,"priority":1,"backbone":"netnews","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2ee601d77e9","name":"frugal-bonus","profile":"frugal-usenet","hostname":"bonus.frugalusenet.com","port":563,"tls":true,"username":"{{ .FRUGAL_USERNAME }}","password":"{{ .FRUGAL_PASSWORD }}","max_connections":10,"pipeline_depth":4,"priority":2,"backbone":"usenetfarm","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2efcadaa409","name":"blocknews","profile":"blocknews","hostname":"eunews.blocknews.net","port":563,"tls":true,"username":"{{ .BLOCKNEWS_USERNAME }}","password":"{{ .BLOCKNEWS_PASSWORD }}","max_connections":20,"pipeline_depth":4,"priority":2,"backbone":"netnews","enabled":true}]

        # --- *arr instances ---------------------------------------------------
        # All four point at the live apps on port 80. Expect 2.x to add a
        # `profile` (sonarr/radarr) per instance and to drop the 1.x QueueRules
        # it cannot express — 2.x hardcodes the queue actions.
        NZBDAV_CONFIG__ARR__INSTANCES: |
          {"SonarrInstances":[
            {"Name":"Sonarr","Host":"http://sonarr.media.svc.cluster.local:80","ApiKey":"{{ .SERVARR_API_KEY }}","Enabled":true},
            {"Name":"Sonarr 4K","Host":"http://sonarr4k.media.svc.cluster.local:80","ApiKey":"{{ .SERVARR_API_KEY }}","Enabled":true}
           ],
           "RadarrInstances":[
            {"Name":"Radarr","Host":"http://radarr.media.svc.cluster.local:80","ApiKey":"{{ .SERVARR_API_KEY }}","Enabled":true},
            {"Name":"Radarr 4K","Host":"http://radarr4k.media.svc.cluster.local:80","ApiKey":"{{ .SERVARR_API_KEY }}","Enabled":true}
           ]}

        # --- Import-only PostgreSQL source -----------------------------------
        # A clone of the 1.x database (`infinidysk_v2` on the shared postgres18
        # cluster), NOT the live one: the import must be rehearsable and the
        # test instance must not read a database that keeps changing under it.
        # Remove DATABASE_PROVIDER / DATABASE_CONNECTION_STRING from the
        # HelmRelease once the import has been verified.
        DATABASE_CONNECTION_STRING: "Host=${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local;Port=5432;Database=infinidysk_v2;Username={{ .POSTGRES_USERNAME }};Password={{ .POSTGRES_PASSWORD }}"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /infinidysk/API_KEY
    - secretKey: WEBDAV_USER
      remoteRef:
        key: /infinidysk/WEBDAV_USER
    - secretKey: WEBDAV_PASSWORD
      remoteRef:
        key: /infinidysk/WEBDAV_PASSWORD
    - secretKey: EWEKA_USERNAME
      remoteRef:
        key: /infinidysk/EWEKA_USERNAME
    - secretKey: EWEKA_PASSWORD
      remoteRef:
        key: /infinidysk/EWEKA_PASSWORD
    - secretKey: FRUGAL_USERNAME
      remoteRef:
        key: /infinidysk/FRUGAL_USERNAME
    - secretKey: FRUGAL_PASSWORD
      remoteRef:
        key: /infinidysk/FRUGAL_PASSWORD
    - secretKey: BLOCKNEWS_USERNAME
      remoteRef:
        key: /infinidysk/BLOCKNEWS_USERNAME
    - secretKey: BLOCKNEWS_PASSWORD
      remoteRef:
        key: /infinidysk/BLOCKNEWS_PASSWORD
    - secretKey: SERVARR_API_KEY
      remoteRef:
        key: /servarr/API_KEY
    - secretKey: POSTGRES_USERNAME
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_password
