---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Credential-bearing settings for the 2.x test instance, as `INFINIDYSK__*`
# environment variables. 2.x settings live in its database with this env
# overlay on top (env > database > defaults), exactly like 1.x's
# `NZBDAV_CONFIG__*`: a forced value shows as "Set by environment" in the UI and
# is never written to the store. Plain settings (mount dir, imports, categories,
# health, queue) sit in the HelmRelease next to the rest of the process wiring.
#
# Key names are the environment variable names on purpose — the HelmRelease
# loads this Secret with `envFrom`, so `INFINIDYSK__WEBDAV__USER` below becomes
# that variable and the rclone sidecar reads the same key.
#
# NOT here: `auth.api_key` (the admin API key). 2.x generates it on first start
# and keeps it in the store, so it is read from the settings row `auth` until
# `/infinidysk-v2/ADMIN_API_KEY` exists in Infisical — that is the step a
# ServiceMonitor needs, because `/metrics` sits behind this key in 2.x.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infinidysk-v2
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: infinidysk-v2-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # --- Store ------------------------------------------------------------
        # PostgreSQL, and its own EMPTY database: 2.x has a different schema and
        # refuses a non-empty target. The import (already done:
        # `upgrade.state = "done"`) wrote into whichever store was current, so
        # this empty database was filled directly.
        #
        # ONE underscore: this is a startup variable, not a setting. The
        # `INFINIDYSK__*` (double) namespace is the settings overlay — a
        # `INFINIDYSK__DATABASE_URL` is parsed as the settings path
        # `database.url`, unknown, and silently ignored (2.x then falls back to
        # `/config/database.toml`, else the default SQLite file, and tries to
        # re-import the 1.x install). `INFINIDYSK_DATABASE_URL` wins over the
        # boot file and disables the Settings > System > Database migration,
        # which keeps the store choice in Git.
        # Password must be URL-safe (alphanumeric today).
        INFINIDYSK_DATABASE_URL: "postgres://{{ .POSTGRES_USERNAME }}:{{ .POSTGRES_PASSWORD }}@${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local:5432/infinidysk_v2"

        # The 1.x-shaped import inputs and the 1.x reader variables lived here for
        # the cutover import (`upgrade.state = "done"`): the import builds its own
        # provider client from them and reads the cloned 1.x database, and neither
        # is used afterwards. The exact block is in
        # docs/infinidysk-v2-cutover.md, "Re-import recipe".
        # --- Admin API key ----------------------------------------------------
        # Forced so it survives a store reset and so /metrics (which 2.x serves
        # behind this key) can be scraped from Git-declared configuration. The
        # value lives in Infisical; see the ServiceMonitor.
        INFINIDYSK__AUTH__API_KEY: "{{ .ADMIN_API_KEY }}"

        # --- SABnzbd API key --------------------------------------------------
        # The *arrs' download-client credential, kept identical to 1.x so a
        # cutover is a URL change only.
        INFINIDYSK__SAB__API_KEY: "{{ .API_KEY }}"

        # --- WebDAV -----------------------------------------------------------
        # Plaintext here: 2.x stores what it is given, and the rclone sidecars
        # obscure it themselves (rclone's obfuscation is not deterministic, so it
        # is never stored). Do not rely on the 1.x password being adopted —
        # beta.10 401s on that path (docs/infinidysk-v2-cutover.md, Phase B).
        INFINIDYSK__WEBDAV__USER: "{{ .WEBDAV_USER }}"
        INFINIDYSK__WEBDAV__PASSWORD: "{{ .WEBDAV_PASSWORD }}"

        # --- Usenet providers -------------------------------------------------
        # The 2.x shape: snake_case, a JSON **list** (lists replace wholesale, so
        # this is always the whole set), fixed `id`s so provider stats and quota
        # usage survive restarts.
        #
        # 20 % of every account allowance: the live 1.x backend holds the other
        # 80 % (40/60/20/40/80). The per-account sums must equal the plan limits
        # or the providers start refusing connections — every allowance divides
        # evenly by 5, so the split is exact (docs/infinidysk-v2-cutover.md,
        # "Provider connection split").
        #
        # Columns: `profile`/`backbone` come from the provider catalog, `priority`
        # is the tier (equal numbers form one pool, higher numbers are asked only
        # after lower ones miss) — 0 = eweka, 1 = the frugal primaries,
        # 2 = the two metered fill accounts, matching 1.x's cascade order.
        INFINIDYSK__PROVIDERS: >-
          [{"id":"01a1f8dd-d354-7290-8bf8-e2ebacacc569","name":"eweka","profile":"eweka","hostname":"news.eweka.nl","port":563,"tls":true,"username":"{{ .EWEKA_USERNAME }}","password":"{{ .EWEKA_PASSWORD }}","max_connections":10,"pipeline_depth":4,"priority":0,"backbone":"eweka","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2ecfd4a9bff","name":"frugal-eu","profile":"frugal-usenet","hostname":"eunews.frugalusenet.com","port":563,"tls":true,"username":"{{ .FRUGAL_USERNAME }}","password":"{{ .FRUGAL_PASSWORD }}","max_connections":15,"pipeline_depth":4,"priority":1,"backbone":"netnews","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2edabfdbf19","name":"frugal-us","profile":"frugal-usenet","hostname":"news.frugalusenet.com","port":563,"tls":true,"username":"{{ .FRUGAL_USERNAME }}","password":"{{ .FRUGAL_PASSWORD }}","max_connections":5,"pipeline_depth":4,"priority":1,"backbone":"netnews","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2ee601d77e9","name":"frugal-bonus","profile":"frugal-usenet","hostname":"bonus.frugalusenet.com","port":563,"tls":true,"username":"{{ .FRUGAL_USERNAME }}","password":"{{ .FRUGAL_PASSWORD }}","max_connections":10,"pipeline_depth":4,"priority":2,"backbone":"usenetfarm","enabled":true},
          {"id":"01a1f8dd-d354-7290-8bf8-e2efcadaa409","name":"blocknews","profile":"blocknews","hostname":"eunews.blocknews.net","port":563,"tls":true,"username":"{{ .BLOCKNEWS_USERNAME }}","password":"{{ .BLOCKNEWS_PASSWORD }}","max_connections":20,"pipeline_depth":4,"priority":2,"backbone":"netnews","enabled":true}]

        # --- *arr instances ---------------------------------------------------
        # A JSON list in the 2.x shape: `profile` is required (sonarr/radarr/
        # lidarr/chaptarr/whisparr/sportarr) and `id` is fixed. Port 80 for all
        # four: the Radarrs map their Service 80 -> 7878 via `targetPort`, so the
        # container port is unreachable from another pod.
        INFINIDYSK__ARR_INSTANCES: >-
          [{"id":"01a1f922-4f16-715f-a884-4de0e0eb8255","name":"Radarr","profile":"radarr","url":"http://radarr.media.svc.cluster.local:80","api_key":"{{ .SERVARR_API_KEY }}","enabled":true},
          {"id":"01a1f922-4f16-715f-a884-4de1c2ce3f9a","name":"Radarr 4K","profile":"radarr","url":"http://radarr4k.media.svc.cluster.local:80","api_key":"{{ .SERVARR_API_KEY }}","enabled":true},
          {"id":"01a1f922-4f16-715f-a884-4de2d8b4505c","name":"Sonarr","profile":"sonarr","url":"http://sonarr.media.svc.cluster.local:80","api_key":"{{ .SERVARR_API_KEY }}","enabled":true},
          {"id":"01a1f922-4f16-715f-a884-4de3d5f86d43","name":"Sonarr 4K","profile":"sonarr","url":"http://sonarr4k.media.svc.cluster.local:80","api_key":"{{ .SERVARR_API_KEY }}","enabled":true}]
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /infinidysk/API_KEY
    - secretKey: ADMIN_API_KEY
      remoteRef:
        key: /infinidysk-v2/ADMIN_API_KEY
    - secretKey: WEBDAV_USER
      remoteRef:
        key: /infinidysk/WEBDAV_USER
    - secretKey: WEBDAV_PASSWORD
      remoteRef:
        key: /infinidysk/WEBDAV_PASSWORD
    - secretKey: EWEKA_USERNAME
      remoteRef:
        key: /infinidysk/EWEKA_USERNAME
    - secretKey: EWEKA_PASSWORD
      remoteRef:
        key: /infinidysk/EWEKA_PASSWORD
    - secretKey: FRUGAL_USERNAME
      remoteRef:
        key: /infinidysk/FRUGAL_USERNAME
    - secretKey: FRUGAL_PASSWORD
      remoteRef:
        key: /infinidysk/FRUGAL_PASSWORD
    - secretKey: BLOCKNEWS_USERNAME
      remoteRef:
        key: /infinidysk/BLOCKNEWS_USERNAME
    - secretKey: BLOCKNEWS_PASSWORD
      remoteRef:
        key: /infinidysk/BLOCKNEWS_PASSWORD
    - secretKey: SERVARR_API_KEY
      remoteRef:
        key: /servarr/API_KEY
    - secretKey: POSTGRES_USERNAME
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_password
