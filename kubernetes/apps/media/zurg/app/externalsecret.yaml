---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The whole zurg config.yml is rendered here because zurg's config has no
# environment-variable interpolation: the Usenet credentials have to live in the
# file itself. Everything else in the file is plain, non-secret configuration.
#
# This file is the source of truth: an initContainer copies it onto the /config
# PVC on every pod start, so dashboard edits do not survive a restart. Change
# settings here (or delete /config/config.yml to let the dashboard own it).
#
# Providers: zurg supports Real-Debrid / TorBox / AllDebrid / Premiumize /
# Debrid-Link / Offcloud and Usenet side by side, but only ONE enabled `nzb`
# entry — extra news servers go under that entry's `nntp.servers`, which is what
# is done below (Eweka primary; Frugal as a second unlimited backbone; Frugal
# bonus + Blocknews as block backups consulted only when a primary lacks the
# article). Add a debrid account as another `providers:` entry when there is a
# paid key for one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zurg
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zurg-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yml: |
          zurg: v1
          # Aggregate read throughput is the combined connection allowance of
          # every non-backup account: 50 (Eweka) + 75 (Frugal EU) + 25 (Frugal
          # US) = 150. The two `backup: true` accounts are metered fill and do
          # not count toward it; they are asked only once every primary has
          # answered "no such article".
          #
          # `backbone` names the article spool an account resolves to, so a
          # spool already asked is not asked again. A wrong *shared* name would
          # skip a genuine fill, so only accounts known to sit on one spool
          # share a name (Frugal EU + US); everything else stays distinct.
          providers:
            - type: nzb
              nntp:
                host: news.eweka.nl
                port: 563
                tls: true
                username: "{{ .EWEKA_USERNAME }}"
                password: "{{ .EWEKA_PASSWORD }}"
                # Plan allowance — zurg reads at this number, it is not a
                # politeness limit. Going over gets connections refused.
                connections: 50
                cache_size_mb: 1024
                backbone: omicron
                servers:
                  - name: frugal-eu
                    host: eunews.frugalusenet.com
                    port: 563
                    tls: true
                    username: "{{ .FRUGAL_USERNAME }}"
                    password: "{{ .FRUGAL_PASSWORD }}"
                    connections: 75
                    cache_size_mb: 1024
                    priority: 1
                    backbone: frugal
                  - name: frugal-us
                    host: news.frugalusenet.com
                    port: 563
                    tls: true
                    username: "{{ .FRUGAL_USERNAME }}"
                    password: "{{ .FRUGAL_PASSWORD }}"
                    connections: 25
                    # Ranked below frugal-eu, so it is only used when the EU
                    # account has no free connection (or for throughput
                    # overflow); the shared backbone means a miss on EU is not
                    # re-asked on the same spool either way.
                    priority: 2
                    backbone: frugal
                  - name: frugal-bonus
                    host: bonus.frugalusenet.com
                    port: 563
                    tls: true
                    username: "{{ .FRUGAL_USERNAME }}"
                    password: "{{ .FRUGAL_PASSWORD }}"
                    connections: 50
                    # Separate backbone (and a monthly cap): fill only.
                    backup: true
                  - name: blocknews
                    host: eunews.blocknews.net
                    port: 563
                    tls: true
                    username: "{{ .BLOCKNEWS_USERNAME }}"
                    password: "{{ .BLOCKNEWS_PASSWORD }}"
                    connections: 100
                    # Metered block pack on the NetNews spool, not Omicron.
                    backup: true
                    backbone: netnews

          # Idle, authenticated connections kept ready per account so a read
          # after a quiet spell does not pay the ~0.8s TCP+TLS+greeting+AUTHINFO
          # dial. 4 is the built-in news default; stated so it is visible.
          warm_connections: 4

          # Consumers mount zurg's WebDAV themselves (rclone sidecars), so this
          # is the path the *arr sees, and it drives SABnzbd's complete_dir.
          rclone_enabled: false
          mount_path: /aio/remote/zurg

          # One credential for the dashboard, WebDAV and /api. /mcp is refused
          # by zurg unless a username is set — its tools delete releases and
          # rewrite config.yml — so this is what unlocks the MCP block below.
          # /http/version.txt stays unprotected in zurg, so the k8s probes and
          # the Gatus check keep working. Every WebDAV consumer must send it;
          # the rclone sidecars read it from the zurg-auth secret.
          username: "{{ .BASIC_AUTH_USERNAME }}"
          password: "{{ .BASIC_AUTH_PASSWORD }}"

          # Go soft ceiling. The pod limit is 6Gi (helmrelease.yaml) and a
          # ~7,400-release Usenet library sits near 2GiB of live heap, so this
          # leaves headroom; `library_detail: auto` reclaims idle file tables
          # before the ceiling is ever reached.
          memory_limit_mb: 5120

          # Article lists are written to data/nzb-index/*.bin and mapped on
          # demand instead of held on the heap (the Linux default, stated so an
          # upstream default change is visible). Idle ones are released after 5m.
          nzb_segments: mmap
          nzb_segments_idle_secs: 300
          # Keep per-file detail resident and only give an idle table back
          # under sustained pressure; a rebuild is sub-millisecond, so this is
          # effective insurance rather than a streaming cost.
          library_detail: auto
          library_detail_idle_secs: 900

          # nzbs/ is watched once a second on its own; this periodic pass is the
          # backstop that catches an NZB replaced in place under the same name.
          check_for_changes_every_secs: 15

          # Usenet repair is PAR2. Rebuilt bytes are persisted to data/par2/ so
          # a restart does not re-read a whole release to recover them.
          enable_repair: true
          repair_every_mins: 60
          par2_patch_cache_mb: 512
          # Persistent byte caches (under data/bytecache). Left at default: the
          # 30Gi /config claim also holds the raw NZBs — the only copy of the
          # library — and the 5Gi+ article index, so raise these together with
          # the claim, not before it.
          nzb_article_disk_cache_mb: 512
          archive_decoded_disk_cache_mb: 512
          stream_compressed_archives: true

          # No `directories:` filters on purpose: everything is addressed
          # through __magic__ (*arr roots under __magic__/tv and /movies, Plex
          # pointed at the same tree), so the computed views would only be a
          # second address for the same releases.
          magic:
            enabled: true
            # A DELETE under __magic__ hides the entry; it never destroys
            # content from a debrid account. A release folder is never deleted
            # whatever this is set to, which is what an *arr cleanup expects.
            allow_delete: false
            sidecar_max_mb: 32
            # *arr posters/`.nfo` and Bazarr subtitles are PUT into the
            # namespace by each consumer's own rclone sidecar and land on the
            # /config PVC as data/local/__magic__/. The 2Gi default is far too
            # small for a large library, and hitting it fails a subtitle write
            # with 507 rather than degrading, so cap it at 10Gi instead.
            sidecar_budget_mb: 10240

          # Sonarr/Radarr hand NZBs over the SABnzbd-compatible endpoint and
          # import the finished release from __magic__ by rename (a row write,
          # no bytes moved). The API key is generated once into
          # data/sabnzbd-apikey; complete_dir must be the path the *arr sees.
          sabnzbd:
            enabled: true
            complete_dir: /aio/remote/zurg/__magic__/__all__
            categories:
              - other
              - radarr
              - radarr4k
              - sonarr
              - sonarr4k
              - nonplex

          # /mcp is zurg's Model Context Protocol endpoint, served behind the
          # same basic auth as the dashboard. The toolset list is the built-in
          # read/repair subset plus `magic` (this install addresses the library
          # through __magic__) and `diagnostics`; the write, config, system and
          # mount groups stay off. `allow_lifecycle` stays false, so the tools
          # that stop zurg or cycle the mount are withheld whatever the list
          # says, and destructive tools hand back a confirmation token before
          # they act.
          mcp:
            enabled: true
            toolsets:
              - library
              - releases
              - repair
              - magic
              - usenet
              - diagnostics
            read_only: false
            allow_unauthenticated: false
            allow_lifecycle: false
            page_limit: 50
            max_result_kb: 256
            session_timeout_mins: 30
  data:
    - secretKey: EWEKA_USERNAME
      remoteRef:
        key: /zurg/EWEKA_USERNAME
    - secretKey: EWEKA_PASSWORD
      remoteRef:
        key: /zurg/EWEKA_PASSWORD
    - secretKey: FRUGAL_USERNAME
      remoteRef:
        key: /zurg/FRUGAL_USERNAME
    - secretKey: FRUGAL_PASSWORD
      remoteRef:
        key: /zurg/FRUGAL_PASSWORD
    - secretKey: BLOCKNEWS_USERNAME
      remoteRef:
        key: /zurg/BLOCKNEWS_USERNAME
    - secretKey: BLOCKNEWS_PASSWORD
      remoteRef:
        key: /zurg/BLOCKNEWS_PASSWORD
    - secretKey: BASIC_AUTH_USERNAME
      remoteRef:
        key: /zurg/BASIC_AUTH_USERNAME
    - secretKey: BASIC_AUTH_PASSWORD
      remoteRef:
        key: /zurg/BASIC_AUTH_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Sponsor-only image: ghcr.io/debridmediamanager/zurg is a private package, so
# the media namespace needs a pull secret holding a GitHub token with
# read:packages access (the account the sponsorship is linked to).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zurg-ghcr
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zurg-ghcr
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .GHCR_USERNAME }}","password":"{{ .GHCR_TOKEN }}"}}}
  data:
    - secretKey: GHCR_USERNAME
      remoteRef:
        key: /zurg/GHCR_USERNAME
    - secretKey: GHCR_TOKEN
      remoteRef:
        key: /zurg/GHCR_TOKEN
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The zurg basic-auth credential in rclone's env-var shape, for the WebDAV
# consumers. Zurg itself reads the same values out of config.yml; this exists
# so a sidecar can `envFrom` it without either secret carrying the other's
# shape.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zurg-auth
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zurg-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RCLONE_CONFIG_ZURG_USER: "{{ .username }}"
        # rclone treats a RCLONE_CONFIG_*_PASS value as already obscured and
        # reveals it, so the plaintext lives under a neutral key here and each
        # consumer obscures it for itself (`--webdav-pass="$(rclone obscure
        # "$ZURG_WEBDAV_PASSWORD")"`). One key to rotate, no pre-obscured copy
        # to fall out of sync with config.yml.
        ZURG_WEBDAV_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: /zurg/BASIC_AUTH_USERNAME
    - secretKey: password
      remoteRef:
        key: /zurg/BASIC_AUTH_PASSWORD
