---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The whole zurg config.yml is rendered here because zurg's config has no
# environment-variable interpolation: the Usenet credentials have to live in the
# file itself. Everything else in the file is plain, non-secret configuration.
#
# This file is the source of truth: an initContainer copies it onto the /config
# PVC on every pod start, so dashboard edits do not survive a restart. Change
# settings here (or delete /config/config.yml to let the dashboard own it).
#
# Providers: zurg supports Real-Debrid / TorBox / AllDebrid / Premiumize /
# Debrid-Link / Offcloud and Usenet side by side, but only ONE enabled `nzb`
# entry — extra news servers go under that entry's `nntp.servers`, which is what
# is done below (Eweka primary; Frugal as a second unlimited backbone; Frugal
# bonus + Blocknews as block backups consulted only when a primary lacks the
# article). Add a debrid account as another `providers:` entry when there is a
# paid key for one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zurg
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zurg-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yml: |
          zurg: v1
          providers:
            - type: nzb
              nntp:
                host: news.eweka.nl
                port: 563
                tls: true
                username: "{{ .EWEKA_USERNAME }}"
                password: "{{ .EWEKA_PASSWORD }}"
                connections: 50
                servers:
                  - name: frugal-eu
                    host: eunews.frugalusenet.com
                    port: 563
                    tls: true
                    username: "{{ .FRUGAL_USERNAME }}"
                    password: "{{ .FRUGAL_PASSWORD }}"
                    connections: 75
                    priority: 1
                  - name: frugal-us
                    host: news.frugalusenet.com
                    port: 563
                    tls: true
                    username: "{{ .FRUGAL_USERNAME }}"
                    password: "{{ .FRUGAL_PASSWORD }}"
                    connections: 25
                    priority: 1
                  - name: frugal-bonus
                    host: bonus.frugalusenet.com
                    port: 563
                    tls: true
                    username: "{{ .FRUGAL_USERNAME }}"
                    password: "{{ .FRUGAL_PASSWORD }}"
                    connections: 50
                    backup: true
                  - name: blocknews
                    host: eunews.blocknews.net
                    port: 563
                    tls: true
                    username: "{{ .BLOCKNEWS_USERNAME }}"
                    password: "{{ .BLOCKNEWS_PASSWORD }}"
                    connections: 100
                    backup: true
          rclone_enabled: false
          # Consumers mount zurg's WebDAV themselves (rclone sidecars), so this
          # only drives Plex path reporting and the SABnzbd complete_dir.
          mount_path: /aio/remote/zurg
          # Soft Go collector budget. The migrated library is ~7,400 releases /
          # ~95M segments, which the upstream mmap benchmark puts near 4 GB RSS,
          # so 3072 caused GC thrash. Keep this below the container limit.
          memory_limit_mb: 6144
          magic:
            enabled: true
            # *arr posters/`.nfo` and Bazarr subtitles are PUT into the
            # namespace by each consumer's own rclone sidecar and land on the
            # /config PVC as data/local/__magic__/. The 2Gi default is far too
            # small for a large library, and hitting it fails a subtitle write
            # with 507 rather than degrading, so cap it at 10Gi instead.
            sidecar_budget_mb: 10240
          sabnzbd:
            enabled: true
            categories:
              - tv
              - movies
              - other
          directories:
            shows:
              group: media
              group_order: 10
              filters:
                - has_episodes: true
            movies:
              group: media
              group_order: 20
              filters:
                - only_show_the_biggest_file: true
  data:
    - secretKey: EWEKA_USERNAME
      remoteRef:
        key: /zurg/EWEKA_USERNAME
    - secretKey: EWEKA_PASSWORD
      remoteRef:
        key: /zurg/EWEKA_PASSWORD
    - secretKey: FRUGAL_USERNAME
      remoteRef:
        key: /zurg/FRUGAL_USERNAME
    - secretKey: FRUGAL_PASSWORD
      remoteRef:
        key: /zurg/FRUGAL_PASSWORD
    - secretKey: BLOCKNEWS_USERNAME
      remoteRef:
        key: /zurg/BLOCKNEWS_USERNAME
    - secretKey: BLOCKNEWS_PASSWORD
      remoteRef:
        key: /zurg/BLOCKNEWS_PASSWORD
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Sponsor-only image: ghcr.io/debridmediamanager/zurg is a private package, so
# the media namespace needs a pull secret holding a GitHub token with
# read:packages access (the account the sponsorship is linked to).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zurg-ghcr
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: zurg-ghcr
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .GHCR_USERNAME }}","password":"{{ .GHCR_TOKEN }}"}}}
  data:
    - secretKey: GHCR_USERNAME
      remoteRef:
        key: /zurg/GHCR_USERNAME
    - secretKey: GHCR_TOKEN
      remoteRef:
        key: /zurg/GHCR_TOKEN
