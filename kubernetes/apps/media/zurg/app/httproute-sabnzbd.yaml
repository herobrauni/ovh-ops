---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# SABnzbd endpoint, deliberately NOT targeted by the SecurityPolicy: Sonarr and
# Radarr send no basic auth (and cannot complete an SSO redirect), and zurg gates
# this endpoint with its own API key instead. The matches are narrow on purpose —
# `/api` is Exact so the dashboard's `/api/providers` and `/api/library/entry`
# stay behind Authentik; only the bare SABnzbd `/api` and `/sabnzbd/*` bypass.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zurg-480p-com-sabnzbd
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - zurg.480p.com
  parentRefs:
    - name: envoy-480p-com-public
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /api
        - path:
            type: PathPrefix
            value: /sabnzbd
      backendRefs:
        - name: zurg
          port: 9999
