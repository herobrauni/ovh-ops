---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zurg
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/dnsendpoint
    - ../../../../components/kopiur
  dependsOn:
    - name: infisical
      namespace: external-secrets
    - name: kopiur-repository
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/media/zurg/app
  postBuild:
    substitute:
      # *arr/Bazarr sidecars.
      # .nzbz store), the mmap article indexes, and up to sidecar_budget_mb of
      # /config holds the NZB watch directory (the raw NZBs are the only copy
      # Greenfield app: deploy empty on a missing snapshot instead of failing.
      # of the library, and zurg keeps them uncompressed unlike altmount's
      APP: *app
      DOMAIN: 480p.com
      KOPIUR_CAPACITY: 30Gi
      KOPIUR_ON_MISSING_SNAPSHOT: Continue
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
