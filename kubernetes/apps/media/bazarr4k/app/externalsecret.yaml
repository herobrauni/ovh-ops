---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr4k
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bazarr4k-secret
    creationPolicy: Owner
    template:
      data:
        BAZARR_API_KEY: "{{ .API_KEY }}"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /bazarr4k/API_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr4k-config
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bazarr4k-config-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Seeded on first boot by the config-init container and only when the
        # file is missing/empty/not writable — after that Bazarr owns it.
        #
        # Unlike the HD instance (whose *arr wiring was applied at runtime),
        # this one is declarative from the start: auth is handled by Authentik
        # at the gateway, and both 4K *arrs are wired in with the shared
        # /servarr/API_KEY the *arrs already use.
        config.yaml: |
          auth:
            apikey: {{ .API_KEY }}
            type: null
            username: ''
            password: ''
          general:
            use_sonarr: true
            use_radarr: true
            serie_default_enabled: true
            movie_default_enabled: true
            use_embedded_subs: true
            utf8_encode: true
          sonarr:
            ip: sonarr4k.media.svc.cluster.local
            port: 80
            base_url: /
            ssl: false
            apikey: {{ .SERVARR_API_KEY }}
            only_monitored: true
            series_sync: 60
            full_update: Daily
          radarr:
            ip: radarr4k.media.svc.cluster.local
            port: 80
            base_url: /
            ssl: false
            apikey: {{ .SERVARR_API_KEY }}
            only_monitored: true
            movies_sync: 60
            full_update: Daily
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /bazarr4k/API_KEY
    - secretKey: SERVARR_API_KEY
      remoteRef:
        key: /servarr/API_KEY
