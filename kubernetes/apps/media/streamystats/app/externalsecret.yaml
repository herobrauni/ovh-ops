---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: streamystats-secret
    creationPolicy: Owner
    template:
      data:
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
        # Both containers consume this file: it signs the Next.js server-action
        # closures and, unless INTERNAL_API_KEY is set, is also the key the two
        # services use towards each other. It must stay stable across rollouts
        # (a new value invalidates every cached server action / open session).
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "{{ .NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: /streamystats/SESSION_SECRET
    - secretKey: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
      remoteRef:
        key: /streamystats/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
