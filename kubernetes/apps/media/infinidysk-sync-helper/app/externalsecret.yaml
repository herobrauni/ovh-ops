---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The SABnzbd API key is the same value the *arrs use as a download-client key
# and InfiniDysk holds as `api.key` / FRONTEND_BACKEND_API_KEY. Reading it from
# the same Infisical entry keeps the helper working across a key rotation in
# one place (and after a /config restore, which cannot change it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infinidysk-sync-helper
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: infinidysk-sync-helper-secret
    creationPolicy: Owner
  data:
    - secretKey: SAB_API_KEY
      remoteRef:
        key: /infinidysk/API_KEY
    # Mints a library refresh for the "Other" library after a placement. Jellyfin
    # 12 only accepts `Authorization: MediaBrowser Token="..."` (X-Emby-Token and
    # api_key are disabled), so the helper sends that header. Admin-scoped: the
    # refresh endpoint and /ScheduledTasks both answer 200 with it.
    #
    # Deliberately not /zurg/JELLYFIN_TOKEN (zurg's push-scan key): /zurg/* is
    # deleted in Phase 6, and this helper must outlive it.
    - secretKey: JELLYFIN_TOKEN
      remoteRef:
        key: /jellyfin/API_KEY
