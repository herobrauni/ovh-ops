---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# The SABnzbd API key is the same value the *arrs use as a download-client key
# and InfiniDysk holds as `api.key` / FRONTEND_BACKEND_API_KEY. Reading it from
# the same Infisical entry keeps the helper working across a key rotation in
# one place (and after a /config restore, which cannot change it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infinidysk-sync-helper
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: infinidysk-sync-helper-secret
    creationPolicy: Owner
  data:
    - secretKey: SAB_API_KEY
      remoteRef:
        key: /infinidysk/API_KEY
