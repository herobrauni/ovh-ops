---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# This route is NOT ext-authed: InfiniDysk authenticates itself against authentik
# over OIDC (see the OIDC_* block in helmrelease.yaml), so there is no
# `components/authentik` SecurityPolicy targeting it. Only the frontend (3000) is
# published — the WebDAV backend (8080) stays in-cluster. Manual NZB uploads go
# through the session-authenticated UI; the SABnzbd API is on this host too and
# is API-key protected (the *arrs use the in-cluster Service instead).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infinidysk-480p-com
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: InfiniDysk
    gethomepage.dev/pod-selector: app.kubernetes.io/name=infinidysk
    gethomepage.dev/icon: mdi-harddisk-plus
    # Gatus liveness: /healthz is the frontend's health endpoint, served without
    # a session (it is not behind the OIDC login either), so it answers 200 for
    # the in-cluster probes.
    gatus.home-operations.com/endpoint: |-
      url: https://infinidysk.480p.com/healthz
spec:
  hostnames:
    - infinidysk.480p.com
  parentRefs:
    - name: envoy-480p-com-public
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: infinidysk
          port: 3000
