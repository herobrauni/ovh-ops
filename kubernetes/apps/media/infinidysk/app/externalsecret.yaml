---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# All InfiniDysk settings that must live in Git are rendered here into
# `NZBDAV_CONFIG__*` environment variables (the "headless" overlay, since 0.9.0):
# ENV wins over the Settings UI, the UI shows the managed keys read-only, and the
# values are never written into SQLite. Everything not listed here stays
# UI-owned (streaming tuning, repair cadence, indexers, search profiles).
#
# Two constraints on this file:
#   1. Unknown keys abort startup (healthcheck fails, pod never becomes ready),
#      and so does an unknown *property* inside a structured JSON value. Config
#      keys follow the documented mapping: api.import-strategy ->
#      NZBDAV_CONFIG__API__IMPORT_STRATEGY (see
#      https://www.infinidysk.com/configuration/headless/).
#   2. Usenet passwords are interpolated into JSON strings, so they must not
#      contain `"`, `\` or `$`.
#
# The SABnzbd/API key is one value used twice: FRONTEND_BACKEND_API_KEY (the
# frontend's proxy auth to the backend) and NZBDAV_CONFIG__API__KEY (what the
# *arr download clients send).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infinidysk
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: infinidysk-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        FRONTEND_BACKEND_API_KEY: "{{ .API_KEY }}"
        NZBDAV_CONFIG__API__KEY: "{{ .API_KEY }}"
        NZBDAV_CONFIG__WEBDAV__USER: "{{ .WEBDAV_USER }}"
        # Plaintext is hashed by InfiniDysk at overlay load. The rclone sidecars
        # use the same value and obscure it at container start (rclone's
        # obfuscation is not deterministic, so it is never stored).
        NZBDAV_CONFIG__WEBDAV__PASS: "{{ .WEBDAV_PASSWORD }}"

        # --- Usenet providers -------------------------------------------------
        # PascalCase properties, matching the Settings UI payload. Mapping from
        # the retired zurg config:
        #   * Type 1 = Pool Connections (primary, counts toward throughput),
        #     Type 3 = BackupOnly (consulted only after every primary misses).
        #   * StorageGroup ≙ zurg's `backbone`: a spool already asked is not
        #     asked again. Frugal EU/US share one; Blocknews is NetNews.
        #   * MaxConnections is the provider-wide ceiling (zurg's `connections`).
        # Aggregate read throughput is 50 (Eweka) + 75 + 25 (Frugal) = 150.
        NZBDAV_CONFIG__USENET__PROVIDERS: |
          {"Providers":[
            {"Type":1,"Host":"news.eweka.nl","Port":563,"UseSsl":true,"User":"{{ .EWEKA_USERNAME }}","Pass":"{{ .EWEKA_PASSWORD }}","MaxConnections":50,"Nickname":"eweka","StorageGroup":"omicron"},
            {"Type":1,"Host":"eunews.frugalusenet.com","Port":563,"UseSsl":true,"User":"{{ .FRUGAL_USERNAME }}","Pass":"{{ .FRUGAL_PASSWORD }}","MaxConnections":75,"Nickname":"frugal-eu","StorageGroup":"frugal"},
            {"Type":1,"Host":"news.frugalusenet.com","Port":563,"UseSsl":true,"User":"{{ .FRUGAL_USERNAME }}","Pass":"{{ .FRUGAL_PASSWORD }}","MaxConnections":25,"Nickname":"frugal-us","StorageGroup":"frugal"},
            {"Type":3,"Host":"bonus.frugalusenet.com","Port":563,"UseSsl":true,"User":"{{ .FRUGAL_USERNAME }}","Pass":"{{ .FRUGAL_PASSWORD }}","MaxConnections":50,"Nickname":"frugal-bonus"},
            {"Type":3,"Host":"eunews.blocknews.net","Port":563,"UseSsl":true,"User":"{{ .BLOCKNEWS_USERNAME }}","Pass":"{{ .BLOCKNEWS_PASSWORD }}","MaxConnections":100,"Nickname":"blocknews","StorageGroup":"netnews"}
          ]}

        # --- *arr instances ---------------------------------------------------
        # Used for the Overview health widget and Automatic Queue Management
        # (stuck-import handling). Sonarr listens on :80 (SONARR__SERVER__PORT)
        # while the Radarrs keep :7878. All four share the one servarr API key.
        NZBDAV_CONFIG__ARR__INSTANCES: |
          {"SonarrInstances":[
            {"Host":"http://sonarr.media.svc.cluster.local:80","ApiKey":"{{ .SERVARR_API_KEY }}"},
            {"Host":"http://sonarr4k.media.svc.cluster.local:80","ApiKey":"{{ .SERVARR_API_KEY }}"}
           ],
           "RadarrInstances":[
            {"Host":"http://radarr.media.svc.cluster.local:7878","ApiKey":"{{ .SERVARR_API_KEY }}"},
            {"Host":"http://radarr4k.media.svc.cluster.local:7878","ApiKey":"{{ .SERVARR_API_KEY }}"}
           ],
           "QueueRules":[]}

        # *arr -> Prowlarr `addurl` targets are private addresses; allowlist the
        # indexer host so manual grabs through Prowlarr are not SSRF-rejected.
        NZBDAV_CONFIG__API__ADDURL_TRUSTED_HOSTS: "prowlarr,prowlarr.media.svc.cluster.local"

        # --- PostgreSQL main database ----------------------------------------
        # InfiniDysk takes ONE ADO.NET connection string, so the shared
        # components/cnpg flow (which publishes discrete host/port/db/user keys)
        # does not fit, and `$(VAR)` env composition inside the pod is not
        # reliable: app-template renders the env map in sorted key order, so
        # DATABASE_CONNECTION_STRING would resolve before PGPORT and the
        # placeholders reach Npgsql literally ("Couldn't set port"). Hence this
        # app carries its own DB secrets instead of the component.
        #
        # PostgreSQL main-DB support is new-install only: the app refuses to
        # start while /config/db.sqlite exists, and there is no SQLite
        # migration path. Only the main store moves — metrics.sqlite,
        # warden.db, blobs/ and the NZB corpus stay on /config.
        DATABASE_CONNECTION_STRING: "Host=${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local;Port=5432;Database=${APP};Username={{ .POSTGRES_USERNAME }};Password={{ .POSTGRES_PASSWORD }}"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /infinidysk/API_KEY
    - secretKey: WEBDAV_USER
      remoteRef:
        key: /infinidysk/WEBDAV_USER
    - secretKey: WEBDAV_PASSWORD
      remoteRef:
        key: /infinidysk/WEBDAV_PASSWORD
    # NNTP credentials are copied from /zurg/* rather than referenced, so
    # /infinidysk/* is self-contained and /zurg/* can be deleted at teardown.
    - secretKey: EWEKA_USERNAME
      remoteRef:
        key: /infinidysk/EWEKA_USERNAME
    - secretKey: EWEKA_PASSWORD
      remoteRef:
        key: /infinidysk/EWEKA_PASSWORD
    - secretKey: FRUGAL_USERNAME
      remoteRef:
        key: /infinidysk/FRUGAL_USERNAME
    - secretKey: FRUGAL_PASSWORD
      remoteRef:
        key: /infinidysk/FRUGAL_PASSWORD
    - secretKey: BLOCKNEWS_USERNAME
      remoteRef:
        key: /infinidysk/BLOCKNEWS_USERNAME
    - secretKey: BLOCKNEWS_PASSWORD
      remoteRef:
        key: /infinidysk/BLOCKNEWS_PASSWORD
    # Shared Sonarr/Radarr API key (ESO cannot read another Secret, so it is
    # templated from the same Infisical path that `servarr-secret` consumes).
    - secretKey: SERVARR_API_KEY
      remoteRef:
        key: /servarr/API_KEY
    # PostgreSQL main database (role/database are both `infinidysk` on the
    # shared postgres18 cluster; created by the postgres-init initContainer of
    # `infinidysk-initdb-secret` below).
    - secretKey: POSTGRES_USERNAME
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_password

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Credentials for the `postgres-init` initContainer, which creates the role and
# database on the shared cluster. Same shape as components/cnpg produces -- kept
# local because the main secret above needs the composed connection string, so
# there is no second (unused) pguser Secret to keep in sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infinidysk-initdb
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: infinidysk-initdb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: ${APP}
        INIT_POSTGRES_HOST: ${CNPG_NAME:=postgres18}-rw.dbms.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .postgres_username }}"
        INIT_POSTGRES_PASS: "{{ .postgres_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .password }}"
  data:
    - secretKey: postgres_username
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_username
    - secretKey: postgres_password
      remoteRef:
        key: /cloudnative-pg/infinidysk_postgres_password
    - secretKey: password
      remoteRef:
        key: /cloudnative-pg/password
