---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app infinidysk
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/dnsendpoint
    - ../../../../components/authentik
    - ../../../../components/kopiur
  dependsOn:
    - name: infisical
      namespace: external-secrets
    - name: cloudnative-pg-cluster
      namespace: dbms
    - name: kopiur-repository
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: authentik
      namespace: authentik
  interval: 1h
  path: ./kubernetes/apps/media/infinidysk/app
  postBuild:
    substitute:
      APP: *app
      CNPG_NAME: postgres18
      DOMAIN: 480p.com
      # The main operational database lives in the shared postgres18 cluster
      # (PostgreSQL main-database support is new-install-only — there is no
      # SQLite migration path). /config still holds blobs, the NZB corpus and
      # the auxiliary SQLite stores (metrics/warden).
      KOPIUR_CAPACITY: 30Gi
      # Greenfield app: deploy empty on a missing snapshot instead of failing.
      KOPIUR_ON_MISSING_SNAPSHOT: Continue
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
