---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app 
spec:
  chartRef:
    kind: OCIRepository
    name: 
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      :
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: -secret,-initdb-secret,-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.4@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
            envFrom:
              - secretRef:
                  name: -initdb-secret
        containers:
          app:
            image:
              repository: docker.io/muniftanjim/
              tag: 0.103.2@sha256:096f8e1fd8243840c433964577cc406bd1a0859f2fa73f658ccc367dc4295bd4
            env:
              STREMTHRU_BASE_URL: https://.480p.com
              STREMTHRU_PORT: &targetPort 8080
              STREMTHRU_DATA_DIR: /app/data
              STREMTHRU_DATABASE_URI:
                valueFrom:
                  secretKeyRef:
                    name: &pguser -pguser-secret
                    key: uri
              STREMTHRU_REDIS_URI: redis://-dragonfly.media.svc.cluster.local:6379
            envFrom:
              - secretRef:
                  name: -secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: 
        ports:
          http:
            port: 80
            targetPort: *targetPort
    persistence:
      config:
        existingClaim: 
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
