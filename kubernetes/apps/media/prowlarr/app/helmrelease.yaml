---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app prowlarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    controllers:
      prowlarr:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: servarr-secret,prowlarr-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: prowlarr-initdb-secret
        containers:
          app:
            image:
              repository: ghcr.io/realzombee/prowlarr
              tag: 2.10.1.2019@sha256:1eb73725349f75aabbed7ea5751b3139ca8045cdd8fc5162021ecb3facbc8280
            env:
              PUID: "1000"
              PGID: "1000"
              CACHE_TTL_MINS: 10
              CACHE_MAX_SIZE_MB: 100
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__APP__THEME: dark
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: DisabledForLocalAddresses
              PROWLARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: servarr-secret
                    key: API_KEY
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG__LEVEL: info
              PROWLARR__POSTGRES__HOST:
                valueFrom:
                  secretKeyRef:
                    name: &pguser prowlarr-pguser-secret
                    key: host
              PROWLARR__POSTGRES__MAINDB:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: db
              PROWLARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: password
              PROWLARR__POSTGRES__PORT:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: port
              PROWLARR__POSTGRES__USER:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: user
              PROWLARR__SERVER__ALLOWEDHOSTS: "prowlarr.480p.com,prowlarr.media.svc.cluster.local"
              PROWLARR__SERVER__PORT: &targetPort 9696
              PROWLARR__UPDATE__BRANCH: develop
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *targetPort
                    httpHeaders:
                      - name: Host
                        value: prowlarr.media.svc.cluster.local
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *targetPort
                    httpHeaders:
                      - name: Host
                        value: prowlarr.media.svc.cluster.local
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SETUID
                  - SETGID
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
          # Prowlarr serves no Prometheus endpoint (/metrics on 9696 is the SPA),
          # so the indexer numbers are re-exported from its own API by exportarr
          # in this pod. Reads `indexer`, `indexerstats` and `system/health`, and
          # keeps the cumulative sums in memory: with PROWLARR__BACKFILL the first
          # scrape after a restart re-seeds them from Prowlarr's history instead of
          # starting at zero. Talk to it over the Service name, not 127.0.0.1 —
          # PROWLARR__SERVER__ALLOWEDHOSTS above only accepts the cluster DNS names.
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - prowlarr
            env:
              PORT: "9707"
              URL: http://prowlarr.media.svc.cluster.local:80
              LOG_LEVEL: info
              PROWLARR__BACKFILL: "true"
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: servarr-secret
                    key: API_KEY
            probes:
              # tcpSocket on purpose: /metrics runs the whole API walk, so probing it
              # would poll Prowlarr four times a minute on top of the scrape.
              liveness: &exportarrProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9707
                  periodSeconds: 30
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *exportarrProbes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9707
                  failureThreshold: 10
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 80
            targetPort: *targetPort
          metrics:
            port: 9707
    persistence:
      config:
        existingClaim: prowlarr
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
