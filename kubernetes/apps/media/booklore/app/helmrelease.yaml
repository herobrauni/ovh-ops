---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: booklore
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  timeout: "15m"
  values:
    controllers:
      booklore:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          mariadb:
            image:
              repository: docker.io/library/mariadb
              tag: 13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
            args:
              - --collation-server=utf8mb4_general_ci
              - --character-set-server=utf8mb4
            env:
              MARIADB_DATABASE: booklore
              MARIADB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore-secret
                    key: booklore_mariadb_password
              MARIADB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore-secret
                    key: booklore_mariadb_root_password
              MARIADB_USER: booklore
              PGID: 1000
              PUID: 1000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - bash
                      - -c
                      - |-
                        mariadb-admin ping --socket=/run/mysqld/mysqld.sock --user=root --password=$${MARIADB_ROOT_PASSWORD}
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
          # Native sidecar (restartPolicy: Always), same shape as mariadb above.
          # Grimmory's own auto-add cannot separate the two accounts here: its
          # permission check short-circuits to true for permission_admin before
          # it looks at library membership, and the admin account is meant to
          # keep seeing every library. This loop assigns a book that lands in a
          # library to that library owner's `Kobo` shelf, once, so a Shelfmark
          # download reaches only the right device without anyone opening the
          # UI. Runs here rather than as its own workload because the DB listens
          # on localhost only: no Service, no extra network policy.
          kobo-autoshelf:
            image:
              repository: docker.io/library/mariadb
              tag: 13.0.2@sha256:54f493ea0d60b621a5bff84e5b20100f8b86b6efa6b79158e04756c5194a5e4d
            command:
              - /bin/sh
            args:
              - /scripts/kobo-autoshelf.sh
            env:
              AUTOSHELF_INTERVAL: "60"
              # library_id:user_id — the Kobo shelf itself is resolved by name
              # each pass. Both libraries stay visible to both users; only the
              # devices are separated.
              AUTOSHELF_MAP: "3:1,4:2"
              DATABASE_NAME: booklore
              DATABASE_USERNAME: booklore
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore-secret
                    key: booklore_mariadb_password
            restartPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
          wait-for-mariadb:
            image:
              repository: wait4x/wait4x
              tag: 3.7.3@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
            args:
              - mysql
              - booklore:$(DB_PASSWORD)@tcp(localhost:3306)/booklore
            env:
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore-secret
                    key: booklore_mariadb_password
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
        containers:
          booklore:
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: latest@sha256:bf6fe21c6e247597f7869664a440b5a34242e2d2940575cae39c17bfaa66dc0b
            command:
              - java
            args:
              - -jar
              - /app/app.jar
            env:
              ALLOWED_ORIGINS: https://booklore.brauni.dev
              FORCE_DISABLE_OIDC: false
              BOOKLORE_PORT: "6060"
              SWAGGER_ENABLED: true
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: booklore-secret
                    key: booklore_mariadb_password
              DATABASE_URL: jdbc:mariadb://localhost:3306/booklore
              DATABASE_USERNAME: booklore
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: &httpPort 6060
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: *httpPort
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    persistence:
      autoshelf-script:
        type: configMap
        name: booklore-autoshelf-script
        defaultMode: 0o555
        advancedMounts:
          booklore:
            kobo-autoshelf:
              - path: /scripts
                readOnly: true
      data:
        existingClaim: booklore
        advancedMounts:
          booklore:
            booklore:
              - path: /app/data
                subPath: app
              - path: /books
                subPath: books
              - path: /libraries
                subPath: libraries
            mariadb:
              - path: /var/lib/mysql
                subPath: mysql
      bookdrop:
        existingClaim: bookdrop
        advancedMounts:
          booklore:
            booklore:
              - path: /bookdrop
      mysqld:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Mi
        advancedMounts:
          booklore:
            mariadb:
              - path: /run/mysqld
      tmpfs:
        type: emptyDir
        advancedMounts:
          booklore:
            booklore:
              - path: /tmp
                subPath: app
            mariadb:
              - path: /tmp
                subPath: mysql
            kobo-autoshelf:
              - path: /tmp
                subPath: autoshelf
    route:
      booklore:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: BookLore
          gethomepage.dev/pod-selector: app.kubernetes.io/name=booklore
          gethomepage.dev/icon: mdi-book-open-variant
        hostnames:
          - booklore.brauni.dev
        parentRefs:
          - name: envoy-brauni-dev-public
            namespace: network
            sectionName: https
    service:
      booklore:
        ports:
          http:
            port: *httpPort
