---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: booklore-autoshelf-script
data:
  kobo-autoshelf.sh: |
    #!/bin/sh
    # NOTE: every dollar sign below is doubled on purpose. This ConfigMap is
    # rendered by Flux postBuild, which runs the whole manifest through envsubst
    # in strict mode: a single dollar before a brace fails the build with
    # "variable not set", exactly like the mariadb password in the HelmRelease
    # probe. Two dollars render as one.
    #
    # Each Kobo's shelf mirrors the library that belongs to its owner.
    #
    # Why this exists: Grimmory's own "Auto-Add New Books to Kobo Shelf" is the
    # only hands-off path into a device, but its permission check
    # (KoboAutoShelfService.hasBookLibraryAccess) returns true for any user with
    # permission_admin before it looks at library membership. The admin account
    # here keeps access to every library on purpose (both users browse the whole
    # catalogue in the UI), so native auto-add would push both libraries onto one
    # device, and restricting library access is not an option because admins
    # implicitly see all libraries anyway.
    #
    # So the invariant is kept here instead: the Kobo shelf of a library's owner
    # holds exactly that library's books. Each pass adds what is missing and
    # removes what no longer belongs, which also backfills shelves that were
    # curated by hand before. KoboLibrarySnapshotService.create() reads the shelf
    # straight from the DB on every device sync, so the result reaches the device
    # on the next sync without anyone opening the UI.
    #
    # Mirroring is deliberate, including what follows from it:
    # - Removing a book on the Kobo, or from the Kobo shelf in the UI, is undone
    #   on the next pass. To keep a book off a device, take it out of the library.
    # - A book added to a library is on that owner's device within
    #   AUTOSHELF_INTERVAL plus the next device sync.
    #
    # Only EPUB ever reaches a Kobo: KoboLibrarySnapshotService filters through
    # KoboCompatibilityService (EPUB, or CBX with conversion enabled) and
    # KoboEntitlementService filters on BookFileType.EPUB again, so a MOBI sitting
    # on the shelf is dropped before the device sees it. The eligibility
    # predicate is therefore "the primary file is an EPUB", primary meaning the
    # lowest-id file - the same rule BookEntity.getPrimaryBookFile() applies while
    # a library has no format priority set. Give a library a format priority and
    # this predicate has to follow it.
    set -u

    DB_HOST="$${DB_HOST:-127.0.0.1}"
    DB_PORT="$${DB_PORT:-3306}"
    DB_NAME="$${DATABASE_NAME:?DATABASE_NAME not set}"
    DB_USER="$${DATABASE_USERNAME:?DATABASE_USERNAME not set}"
    DB_PASS="$${DATABASE_PASSWORD:?DATABASE_PASSWORD not set}"
    INTERVAL="$${AUTOSHELF_INTERVAL:-60}"
    MAP="$${AUTOSHELF_MAP:?AUTOSHELF_MAP not set}"

    # MYSQL_PWD instead of -p: keeps the password out of the process list and
    # avoids the client's stderr warning. The client also emits a TLS note on
    # every connect (no TLS inside the pod), which is filtered so the log keeps
    # only real errors.
    sql() {
      _err="$$(mktemp)" || return 1
      MYSQL_PWD="$$DB_PASS" mariadb \
        --protocol=tcp -h "$$DB_HOST" -P "$$DB_PORT" -u "$$DB_USER" \
        --batch --skip-column-names --connect-timeout=10 \
        "$$DB_NAME" -e "$$1" 2>"$$_err"
      _rc=$$?
      grep -v 'ssl-verify-server-cert' "$$_err" >&2 || true
      rm -f "$$_err"
      return $$_rc
    }

    # Adds the library's missing books to the owner's shelf, then takes off it
    # whatever does not belong there, and reports both counts.
    mirror() {
      _lib="$$1" _user="$$2"
      _added="$$(sql "insert ignore into book_shelf_mapping (book_id, shelf_id)
             select b.id, s.id
             from book b
             join shelf s on s.user_id = $${_user} and s.name = 'Kobo'
             where b.library_id = $${_lib}
               and coalesce(b.deleted, 0) = 0
               and (select f.book_type from book_file f
                    where f.book_id = b.id order by f.id limit 1) = 'EPUB';
           select row_count();")" || { echo "[autoshelf] library $${_lib}: add failed"; return 1; }
      _removed="$$(sql "delete m from book_shelf_mapping m
             join shelf s on s.id = m.shelf_id
             join book b on b.id = m.book_id
             where s.user_id = $${_user} and s.name = 'Kobo'
               and (b.library_id <> $${_lib}
                    or coalesce(b.deleted, 0) <> 0
                    or coalesce((select f.book_type from book_file f
                                 where f.book_id = b.id order by f.id limit 1), '') <> 'EPUB');
           select row_count();")" || { echo "[autoshelf] library $${_lib}: prune failed"; return 1; }
      [ "$${_added:-0}" -gt 0 ] && echo "[autoshelf] library $${_lib} -> user $${_user}: +$${_added} book(s)"
      [ "$${_removed:-0}" -gt 0 ] && echo "[autoshelf] library $${_lib} -> user $${_user}: -$${_removed} book(s)"
      return 0
    }

    pass() {
      # A shelf that does not exist yet (Kobo sync off) resolves to no rows, so
      # nothing is added or removed; the library is picked up once it exists.
      for pair in $$(printf '%s' "$$MAP" | tr ',' ' '); do
        mirror "$${pair%%:*}" "$${pair#*:}" || true
      done
      return 0
    }

    if [ "$${AUTOSHELF_ONCE:-0}" = "1" ]; then
      pass
      exit 0
    fi

    until sql 'select 1' >/dev/null 2>&1; do
      echo "[autoshelf] waiting for the database at $${DB_HOST}:$${DB_PORT}"
      sleep 5
    done

    while :; do
      pass || echo "[autoshelf] pass failed, retrying in $${INTERVAL}s"
      sleep "$$INTERVAL"
    done
