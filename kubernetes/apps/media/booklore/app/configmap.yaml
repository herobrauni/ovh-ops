---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/configmap_v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: booklore-autoshelf-script
data:
  kobo-autoshelf.sh: |
    #!/bin/sh
    # NOTE: every dollar sign below is doubled on purpose. This ConfigMap is
    # rendered by Flux postBuild, which runs the whole manifest through envsubst
    # in strict mode: a single dollar before a brace fails the build with
    # "variable not set", exactly like the mariadb password in the HelmRelease
    # probe. Two dollars render as one.
    #
    # Each book is handed to its owner's Kobo shelf once, when it lands in that
    # owner's library. Nothing is taken off a shelf and nothing is re-added.
    #
    # Why this exists: Grimmory's own "Auto-Add New Books to Kobo Shelf" is the
    # only hands-off path into a device, but its permission check
    # (KoboAutoShelfService.hasBookLibraryAccess) returns true for any user with
    # permission_admin before it looks at library membership. The admin account
    # here keeps access to every library on purpose (both users browse the whole
    # catalogue in the UI), so native auto-add would push both libraries onto one
    # device, and restricting library access is not an option because admins
    # implicitly see all libraries anyway.
    #
    # So the per-library hand-over happens here instead: a book in a library is
    # assigned to that library owner's `Kobo` shelf exactly once.
    # KoboLibrarySnapshotService.create() reads the shelf straight from the DB on
    # every device sync, so the book reaches the device on the next sync without
    # anyone opening the UI.
    #
    # One-shot means one-shot: the hand-over is recorded in
    # kobo_autoshelf_applied, so removing the book - on the Kobo, or from the Kobo
    # shelf in the UI - sticks. Nothing prunes the shelf either; the separation
    # comes from only ever assigning a book to its own library's device. The one
    # case that re-populates is a recreated shelf: disabling and re-enabling Kobo
    # sync gives the shelf a new id, which would otherwise leave a device
    # permanently empty, so marks recorded against the old shelf id are dropped
    # and the library is handed over again.
    #
    # Eligibility is "the book's preferred file is an EPUB", because only EPUB
    # reaches a Kobo: KoboLibrarySnapshotService filters through
    # KoboCompatibilityService and KoboEntitlementService filters on
    # BookFileType.EPUB again, so a MOBI on the shelf is dropped before the device
    # sees it. The preferred file is the first format found in the library's
    # format priority list, then the lowest id - the same rule
    # BookEntity.getPrimaryBookFile() applies. A library with no priority set
    # falls back to the lowest id, which is why the expression below still works
    # there. This is why a converted book needs its EPUB to win the priority
    # list, not merely to exist next to the MOBI.
    set -u

    DB_HOST="$${DB_HOST:-127.0.0.1}"
    DB_PORT="$${DB_PORT:-3306}"
    DB_NAME="$${DATABASE_NAME:?DATABASE_NAME not set}"
    DB_USER="$${DATABASE_USERNAME:?DATABASE_USERNAME not set}"
    DB_PASS="$${DATABASE_PASSWORD:?DATABASE_PASSWORD not set}"
    INTERVAL="$${AUTOSHELF_INTERVAL:-60}"
    MAP="$${AUTOSHELF_MAP:?AUTOSHELF_MAP not set}"

    # The book's preferred file type. char(34) is the double quote of the JSON
    # array in library.format_priority; locate() gives the position, i.e. the
    # priority rank, and a format missing from the list sorts last.
    PRIMARY="(select f.book_type
                from book_file f
                join library l on l.id = b.library_id
               where f.book_id = b.id
               order by coalesce(nullif(locate(concat(char(34), f.book_type, char(34)),
                                                coalesce(l.format_priority, '[]')), 0), 100000),
                        f.id
               limit 1)"

    # MYSQL_PWD instead of -p: keeps the password out of the process list and
    # avoids the client's stderr warning. The client also emits a TLS note on
    # every connect (no TLS inside the pod), which is filtered so the log keeps
    # only real errors.
    sql() {
      _err="$$(mktemp)" || return 1
      MYSQL_PWD="$$DB_PASS" mariadb \
        --protocol=tcp -h "$$DB_HOST" -P "$$DB_PORT" -u "$$DB_USER" \
        --batch --skip-column-names --connect-timeout=10 \
        "$$DB_NAME" -e "$$1" 2>"$$_err"
      _rc=$$?
      grep -v 'ssl-verify-server-cert' "$$_err" >&2 || true
      rm -f "$$_err"
      return $$_rc
    }

    init() {
      sql "create table if not exists kobo_autoshelf_applied (
             book_id bigint not null,
             user_id bigint not null,
             shelf_id bigint not null,
             applied_at timestamp not null default current_timestamp,
             primary key (book_id, user_id)
           ) engine=innodb default charset=utf8mb4" >/dev/null
    }

    # Hands every not-yet-handed book of the library to its owner's Kobo shelf.
    # @shelf is null when the user has no Kobo shelf (Kobo sync off): nothing is
    # assigned and nothing is marked, so the library is handed over once the shelf
    # exists. Prints how many books this pass added.
    handover() {
      _lib="$$1" _user="$$2"
      sql "set @shelf := (select id from shelf where user_id = $${_user} and name = 'Kobo' limit 1);
           delete from kobo_autoshelf_applied
            where user_id = $${_user} and @shelf is not null and shelf_id <> @shelf;
           insert ignore into book_shelf_mapping (book_id, shelf_id)
           select b.id, @shelf
             from book b
            where @shelf is not null
              and b.library_id = $${_lib}
              and coalesce(b.deleted, 0) = 0
              and $${PRIMARY} = 'EPUB'
              and not exists (select 1 from kobo_autoshelf_applied a
                               where a.book_id = b.id and a.user_id = $${_user});
           set @added := row_count();
           insert ignore into kobo_autoshelf_applied (book_id, user_id, shelf_id)
           select b.id, $${_user}, @shelf
             from book b
            where @shelf is not null
              and b.library_id = $${_lib}
              and coalesce(b.deleted, 0) = 0
              and $${PRIMARY} = 'EPUB';
           select @added;" || { echo "[autoshelf] library $${_lib}: hand-over failed"; return 1; }
    }

    pass() {
      init
      for pair in $$(printf '%s' "$$MAP" | tr ',' ' '); do
        _lib="$${pair%%:*}"
        _user="$${pair#*:}"
        _n="$$(handover "$$_lib" "$$_user")" || continue
        [ "$${_n:-0}" -gt 0 ] && echo "[autoshelf] library $${_lib} -> user $${_user}: +$${_n} book(s)"
      done
      return 0
    }

    if [ "$${AUTOSHELF_ONCE:-0}" = "1" ]; then
      pass
      exit 0
    fi

    until sql 'select 1' >/dev/null 2>&1; do
      echo "[autoshelf] waiting for the database at $${DB_HOST}:$${DB_PORT}"
      sleep 5
    done

    while :; do
      pass || echo "[autoshelf] pass failed, retrying in $${INTERVAL}s"
      sleep "$$INTERVAL"
    done
