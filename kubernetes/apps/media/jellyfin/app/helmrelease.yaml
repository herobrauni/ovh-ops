---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: jellyfin-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: jellyfin-initdb-secret
        containers:
          app:
            image:
              repository: ghcr.io/jpvenson/jellyfin.pgsql
              # 12.1-2 = upstream 12.1 base + PG plugin, built 2026-09-29 from
              # main@a5957c7 (includes the 12.1 PG migration fixes, PRs #48/#49).
              # One-way DB migration: rollback = pg_dump + pinned kopiur snapshot,
              # see docs/jellyfin-v12-upgrade.md
              tag: 12.1-2@sha256:b1cafefc4732895b9bece7da1787690aa462ee2e46e968b99c735754d95c785d
            env:
              JELLYFIN_PublishedServerUrl: https://jellyfin.480p.com
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: &pguser jellyfin-pguser-secret
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: port
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: db
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: user
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: password
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  # TEMP(v12 upgrade): migration passes (path-based cleanup over
                  # the backend mount) need way more than 5min; 600x10s = 100min
                  # headroom. Revert to 30 once the post-upgrade scans are done
                  # (docs/jellyfin-v12-upgrade.md).
                  failureThreshold: 600
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          rclone-infinidysk:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.75@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-jellyfin-infinidysk 2>/dev/null || true
                mkdir -p /host-mount/rclone-jellyfin-infinidysk
                export RCLONE_CONFIG_INFINIDYSK_PASS="$(rclone obscure "$RCLONE_CONFIG_INFINIDYSK_PASS_RAW")"
                unset RCLONE_CONFIG_INFINIDYSK_PASS_RAW
                exec rclone mount infinidysk:/ /host-mount/rclone-jellyfin-infinidysk \
                  --links \
                  --read-only \
                  --poll-interval=0 \
                  --dir-cache-time=20s \
                  --allow-non-empty \
                  --vfs-cache-mode=full \
                  --vfs-cache-max-age=24h \
                  --vfs-cache-max-size=5G \
                  --vfs-cache-poll-interval=30s \
                  --buffer-size=0M \
                  --vfs-read-ahead=512M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --uid=1000 \
                  --gid=1000 \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_INFINIDYSK_TYPE: webdav
              # Backend (WebDAV) port, never the :3000 frontend proxy.
              RCLONE_CONFIG_INFINIDYSK_URL: http://infinidysk.media.svc.cluster.local:8080/
              RCLONE_CONFIG_INFINIDYSK_VENDOR: other
              RCLONE_CONFIG_INFINIDYSK_USER:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__USER
              # Raw value; rclone's obfuscation is not deterministic, so the
              # sidecar obscures it at start instead of storing a second copy.
              RCLONE_CONFIG_INFINIDYSK_PASS_RAW:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__PASS
              RCLONE_CONFIG_INFINIDYSK_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-infinidysk-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-jellyfin-infinidysk && ls /host-mount/rclone-jellyfin-infinidysk >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *rclone-infinidysk-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-jellyfin-infinidysk && ls /host-mount/rclone-jellyfin-infinidysk >/dev/null
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/pod-selector: app.kubernetes.io/name=jellyfin
          gethomepage.dev/icon: jellyfin.png
        hostnames:
          - jellyfin.480p.com
          - jelly.480p.com
        parentRefs:
          - name: envoy-480p-com-public
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: jellyfin
                port: *port
    persistence:
      config:
        existingClaim: jellyfin
      cache:
        existingClaim: jellyfin-cache
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
      logs:
        type: emptyDir
      transcode:
        type: emptyDir
        # Bound the transcoder scratch space; it shares the node filesystem
        # with the rclone VFS caches, so an unbounded runaway could evict pods.
        sizeLimit: 10Gi
      tmp:
        type: emptyDir
      symlinks:
        existingClaim: symlinks
        globalMounts:
          - path: /aio/symlinks
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          jellyfin:
            rclone-infinidysk:
              - path: /dev/fuse
      rclone-cache-infinidysk:
        type: emptyDir
        # Hard backstop for the rclone cap (5G).
        sizeLimit: 6Gi
        advancedMounts:
          jellyfin:
            rclone-infinidysk:
              - path: /cache
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          jellyfin:
            rclone-infinidysk:
              - path: /host-mount
                mountPropagation: Bidirectional
      infinidysk:
        type: hostPath
        hostPath: /tmp/rclone-jellyfin-infinidysk
        hostPathType: DirectoryOrCreate
        advancedMounts:
          jellyfin:
            app:
              - path: /aio/remote/infinidysk
                mountPropagation: HostToContainer
