---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
spec:
  chartRef:
    kind: OCIRepository
    name: jellyfin
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
    controllers:
      jellyfin:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: jellyfin-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: jellyfin-initdb-secret
        containers:
          app:
            image:
              repository: ghcr.io/jpvenson/jellyfin.pgsql
              # 12.1-2 = upstream 12.1 base + PG plugin, built 2026-09-29 from
              # main@a5957c7 (includes the 12.1 PG migration fixes, PRs #48/#49).
              # One-way DB migration: rollback = pg_dump + pinned kopiur snapshot,
              # see docs/jellyfin-v12-upgrade.md
              tag: 12.1-2@sha256:b1cafefc4732895b9bece7da1787690aa462ee2e46e968b99c735754d95c785d
            env:
              JELLYFIN_PublishedServerUrl: https://jellyfin.480p.com
              POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: &pguser jellyfin-pguser-secret
                    key: host
              POSTGRES_PORT:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: port
              POSTGRES_DB:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: db
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: user
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: *pguser
                    key: password
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 6
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  # TEMP(v12 upgrade): 30x10s = 5min was too tight for the one-way
                  # EF Core migration + first-boot path cleanup; bump to 30min
                  # headroom. Revert to 30 once the post-upgrade scans are done
                  # (docs/jellyfin-v12-upgrade.md).
                  failureThreshold: 180
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # PARKED 2026-09-30: jellyfin's libraries moved to zurg only
          # (/aio/remote/zurg/__magic__/tv and /movies), so the altmount
          # sidecar is commented out rather than deleted while the zurg
          # evaluation runs. To re-enable: uncomment this container and the
          # rclone-altmount entries under `fuse`, `rclone-cache-altmount`,
          # `host-tmp` and `altmount` in persistence below. If the node keeps
          # a stale FUSE mount at /tmp/rclone-jellyfin-altmount after the
          # switch, `umount -l` it there — the start command cleans it up on
          # re-enable either way.
          # rclone-altmount:
          #   image:
          #     repository: docker.io/rclone/rclone
          #     tag: 1.75@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
          #   command:
          #     - /bin/sh
          #     - -c
          #     - |
          #       umount -l /host-mount/rclone-jellyfin-altmount 2>/dev/null || true
          #       mkdir -p /host-mount/rclone-jellyfin-altmount
          #       exec rclone mount altmount:/ /host-mount/rclone-jellyfin-altmount \
          #         --dir-cache-time=20s \
          #         --vfs-cache-mode=full \
          #         --vfs-cache-max-age=24h \
          #         --vfs-cache-max-size=20G \
          #         --vfs-cache-poll-interval=30s \
          #         --buffer-size=0M \
          #         --vfs-read-ahead=512M \
          #         --vfs-fast-fingerprint \
          #         --links \
          #         --use-cookies \
          #         --no-modtime \
          #         --no-checksum \
          #         --allow-other \
          #         --cache-dir=/cache
          #   env:
          #     RCLONE_CONFIG_ALTMOUNT_TYPE: webdav
          #     RCLONE_CONFIG_ALTMOUNT_URL: http://altmount.media.svc.cluster.local:8080/webdav/
          #     RCLONE_CONFIG_ALTMOUNT_VENDOR: other
          #   envFrom:
          #     - secretRef:
          #         name: rclone-altmount-secret
          #   probes:
          #     liveness: &rclone-altmount-probes
          #       enabled: true
          #       custom: true
          #       spec:
          #         exec:
          #           command:
          #             - /bin/sh
          #             - -c
          #             - test -d /host-mount/rclone-jellyfin-altmount/complete
          #       initialDelaySeconds: 10
          #       periodSeconds: 30
          #       timeoutSeconds: 5
          #       failureThreshold: 6
          #     readiness: *rclone-altmount-probes
          #     startup:
          #       enabled: true
          #       custom: true
          #       spec:
          #         exec:
          #           command:
          #             - /bin/sh
          #             - -c
          #             - test -d /host-mount/rclone-jellyfin-altmount/complete
          #       failureThreshold: 30
          #       periodSeconds: 5
          #   securityContext:
          #     runAsUser: 0
          #     runAsGroup: 0
          #     runAsNonRoot: false
          #     privileged: true
          #     readOnlyRootFilesystem: true
          #     capabilities:
          #       drop:
          #         - ALL
          # zurg (the new Usenet backend) mounted at zurg's own mount_path.
          # Media libraries get added at /aio/remote/zurg/__magic__/tv and
          # /movies ONLY — never __magic__ itself: __magic__/__all__ mirrors
          # the whole library, so scanning it too finds everything twice.
          # Read-only: the media server only reads; __magic__ placements are
          # the *arrs' job through their own writable sidecars.
          rclone-zurg:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.75@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-jellyfin-zurg 2>/dev/null || true
                mkdir -p /host-mount/rclone-jellyfin-zurg
                exec rclone mount zurg:/ /host-mount/rclone-jellyfin-zurg \
                  --read-only \
                  --dir-cache-time=20s \
                  --vfs-cache-mode=full \
                  --vfs-cache-max-age=24h \
                  --vfs-cache-max-size=20G \
                  --vfs-cache-poll-interval=30s \
                  --buffer-size=0M \
                  --vfs-read-ahead=512M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_ZURG_TYPE: webdav
              RCLONE_CONFIG_ZURG_URL: http://zurg.media.svc.cluster.local:9999/dav/
              RCLONE_CONFIG_ZURG_VENDOR: other
              # A remote without a config file does not get pacer_min_sleep;
              # without it one unservable file slows every other read down.
              RCLONE_CONFIG_ZURG_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-zurg-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-jellyfin-zurg/version.txt
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *rclone-zurg-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - test -e /host-mount/rclone-jellyfin-zurg/version.txt
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: jellyfin
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Jellyfin
          gethomepage.dev/pod-selector: app.kubernetes.io/name=jellyfin
          gethomepage.dev/icon: jellyfin.png
        hostnames:
          - jellyfin.480p.com
          - jelly.480p.com
        parentRefs:
          - name: envoy-480p-com-public
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: jellyfin
                port: *port
    persistence:
      config:
        existingClaim: jellyfin
      cache:
        existingClaim: jellyfin-cache
        advancedMounts:
          jellyfin:
            app:
              - path: /cache
      logs:
        type: emptyDir
      transcode:
        type: emptyDir
      tmp:
        type: emptyDir
      symlinks:
        existingClaim: symlinks
        globalMounts:
          - path: /aio/symlinks
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          jellyfin:
            # rclone-altmount:
            #   - path: /dev/fuse
            rclone-zurg:
              - path: /dev/fuse
      # rclone-cache-altmount:
      #   type: emptyDir
      #   advancedMounts:
      #     jellyfin:
      #       rclone-altmount:
      #         - path: /cache
      rclone-cache-zurg:
        type: emptyDir
        advancedMounts:
          jellyfin:
            rclone-zurg:
              - path: /cache
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          jellyfin:
            # rclone-altmount:
            #   - path: /host-mount
            #     mountPropagation: Bidirectional
            rclone-zurg:
              - path: /host-mount
                mountPropagation: Bidirectional
      # altmount:
      #   type: hostPath
      #   hostPath: /tmp/rclone-jellyfin-altmount
      #   hostPathType: DirectoryOrCreate
      #   advancedMounts:
      #     jellyfin:
      #       app:
      #         - path: /aio/remote/altmount
      #           mountPropagation: HostToContainer
      zurg:
        type: hostPath
        hostPath: /tmp/rclone-jellyfin-zurg
        hostPathType: DirectoryOrCreate
        advancedMounts:
          jellyfin:
            app:
              - path: /aio/remote/zurg
                mountPropagation: HostToContainer

