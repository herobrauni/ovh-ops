---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          # The image ships a headless browser whose scratch directories normally come from
          # its entrypoint. This deployment overrides the entrypoint (command: gunicorn) to
          # keep the root filesystem read-only, so nothing creates them and the browser
          # cannot start on the dangling symlinks baked into /app. Pre-create them on the
          # /tmp emptyDir as the runtime uid so the app owns them.
          browser-scratch:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
            command:
              - /bin/sh
              - -c
              - mkdir -p /tmp/shelfmark/seleniumbase/downloaded_files /tmp/shelfmark/seleniumbase/archived_files
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          shelfmark:
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.7.0@sha256:6544e02595271b0267b9acda58fa7f3db6f14942bece51b7aadfe4000cf34f1c
            command:
              - gunicorn
            args:
              - --access-logfile=-
              - --error-logfile=-
              - --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
              - --workers=1
              - -t
              - "300"
              - -b
              - 0.0.0.0:8084
              - shelfmark.main:app
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &httpPort 8084
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # Read-only WebDAV view of InfiniDysk, same sidecar pattern as the
          # *arrs: the mount lives on a hostPath with Bidirectional propagation
          # (a backend restart remounts instead of leaving a dead FUSE link) and
          # the app container sees it via HostToContainer. The app has to see the
          # backend's own paths, because the SABnzbd history entry it polls reports
          # `storage` as /aio/remote/infinidysk/completed-symlinks/<cat>/<release>.
          # VFS cache is off: a completed release file is read once.
          rclone-infinidysk:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.76@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-infinidysk-shelfmark 2>/dev/null || true
                mkdir -p /host-mount/rclone-infinidysk-shelfmark
                export RCLONE_CONFIG_INFINIDYSK_PASS="$(rclone obscure "$RCLONE_CONFIG_INFINIDYSK_PASS_RAW")"
                unset RCLONE_CONFIG_INFINIDYSK_PASS_RAW
                exec rclone mount infinidysk:/ /host-mount/rclone-infinidysk-shelfmark \
                  --links \
                  --read-only \
                  --poll-interval=0 \
                  --dir-cache-time=20s \
                  --allow-non-empty \
                  --vfs-cache-mode=off \
                  --buffer-size=0M \
                  --vfs-fast-fingerprint \
                  --vfs-handle-caching=0 \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --uid=1000 \
                  --gid=1000 \
                  --cache-dir=/cache
            env:
              RCLONE_CONFIG_INFINIDYSK_TYPE: webdav
              # Backend (WebDAV) port, never the :3000 frontend proxy.
              RCLONE_CONFIG_INFINIDYSK_URL: http://infinidysk.media.svc.cluster.local:8080/
              RCLONE_CONFIG_INFINIDYSK_VENDOR: other
              RCLONE_CONFIG_INFINIDYSK_USER:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__USER
              # Raw value; rclone's obfuscation is not deterministic, so the
              # sidecar obscures it at start instead of storing a second copy.
              RCLONE_CONFIG_INFINIDYSK_PASS_RAW:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__PASS
              RCLONE_CONFIG_INFINIDYSK_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-infinidysk-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-infinidysk-shelfmark && ls /host-mount/rclone-infinidysk-shelfmark >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *rclone-infinidysk-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-infinidysk-shelfmark && ls /host-mount/rclone-infinidysk-shelfmark >/dev/null
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              privileged: true
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        existingClaim: shelfmark
      bookdrop:
        existingClaim: bookdrop
        advancedMounts:
          shelfmark:
            shelfmark:
              - path: /bookdrop
      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: var-log
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          shelfmark:
            rclone-infinidysk:
              - path: /dev/fuse
      # Cache is off; rclone still wants a writable --cache-dir because the
      # root filesystem is read-only.
      rclone-cache:
        type: emptyDir
        sizeLimit: 512Mi
        advancedMounts:
          shelfmark:
            rclone-infinidysk:
              - path: /cache
      # The sidecar mounts into the node's /tmp so the FUSE mount survives a
      # sidecar restart, and the app container picks it up HostToContainer.
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          shelfmark:
            rclone-infinidysk:
              - path: /host-mount
                mountPropagation: Bidirectional
      infinidysk:
        type: hostPath
        hostPath: /tmp/rclone-infinidysk-shelfmark
        hostPathType: DirectoryOrCreate
        advancedMounts:
          shelfmark:
            shelfmark:
              - path: /aio/remote/infinidysk
                mountPropagation: HostToContainer
    route:
      shelfmark:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: Shelfmark
          gethomepage.dev/pod-selector: app.kubernetes.io/name=shelfmark
          gethomepage.dev/icon: mdi-bookshelf
        hostnames:
          - shelfmark.brauni.dev
        parentRefs:
          - name: envoy-brauni-dev-public
            namespace: network
            sectionName: https
    service:
      shelfmark:
        ports:
          http:
            port: *httpPort
