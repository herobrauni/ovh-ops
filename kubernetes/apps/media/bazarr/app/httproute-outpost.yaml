---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
# The OIDC callback is served on the app hostname and must NOT be ext-auth'd, so
# it gets its own HTTPRoute (reusing the main one would loop).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr-480p-com-outpost
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - bazarr.480p.com
  parentRefs:
    - name: envoy-480p-com-public
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: authentik-server
          namespace: authentik
          port: 80
