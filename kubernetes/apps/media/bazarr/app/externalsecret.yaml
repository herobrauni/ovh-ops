---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bazarr-secret
    creationPolicy: Owner
    template:
      data:
        # Bazarr's own API key (used by integrations). Create /bazarr/API_KEY
        # in Infisical (any random value works; Bazarr adopts it via the
        # config mount below).
        BAZARR_API_KEY: "{{ .API_KEY }}"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /bazarr/API_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-config
spec:
  # Short refresh so the seeded config converges quickly on first boot.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bazarr-config-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Auth is handled by Authentik at the gateway (SecurityPolicy on the
        # HTTPRoute), same as the *arrs — so Bazarr itself runs with auth
        # disabled. The apikey stays enabled for API/integration use.
        # See notes in helmrelease.yaml: this Secret is mounted as
        # config.yaml in the config dir and read on every start.
        config.yaml: |
          auth:
            apikey: {{ .API_KEY }}
            type: null
            username: ''
            password: ''
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /bazarr/API_KEY
