---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bazarr-secret
    creationPolicy: Owner
    template:
      data:
        # Bazarr's own API key (used by integrations). Create /bazarr/API_KEY
        # in Infisical (any random value works; Bazarr adopts it via the
        # config mount below).
        BAZARR_API_KEY: "{{ .API_KEY }}"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /bazarr/API_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr-config
spec:
  # Short refresh so the seeded config converges quickly on first boot.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bazarr-config-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Seeded on first boot by the config-init container and only when
        # the file is missing/empty — after that Bazarr owns it.
        #
        # Declarative now (parity with bazarr4k): auth is handled by
        # Authentik at the gateway, and both HD *arrs are wired in with the
        # shared /servarr/API_KEY the *arrs already use.
        config.yaml: |
          auth:
            apikey: {{ .API_KEY }}
            type: null
            username: ''
            password: ''
          general:
            use_sonarr: true
            use_radarr: true
            serie_default_enabled: true
            movie_default_enabled: true
            use_embedded_subs: true
            utf8_encode: true
            serie_default_profile: English
            movie_default_profile: English
          sonarr:
            ip: sonarr.media.svc.cluster.local
            port: 80
            base_url: /
            ssl: false
            apikey: {{ .SERVARR_API_KEY }}
            only_monitored: true
            series_sync: 60
            full_update: Daily
          radarr:
            ip: radarr.media.svc.cluster.local
            port: 80
            base_url: /
            ssl: false
            apikey: {{ .SERVARR_API_KEY }}
            only_monitored: true
            movies_sync: 60
            full_update: Daily
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /bazarr/API_KEY
    - secretKey: SERVARR_API_KEY
      remoteRef:
        key: /servarr/API_KEY
