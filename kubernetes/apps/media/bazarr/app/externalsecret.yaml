---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bazarr-secret
    creationPolicy: Owner
    template:
      data:
        # Bazarr's own API key. Create /bazarr/API_KEY in Infisical (any
        # random value works on first boot; Bazarr seeds it into its config).
        BAZARR_API_KEY: "{{ .API_KEY }}"
  data:
    - secretKey: API_KEY
      remoteRef:
        key: /bazarr/API_KEY
