---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media

components:
  - ../../components/alerts
  - ../../components/app-template
  - ../../components/gateway-route-access

resources:
  - ./namespace.yaml
  - ./common/servarr-secret.yaml
  - ./booklore/ks.yaml
  - ./bazarr/ks.yaml
  - ./bazarr4k/ks.yaml
  # 1.x backend: DISABLED after the 2026-11-20 cutover (docs/infinidysk-v2-cutover.md).
  # Commenting the Kustomization out makes Flux garbage-collect everything it
  # owned (HelmRelease, Service, CNP, ServiceMonitor, HTTPRoute, DNSEndpoint and
  # the kopiur-backed PVC). The data needed for a rollback outlives it:
  #   * VolumeSnapshot media/infinidysk-v1-final (its config volume: blobs + db.sqlite)
  #   * PostgreSQL database `infinidysk` on postgres18 (never Flux-managed)
  #   * the kopiur repository's own snapshots of that volume
  # Rollback: uncomment below, restore the PVC from that snapshot, scale to 1, and
  # re-split the provider connections (v2 holds the full plan now).
  # - ./infinidysk/ks.yaml
  # 2.x backend: the serving instance. Runbook: docs/infinidysk-v2-cutover.md.
  - ./infinidysk-v2/ks.yaml
  # Polls InfiniDysk's SAB history for category `other` and symlinks manual
  # NZBs into /aio/symlinks/other (the manual-NZB import step an *arr does for
  # its own categories).
  - ./infinidysk-sync-helper/ks.yaml
  - ./clonarr/ks.yaml
  - ./jellyfin/ks.yaml
  - ./swiparr/ks.yaml
  # Jellyfin upgrade rehearsal copy (own config volume + database
  # `jellyfin_staging`). TORN DOWN 2026-11-24 after prod moved to 12.4 — the
  # manifests stay for the next rehearsal, see docs/agents/media.md
  # §jellyfin-staging for the data copy and the recreation steps. The database
  # and role are NOT Flux-owned: recreate them before re-enabling this line.
  # - ./jellyfin-staging/ks.yaml
  - ./silo/ks.yaml
  - ./media-debug/ks.yaml
  - ./prowlarr/ks.yaml
  - ./seerr/ks.yaml
  - ./shelfmark/ks.yaml
  - ./streamystats/ks.yaml

  - ./plex/ks.yaml
  - ./radarr/ks.yaml
  - ./radarr4k/ks.yaml
  - ./sonarr/ks.yaml
  - ./sonarr4k/ks.yaml

  - ./symlinks/ks.yaml
  - ./umlautadaptarrex/ks.yaml
  - ./warrden/ks.yaml
