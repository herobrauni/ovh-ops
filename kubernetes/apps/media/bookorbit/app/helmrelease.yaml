---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  timeout: "15m"
  values:
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: bookorbit-secret,bookorbit-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: bookorbit-initdb-secret
            # initContainers get no securityContext from app-template; without
            # this every rollout logs a restricted-PodSecurity warning even
            # though the pod runs.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          # Read-only WebDAV view of InfiniDysk, where the SABnzbd/InfiniDysk
          # download client leaves completed ebook releases
          # (`completed-symlinks/<category>/<release>`). Same pattern as the
          # *arr pods: rclone with `--links` turns the `.rclonelink` pointers into
          # real symlinks into `.ids`, which is why the importer can read them.
          # Nothing is written here — BookOrbit copies a finished file into its
          # own block claim and deletes the client-side job through the SAB API.
          rclone-infinidysk:
            image:
              repository: docker.io/rclone/rclone
              tag: 1.76@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
            command:
              - /bin/sh
              - -c
              - |
                umount -l /host-mount/rclone-bookorbit-infinidysk 2>/dev/null || true
                mkdir -p /host-mount/rclone-bookorbit-infinidysk
                export RCLONE_CONFIG_INFINIDYSK_PASS="$(rclone obscure "$RCLONE_CONFIG_INFINIDYSK_PASS_RAW")"
                unset RCLONE_CONFIG_INFINIDYSK_PASS_RAW
                exec rclone mount infinidysk:/ /host-mount/rclone-bookorbit-infinidysk \
                  --links \
                  --read-only \
                  --poll-interval=0 \
                  --dir-cache-time=20s \
                  --allow-non-empty \
                  --vfs-cache-mode=off \
                  --buffer-size=0M \
                  --vfs-read-ahead=32M \
                  --use-cookies \
                  --no-modtime \
                  --no-checksum \
                  --allow-other \
                  --uid=1000 \
                  --gid=1000
            env:
              RCLONE_CONFIG_INFINIDYSK_TYPE: webdav
              # Backend (WebDAV) port, never the :3000 frontend proxy.
              RCLONE_CONFIG_INFINIDYSK_URL: http://infinidysk.media.svc.cluster.local:8080/
              RCLONE_CONFIG_INFINIDYSK_VENDOR: other
              RCLONE_CONFIG_INFINIDYSK_USER:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__USER
              RCLONE_CONFIG_INFINIDYSK_PASS_RAW:
                valueFrom:
                  secretKeyRef:
                    name: infinidysk-secret
                    key: NZBDAV_CONFIG__WEBDAV__PASS
              RCLONE_CONFIG_INFINIDYSK_PACER_MIN_SLEEP: "0"
            probes:
              liveness: &rclone-infinidysk-probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-bookorbit-infinidysk && ls /host-mount/rclone-bookorbit-infinidysk >/dev/null
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *rclone-infinidysk-probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /bin/sh
                      - -c
                      - mountpoint -q /host-mount/rclone-bookorbit-infinidysk && ls /host-mount/rclone-bookorbit-infinidysk >/dev/null
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            # FUSE mount: needs /dev/fuse and the privileges rclone asks for.
            # No cache dir, because the mount is read-only and every epub is a
            # few megabytes (allowlisted in util/check_security_invariants.sh).
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SYS_ADMIN
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.9.0@sha256:79cd9c66c990a82944514e3e82d5be5987f21eda96cb37a378ed1484043716fc
            env:
              PORT: &port 3000
              # Behind Envoy: without this the app sees scheme http and builds
              # http:// redirect and OPDS/OIDC callback URLs.
              TRUST_PROXY: "true"
              APP_URL: https://bookorbit.brauni.dev
              CLIENT_URL: https://bookorbit.brauni.dev
              # Keep the library folder picker inside the mounted claim instead
              # of exposing the whole container filesystem.
              LIBRARY_BROWSE_ROOT: /data
              BOOK_DOCK_PATH: /data/book-dock
              # The entrypoint repairs /data ownership and then su-execs to
              # 1000:1000; these must match the pod-level fsGroup.
              PUID: "1000"
              PGID: "1000"
              # Shared postgres18 cluster, created by the cnpg component.
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-pguser-secret
                    key: uri_no_ssl
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: JWT_SECRET
              SETUP_BOOTSTRAP_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: SETUP_BOOTSTRAP_TOKEN
              # At-rest keys for credentials stored encrypted in the app DB
              # (AI provider keys, request credentials, SMTP). Must be 64-hex;
              # see the ExternalSecret for the rotation consequence.
              AI_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: AI_ENCRYPTION_KEY
              BOOK_REQUEST_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: BOOK_REQUEST_ENCRYPTION_KEY
              EMAIL_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: EMAIL_ENCRYPTION_KEY
            probes:
              # First boot runs the whole migration set as user 1000 after the
              # entrypoint's ownership repair; the startup probe absorbs that.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/v1/health
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # NODE_MAX_OLD_SPACE_SIZE defaults to `auto` = 75% of this cap.
                # Library scans (hashing + metadata) are the memory peak.
                memory: 2Gi
            # The image has no USER: the entrypoint chowns /data, repairs
            # ownership and su-execs to PUID/PGID. Dropping the root part would
            # break the repair path, so root plus the narrowest working cap set
            # is the trade-off (same shape as infinidysk / radarr here):
            #   CHOWN/DAC_OVERRIDE/FOWNER - chown -R, mkdir and the writability
            #                              probes on /data and /data/book-bucket.
            #   SETUID/SETGID             - su-exec to 1000:1000 before node
            #                              starts.
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              # Upstream ships the container with a read-only rootfs and a tmpfs
              # on /tmp, so everything writable lives on the claim.
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: bookorbit
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://bookorbit.brauni.dev/api/v1/health
            conditions: ["[STATUS] == 200"]
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: BookOrbit
          gethomepage.dev/pod-selector: app.kubernetes.io/name=bookorbit
          gethomepage.dev/icon: mdi-bookshelf
        hostnames:
          - bookorbit.brauni.dev
        parentRefs:
          - name: envoy-brauni-dev-public
            namespace: network
            sectionName: https
    persistence:
      # kopiur-managed claim (`bookorbit`, ceph-block). BookOrbit documents
      # network/distributed storage as unsupported, which rules out ceph-filesystem
      # and any rclone mount: libraries, uploads, the drop folder and app data
      # all live here. /books is not a separate mount; new libraries are created
      # under /data/books from the UI (LIBRARY_BROWSE_ROOT above).
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      # Uploads and metadata work files; bounded so a runaway import cannot
      # fill the node's ephemeral disk.
      tmp:
        type: emptyDir
        sizeLimit: 10Gi
        globalMounts:
          - path: /tmp
      # InfiniDysk source tree for the rclone sidecar (mount propagation, like
      # every other consumer) and the read-only view the app picks up.
      host-tmp:
        type: hostPath
        hostPath: /tmp
        hostPathType: Directory
        advancedMounts:
          bookorbit:
            rclone-infinidysk:
              - path: /host-mount
                mountPropagation: Bidirectional
      infinidysk:
        type: hostPath
        hostPath: /tmp/rclone-bookorbit-infinidysk
        hostPathType: DirectoryOrCreate
        advancedMounts:
          bookorbit:
            app:
              - path: /infinidysk
                mountPropagation: HostToContainer
                readOnly: true
      fuse:
        type: hostPath
        hostPath: /dev/fuse
        hostPathType: CharDevice
        advancedMounts:
          bookorbit:
            rclone-infinidysk:
              - path: /dev/fuse
      initdb:
        type: configMap
        name: bookorbit-initdb
        advancedMounts:
          bookorbit:
            01-init-db:
              - path: /initdb
