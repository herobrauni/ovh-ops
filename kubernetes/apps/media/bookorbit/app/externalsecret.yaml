---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bookorbit-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Signs the UI/API tokens. Rotating it invalidates every session.
        JWT_SECRET: "{{ .jwt_secret }}"
        # One-time token for the first-run admin wizard. It stays in the env
        # afterwards, so the wizard cannot be re-run by an anonymous visitor.
        SETUP_BOOTSTRAP_TOKEN: "{{ .setup_bootstrap_token }}"
        # AES-GCM keys for credentials BookOrbit stores encrypted in its own DB:
        # AI provider keys/header values, book-request indexer + download-client
        # credentials, and SMTP passwords. Without the matching key the app
        # refuses to save the value (AI_ENCRYPTION_KEY_MISSING) rather than
        # store it in the clear. Rotating one makes already-stored values
        # unreadable - they have to be re-entered, nothing crashes.
        AI_ENCRYPTION_KEY: "{{ .ai_encryption_key }}"
        BOOK_REQUEST_ENCRYPTION_KEY: "{{ .book_request_encryption_key }}"
        EMAIL_ENCRYPTION_KEY: "{{ .email_encryption_key }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: /bookorbit/JWT_SECRET
    - secretKey: setup_bootstrap_token
      remoteRef:
        key: /bookorbit/SETUP_BOOTSTRAP_TOKEN
    - secretKey: ai_encryption_key
      remoteRef:
        key: /bookorbit/AI_ENCRYPTION_KEY
    - secretKey: book_request_encryption_key
      remoteRef:
        key: /bookorbit/BOOK_REQUEST_ENCRYPTION_KEY
    - secretKey: email_encryption_key
      remoteRef:
        key: /bookorbit/EMAIL_ENCRYPTION_KEY
