---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: bookorbit-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Signs the UI/API tokens. Rotating it invalidates every session.
        JWT_SECRET: "{{ .jwt_secret }}"
        # One-time token for the first-run admin wizard. It stays in the env
        # afterwards, so the wizard cannot be re-run by an anonymous visitor.
        SETUP_BOOTSTRAP_TOKEN: "{{ .setup_bootstrap_token }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: /bookorbit/JWT_SECRET
    - secretKey: setup_bootstrap_token
      remoteRef:
        key: /bookorbit/SETUP_BOOTSTRAP_TOKEN
