---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
# Ingress-only allowlist. BookOrbit has its own accounts (like booklore/silo),
# so the public Envoy gateway is the only client: UI, native-app API, OPDS and
# the Kobo/KOReader sync endpoints all ride port 3000. The PostgreSQL connection
# is egress to the shared cluster, which these rules do not touch.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bookorbit
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
      app.kubernetes.io/instance: bookorbit
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-brauni-dev-public
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
