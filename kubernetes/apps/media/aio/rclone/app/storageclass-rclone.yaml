---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rclone--webdav
provisioner: rclone.csi.veloxpack.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: false
parameters:
  remote: 
  remotePath: "/"
  configData: |
    []
    type = webdav
    url = http://.media.svc.cluster.local:8282/webdav/realdebrid
    vendor = other
