---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clonarr-480p-com
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Clonarr
    gethomepage.dev/pod-selector: app.kubernetes.io/name=clonarr
    gethomepage.dev/icon: mdi-sync
    gatus.home-operations.com/endpoint: |-
      url: https://clonarr.480p.com/api/health
spec:
  hostnames:
    - clonarr.480p.com
  parentRefs:
    - name: envoy-480p-com-public
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: clonarr
          port: 6060
