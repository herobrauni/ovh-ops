---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr-480p-com
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Media
    gethomepage.dev/name: Radarr
    gethomepage.dev/pod-selector: app.kubernetes.io/name=radarr
    gethomepage.dev/icon: radarr.png
    gatus.home-operations.com/endpoint: |-
      url: https://radarr.480p.com/ping
spec:
  hostnames:
    - radarr.480p.com
  parentRefs:
    - name: envoy-480p-com-public
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: radarr
          port: 80
