---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app silo
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/cnpg
    - ../../../../components/dragonfly
    - ../../../../components/kopiur
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: dbms
    - name: dragonfly
      namespace: dbms
    - name: infisical
      namespace: external-secrets
    - name: kopiur-repository
      namespace: kopiur-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: symlinks
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/silo/app
  postBuild:
    substitute:
      APP: *app
      CNPG_NAME: postgres18
      # Greenfield app: keep kopiur's deploy-or-restore default instead of the
      # fail-closed KOPIUR_ON_MISSING_SNAPSHOT: Fail the migrated apps use.
      KOPIUR_CAPACITY: 25Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
