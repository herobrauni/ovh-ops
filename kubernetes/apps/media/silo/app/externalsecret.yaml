---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: silo-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Master key for Silo's at-rest credential encryption (>=32 chars,
        # required at startup). Losing it makes every server-stored secret
        # unrecoverable, so it is backed up separately from the database.
        SECRET_KEY: "{{ .secret_key }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: /silo/SECRET_KEY
