---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/externaldns.k8s.io/dnsendpoint_v1alpha1.json
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: silo
  labels:
    dns.scope: all
  annotations:
    dns.scope: all
spec:
  endpoints:
    # Web app, native API and native apps.
    - dnsName: silo.480p.com
      recordType: CNAME
      targets:
        - public.480p.com
    # Jellyfin/Emby-compatible listener (container port 8096). Jellyfin
    # ecosystem clients take their own address per service, so it gets its own
    # hostname instead of sharing the web app's.
    - dnsName: silo-jf.480p.com
      recordType: CNAME
      targets:
        - public.480p.com
