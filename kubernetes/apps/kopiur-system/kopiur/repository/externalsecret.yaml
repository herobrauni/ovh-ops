---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: kopiur-repository
    template:
      data:
        # Well-known kopiur SFTP keys (KOPIA_SFTP_KEY_DATA / KOPIA_SFTP_KNOWN_HOSTS
        # / KOPIA_PASSWORD). The Infisical values are the same ones the volsync
        # fork's kopia movers used — the repository is adopted, not re-created.
        KOPIA_SFTP_KEY_DATA: "{{ .SFTP_KEY_FILE }}"
        KOPIA_SFTP_KNOWN_HOSTS: "{{ .SFTP_KNOWN_HOSTS_DATA }}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: /volsync-template/KOPIA_PASSWORD
    - secretKey: SFTP_KEY_FILE
      remoteRef:
        key: /volsync-template/SFTP_KEY_FILE
    - secretKey: SFTP_KNOWN_HOSTS_DATA
      remoteRef:
        key: /kopia_known_hosts/SFTP_KNOWN_HOSTS_DATA
