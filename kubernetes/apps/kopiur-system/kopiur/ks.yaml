---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur
spec:
  dependsOn:
    - name: infisical
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/kopiur-system/kopiur/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kopiur-system
  # Gate on a healthy operator (CRDs + webhook, failurePolicy: Fail) before
  # kopiur-repository applies kopiur CRs — same shape as the volsync operator KS.
  wait: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kopiur-repository
spec:
  dependsOn:
    - name: infisical
      namespace: external-secrets
    - name: kopiur
      namespace: kopiur-system
    - name: snapshot-controller
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/kopiur-system/kopiur/repository
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kopiur-system
  # SFTP connection details are substituted from Infisical (never committed):
  # the ExternalSecret creating kopiur-sftp-config lives in the kopiur/app
  # Kustomization (this one depends on it) — a substituteFrom Secret created in
  # the SAME Kustomization deadlocks the build before anything is applied.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: kopiur-sftp-config
  wait: true
