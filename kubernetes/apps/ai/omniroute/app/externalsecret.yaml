---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omniroute
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: omniroute-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        API_KEY_SECRET: "{{ .API_KEY_SECRET }}"
        INITIAL_PASSWORD: "{{ .INITIAL_PASSWORD }}"
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: /omniroute/JWT_SECRET
    - secretKey: API_KEY_SECRET
      remoteRef:
        key: /omniroute/API_KEY_SECRET
    - secretKey: INITIAL_PASSWORD
      remoteRef:
        key: /omniroute/INITIAL_PASSWORD
