---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: omniroute
  interval: 30m
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: omniroute-secret
        containers:
          app:
            image:
              repository: docker.io/diegosouzapw/omniroute
              tag: 3.8.49@sha256:92c768c56e2de32c51a0621ef182835018b00b288c9bb235c5c5e4514658c1a1
            env:
              DATA_DIR: /app/data
              PORT: &port 20128
              DASHBOARD_PORT: *port
              DISABLE_SQLITE_AUTO_BACKUP: "false"
              DISABLE_NEW_RELEASE_CHECK: "true"
            envFrom:
              - secretRef:
                  name: omniroute-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/monitoring/health
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                <<: *probe
              startup:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/monitoring/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        primary: true
        controller: omniroute
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: omniroute
        globalMounts:
          - path: /app/data

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Tools
          gethomepage.dev/name: OmniRoute
          gethomepage.dev/pod-selector: app.kubernetes.io/name=omniroute
          gethomepage.dev/icon: mdi-rocket-launch
          gethomepage.dev/href: https://omniroute.brauni.dev
        hostnames:
          - omniroute.brauni.dev
        parentRefs:
          - name: envoy-brauni-dev-public
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
