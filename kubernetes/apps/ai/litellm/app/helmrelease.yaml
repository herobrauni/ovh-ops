---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm
spec:
  chartRef:
    kind: OCIRepository
    name: litellm
  interval: 30m
  timeout: 15m
  driftDetection:
    mode: enabled
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      litellm:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: litellm-secret,litellm-pguser-secret
        initContainers:
          01-init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: litellm-initdb-secret
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm-non_root
              tag: v1.99.0@sha256:64a3c0e3b13502ddb3cbb4e52a3eca3165f7fa3f8c6a4f3cf8cd0b4c5acd8b21
            args:
              - --port=4000
              - --config=/app/config.yaml
            env:
              STORE_MODEL_IN_DB: "True"
              LITELLM_NON_ROOT: "true"
              HOME: /tmp
              XDG_CACHE_HOME: /app/cache
              LITELLM_MIGRATION_DIR: /app/migrations
              PYTHONDONTWRITEBYTECODE: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: litellm-pguser-secret
                    key: uri_no_ssl
            envFrom:
              - secretRef:
                  name: litellm-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: &port 4000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi

    service:
      app:
        primary: true
        controller: litellm
        ports:
          http:
            port: *port

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: LiteLLM
          gethomepage.dev/pod-selector: app.kubernetes.io/name=litellm
          gethomepage.dev/icon: si-litellm
          gethomepage.dev/description: LLM Gateway
        hostnames:
          - litellm.brauni.dev
        parentRefs:
          - name: envoy-brauni-dev-public
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port

    configMaps:
      config:
        data:
          config.yaml: |-
            # LiteLLM proxy config; models are managed via the UI/database
            # (STORE_MODEL_IN_DB=True) or by adding entries here.
            model_list: []
            litellm_settings:
              # Response cache + shared virtual-key auth cache on the
              # app-scoped Dragonfly instance (Redis-compatible).
              cache: true
              enable_redis_auth_cache: true
              cache_params:
                type: redis
                host: litellm-dragonfly.ai.svc.cluster.local
                port: "6379"
                namespace: litellm
                ttl: 300
            general_settings:
              store_model_in_db: true

    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/cache
      migrations:
        type: emptyDir
        globalMounts:
          - path: /app/migrations
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
