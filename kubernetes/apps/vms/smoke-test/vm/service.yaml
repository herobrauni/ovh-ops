---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/k8s.io/service_v1.json
# Stable SSH endpoint for the smoke-test VM. With masquerade networking the
# guest is reached through the virt-launcher pod IP (inbound traffic is
# DNAT'd to 10.0.2.15), but that pod is replaced on every restart and
# migration. This service pins a stable name:
#   kubectl port-forward -n vms svc/smoke-test 2222:22
#   ssh -p 2222 alpine@127.0.0.1
apiVersion: v1
kind: Service
metadata:
  name: smoke-test
spec:
  selector:
    vm.kubevirt.io/name: smoke-test
  ports:
    - name: ssh
      port: 22
      targetPort: 22
