---
# yayamlls-disable-file
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  credentialProjection:
    enabled: true
  mover:
    # 16Gi fits the repo-wide kopia budgets (8192 content + 2x2048 metadata /
    # index-blobs MiB) with headroom; the volume is a per-run generic ephemeral
    # RBD and only materializes while a restore actually runs.
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=16Gi}
      mode: Ephemeral
      storageClassName: ceph-block
    podSecurityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=1000}
      runAsGroup: ${KOPIUR_MOVER_GID:=1000}
      fsGroup: ${KOPIUR_MOVER_GID:=1000}
  policy:
    # Greenfield default: keep deploying on an empty repo (deploy-or-restore).
    # Migrated apps set KOPIUR_ON_MISSING_SNAPSHOT: Fail — their history
    # already exists, and a silently-empty DR volume is the worse failure.
    onMissingSnapshot: ${KOPIUR_ON_MISSING_SNAPSHOT:=Continue}
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
