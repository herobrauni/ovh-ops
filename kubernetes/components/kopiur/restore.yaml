---
# yayamlls-disable-file
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  credentialProjection:
    enabled: true
  mover:
    # Large kopia restores exceeded smaller caches in the volsync era
    # (EmptyDir eviction); keep the proven 32Gi default.
    cache:
      capacity: ${KOPIUR_CACHE_CAPACITY:=32Gi}
    podSecurityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=1000}
      runAsGroup: ${KOPIUR_MOVER_GID:=1000}
      fsGroup: ${KOPIUR_MOVER_GID:=1000}
  policy:
    # Greenfield default: keep deploying on an empty repo (deploy-or-restore).
    # Migrated apps set KOPIUR_ON_MISSING_SNAPSHOT: Fail — their history
    # already exists, and a silently-empty DR volume is the worse failure.
    onMissingSnapshot: ${KOPIUR_ON_MISSING_SNAPSHOT:=Continue}
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
