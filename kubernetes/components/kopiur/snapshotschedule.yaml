---
# yayamlls-disable-file
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}
spec:
  policyRef:
    name: ${APP}
  schedule:
    cron: "${KOPIUR_SCHEDULE:=0 */6 * * *}"
    # Deterministic per-schedule jitter, derived from (scheduleUID, slot): each
    # app fires within 55m after the top of the slot instead of 28 simultaneous
    # movers in one 10-minute burst (hostypanel rejects concurrent subsystem
    # requests, and the pile-up saturated w-ovhsbg3 RBD IO hard enough to show
    # up as etcdMemberCommunicationSlow every 6h window).
    jitter: 55m
