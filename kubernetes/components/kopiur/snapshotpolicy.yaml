---
# yayamlls-disable-file
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd-fastest
  copyMethod: Snapshot
  # Pull the projected kopiur-repository credentials into this namespace
  # (gated by ClusterRepository/sftp credentialProjection.allowed).
  credentialProjection:
    enabled: true
  mover:
    podSecurityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=1000}
      runAsGroup: ${KOPIUR_MOVER_GID:=1000}
      fsGroup: ${KOPIUR_MOVER_GID:=1000}
  repository:
    kind: ClusterRepository
    name: sftp
  # GFS retention — the ONLY thing that prunes successful snapshots, and the
  # buckets are a union in which an ABSENT bucket keeps nothing, so each one is
  # declared explicitly (see AGENTS.md). These defaults keep the long-horizon
  # points the volsync fork effectively kept forever, bounded to ~6 months:
  # ~3 days at 6-hourly granularity, daily out to 2 weeks, weekly out to
  # 2 months, then monthly. Override per app with the KOPIUR_KEEP_* substitutes.
  retention:
    keepHourly: ${KOPIUR_KEEP_HOURLY:=12}
    keepDaily: ${KOPIUR_KEEP_DAILY:=14}
    keepLatest: ${KOPIUR_KEEP_LATEST:=}
    keepWeekly: ${KOPIUR_KEEP_WEEKLY:=8}
    keepMonthly: ${KOPIUR_KEEP_MONTHLY:=6}
    keepAnnual: ${KOPIUR_KEEP_ANNUAL:=1}
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
      # MUST stay /data: kopiur's default source path is /pvc/<name>, but the
      # volsync fork recorded every snapshot under <app>@<ns>:/data — without
      # this pin the history forks at migration time and restores cannot see
      # pre-migration snapshots (kopiur's own migrate tool pins the same value).
      sourcePathOverride: /data
  upload:
    maxParallelFileReads: 2
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
