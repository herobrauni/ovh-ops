---
# yayamlls-disable-file
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd-fastest
  copyMethod: Snapshot
  # Pull the projected kopiur-repository credentials into this namespace
  # (gated by ClusterRepository/sftp credentialProjection.allowed).
  credentialProjection:
    enabled: true
  mover:
    podSecurityContext:
      runAsUser: ${KOPIUR_MOVER_UID:=1000}
      runAsGroup: ${KOPIUR_MOVER_GID:=1000}
      fsGroup: ${KOPIUR_MOVER_GID:=1000}
  repository:
    kind: ClusterRepository
    name: sftp
  # GFS retention — the ONLY thing that prunes successful snapshots, and the
  # buckets are a union in which an ABSENT bucket keeps nothing, so each one is
  # declared explicitly (see docs/agents/backups.md). These defaults keep the long-horizon
  # points the volsync fork effectively kept forever, bounded to ~6 months:
  # ~3 days at 6-hourly granularity, daily out to 2 weeks, weekly out to
  # 2 months, then monthly. Override per app with the KOPIUR_KEEP_* substitutes.
  retention:
    keepHourly: ${KOPIUR_KEEP_HOURLY:=12}
    keepDaily: ${KOPIUR_KEEP_DAILY:=14}
    keepLatest: ${KOPIUR_KEEP_LATEST:=}
    keepWeekly: ${KOPIUR_KEEP_WEEKLY:=8}
    keepMonthly: ${KOPIUR_KEEP_MONTHLY:=6}
    keepAnnual: ${KOPIUR_KEEP_ANNUAL:=1}
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
      # MUST stay /data: kopiur's default source path is /pvc/<name>, but the
      # volsync fork recorded every snapshot under <app>@<ns>:/data — without
      # this pin the history forks at migration time and restores cannot see
      # pre-migration snapshots (kopiur's own migrate tool pins the same value).
      sourcePathOverride: /data
  upload:
    maxParallelFileReads: 2
  # First-class verification (upstream `spec.verification`, opt-in: absent ⇒ no
  # verification ever runs). `quick` is `kopia snapshot verify` SCOPED to this
  # policy's own identity (`--sources <policy>@<ns>:<path>`), so on the shared
  # ClusterRepository each app walks only its own retained snapshots instead of
  # the whole repository. Tuning defaults are left to kopia unless overridden.
  #
  # `verifyFilesPercent` is deliberately NOT set: any non-zero value fully READS
  # that percentage of *files* over the SFTP backend, so 1% of a 6 GiB media file
  # is still a 6 GiB download. Index/blob-level verification already catches the
  # failure that breaks restores (a referenced content blob missing from the
  # repo) at index-read cost. Opt in per app with KOPIUR_VERIFY_FILES_PERCENT for
  # small config volumes where a sampled full read is cheap.
  verification:
    quick:
      schedule:
        # `H` = deterministic per-policy minute (kopiur resolves it in next_fire).
        # Verification Jobs do NOT draw from the repository's mover concurrency
        # cap, so without a wide jitter all 32 policies would hit the single
        # SFTP host in the same minute. Jitter spreads them over ~6h.
        cron: "${KOPIUR_VERIFY_QUICK_CRON:=H 3 * * *}"
        jitter: "${KOPIUR_VERIFY_QUICK_JITTER:=6h}"
      maxErrors: 0
      parallel: ${KOPIUR_VERIFY_QUICK_PARALLEL:=4}
    # CAUTION — do not "improve" this into `stats.files > 0`. On the quick tier
    # `stats.files` is kopia's manifest `fileCount`, which counts NEW/changed
    # files, not the snapshot's total: an unchanged volume (plex, sonarr) reports
    # 0 on every run and the predicate would fail daily. `stats.errors` is
    # hardcoded 0 on both tiers, so this default is effectively permissive — the
    # mover already fails closed with `VerifyNoSnapshot` when the identity has no
    # manifest at all (the #456 false pass). Apps that also run `deep` (see
    # components/kopiur-verify-deep) override this with the tier-aware form.
    successExpr: "${KOPIUR_VERIFY_SUCCESS_EXPR:=stats.errors == 0}"
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
