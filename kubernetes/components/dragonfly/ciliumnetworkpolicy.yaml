---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-dragonfly
spec:
  endpointSelector:
    matchLabels:
      app: ${APP}-dragonfly
      app.kubernetes.io/name: dragonfly
  ingress:
    # Data port: the app's own pods (and any sidecar that shares its label).
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - ${APP}
                - ${APP}-machine-learning
                - dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Admin port 9999 (resources.DragonflyAdminPort): the operator reads
    # `INFO persistence` from the instance pod IP there to decide
    # dataset-loaded/master (internal/controller/dragonfly_instance.go,
    # isDatasetLoaded). That call is what sets the `role: master` pod label, and
    # the generated Service selects on it — with the probe denied, a new
    # instance never gets an endpoint, its ClusterIP silently drops, and the app
    # sees an i/o timeout (not connection refused) against a pod that is Running
    # and listening. The operator needs no access to the data port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dbms
            app.kubernetes.io/name: dragonfly-operator
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
  ingressDeny:
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: NotIn
              values:
                - ${APP}
                - ${APP}-machine-learning
                - dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
