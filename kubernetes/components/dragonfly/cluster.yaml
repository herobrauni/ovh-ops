---
# yayamlls-disable-file
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}-dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0@sha256:7426fdb31ddcf7bd9499b4205f36ebaa83b26149ba1609a0d5f8f474b3631233
  replicas: ${DRAGONFLY_REPLICAS:=1}
  snapshot:
    cron: ${DRAGONFLY_SNAPSHOT_CRON:="*/5 * * * *"}
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        # Sized for a single snapshot set plus headroom, not for history: with
        # the fixed --dbfilename below each snapshot overwrites the previous
        # one, so usage stays flat at roughly the dataset size. Overriding
        # DRAGONFLY_SNAPSHOT_DBFILENAME with a {timestamp} macro would write a
        # NEW set per run that Dragonfly never prunes and fill the volume.
        requests:
          storage: ${DRAGONFLY_SNAPSHOT_CAPACITY:=128Mi}
      storageClassName: ${DRAGONFLY_SNAPSHOT_STORAGECLASS:=ceph-block}
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --dbfilename=${DRAGONFLY_SNAPSHOT_DBFILENAME:=dump}
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --lock_on_hashtags
    - --default_lua_flags=allow-undeclared-keys
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
