# MinIO shard 1 (mini3). S3 staging target for rclone RGW bucket sync.
# TODO: pin image by digest once decided (renovate will pick it up).
---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-s3
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: staging-hostpath
  resources:
    requests:
      storage: 125Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-s3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio-s3
  template:
    metadata:
      labels:
        app: minio-s3
    spec:
      nodeSelector:
        kubernetes.io/hostname: mini3
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z # TODO: pin digest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-staging
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-staging
                  key: rootPassword
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-s3
---
# yaml-language-server: $schema=https://kubernetes-schemas.brauni.dev/discovery.k8s.io/service_v1.json
apiVersion: v1
kind: Service
metadata:
  name: minio-s3
spec:
  type: NodePort
  selector:
    app: minio-s3
  ports:
    - name: api
      port: 9000
      targetPort: api
      nodePort: 30903 # reachable from OVH via site tunnels: 10.100.15.63:30903
