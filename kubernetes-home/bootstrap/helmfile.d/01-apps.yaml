---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true

# Home-cluster bootstrap: minimal set to hand over to Flux.
# Chart values are read from the Flux HelmRelease manifests in
# ../../apps/... (single source of truth, same pattern as ../../bootstrap).
releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.20.1
    values:
      - ./templates/values.yaml.gotmpl

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.58.1
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/cilium

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.58.1
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - flux-system/flux-operator
