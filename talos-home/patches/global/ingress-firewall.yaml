# Talos ingress firewall — default deny, rehearsal of the OVH bare-metal target posture.
# Docs: https://docs.siderolabs.com/talos/v1.13/networking/ingress-firewall
#
# Always allowed regardless of rules: lo, siderolink, kubespan interfaces, rate-limited
# ICMP, and pod/service subnet traffic (native-routing CNIs).
#
# Apply first with: talosctl patch mc --mode=try (or via talhelper apply --mode=auto)
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
# Talos apid — management from the home infra VLAN only
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid
portSelector:
  ports:
    - 50000
  protocol: tcp
ingress:
  - subnet: 10.100.15.0/24
---
# Kubernetes API server
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubernetes-api
portSelector:
  ports:
    - 6443
  protocol: tcp
ingress:
  - subnet: 10.100.15.0/24
---
# etcd — control plane members only
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: etcd
portSelector:
  ports:
    - 2379-2380
  protocol: tcp
ingress:
  - subnet: 10.100.15.61/32
  - subnet: 10.100.15.62/32
  - subnet: 10.100.15.63/32
---
# kubelet — cluster members + management VLAN (metrics-server, debugging)
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubelet
portSelector:
  ports:
    - 10250
  protocol: tcp
ingress:
  - subnet: 10.100.15.0/24
---
# trustd
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: trustd
portSelector:
  ports:
    - 50001
  protocol: tcp
ingress:
  - subnet: 10.100.15.0/24
---
# Cilium VXLAN between nodes (tunnel mode)
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: cilium-vxlan
portSelector:
  ports:
    - 8472
  protocol: udp
ingress:
  - subnet: 10.100.15.0/24
---
# Cilium health checks between nodes
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: cilium-health
portSelector:
  ports:
    - 4240
  protocol: tcp
ingress:
  - subnet: 10.100.15.0/24
---
# KubeSpan WireGuard — must be reachable from anywhere: WAN peers
# (e.g. a mini temporarily joining the OVH cluster) connect from public IPs.
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: kubespan-wireguard
portSelector:
  ports:
    - 51820
  protocol: udp
ingress:
  - subnet: 0.0.0.0/0
