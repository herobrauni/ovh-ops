---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile
helmDefaults:
  cleanupOnFail: true
  wait: true
  waitForJobs: true
  args:
    - --include-crds
    - --no-hooks

releases:
  - name: envoy-gateway
    namespace: network
    # docker.io, not mirror.gcr.io: the mirror is only a Docker Hub alias for
    # image pulls (registryAliases in .renovaterc.json5), so a chart ref to it
    # makes Renovate's helmfile manager see depName docker.io/... but the literal
    # mirror.gcr.io/... in the file and abort with "depName mismatch" ->
    # "Error updating branch: update failure". This also matches the app-layer
    # OCIRepository url, so one branch updates both layers together.
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: v1.9.2

  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.24.0
    # Only this layer's CRDs are consumed (the release itself is managed by the
    # external-dns HelmRelease), but the chart's values schema makes `policy`
    # mandatory, so template fails without it. Mirror the live release.
    values:
      - policy: sync

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.26.0

  # - name: keda
  #   namespace: observability
  #   chart: oci://ghcr.io/home-operations/charts-mirror/keda
  #   version: 2.19.0

  - name: prometheus-operator-crds
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: 33.0.2
