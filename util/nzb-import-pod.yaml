---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/pod_v1.json
# One-off corpus import for docs/infinidysk-migration.md (Phase 3): streams
# zurg's NZBs into InfiniDysk's SAB API without copying them anywhere. Mounts
# zurg's PVC read-only and is pinned to zurg's node (RWO ceph-block allows a
# second reader on the same node).
#
# Usage:
#   kubectl -n media apply -f util/nzb-import-pod.yaml
#   kubectl -n media wait --for=condition=Ready pod/nzb-import --timeout=120s
#   kubectl -n media cp util/nzb-import.py nzb-import:/tmp/nzb-import.py
#   kubectl -n media exec nzb-import -- sh -c 'DRY_RUN=1 python3 /tmp/nzb-import.py'   # classify only
#   kubectl -n media exec nzb-import -- sh -c 'nohup python3 /tmp/nzb-import.py > /tmp/import.log 2>&1 &'
#   kubectl -n media exec nzb-import -- tail -f /tmp/import.log
#
# Delete the pod when the import is finished (it is not Flux-managed).
apiVersion: v1
kind: Pod
metadata:
  name: nzb-import
  namespace: media
  labels:
    app.kubernetes.io/name: nzb-import
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: w-ovhsbg3
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: import
      image: docker.io/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
      command:
        - sleep
        - infinity
      env:
        - name: INF_URL
          value: http://infinidysk.media.svc.cluster.local:3000
        # Backpressure: stop uploading while the InfiniDysk queue is this deep.
        - name: MAX_QUEUE
          value: "150"
        - name: SAB_API_KEY
          valueFrom:
            secretKeyRef:
              name: infinidysk-secret
              key: NZBDAV_CONFIG__API__KEY
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 512Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: zurg
          mountPath: /zurg
          readOnly: true
        - name: work
          mountPath: /tmp
  volumes:
    - name: zurg
      persistentVolumeClaim:
        claimName: zurg
        readOnly: true
    - name: work
      emptyDir: {}
