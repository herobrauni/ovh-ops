flux2 = "2.10.0"
gh = "2.103.3"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
k9s = "0.51.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "24.22.1"
oxfmt = "0.72.0"
sops = "3.13.3"
talosctl = "1.14.5"
task = "3.54.0"
yq = "4.54.1"
zizmor = "1.31.1"
"aqua:kubevirt/kubevirt/virtctl" = "1.9.1"
"github:cilium/cilium-cli" = "0.20.1"
"github:controlplaneio-fluxcd/flux-operator" = "0.62.1"
"github:home-operations/flate" = "v0.6.5"
"github:home-operations/yayamlls" = "0.3.2"
